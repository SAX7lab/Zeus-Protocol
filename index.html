function saveItem(){
  if(sheetType==='panel'){
    const p=PANELS.find(x=>x.id===editing);
    if(p){
      p.label=document.getElementById('f-name').value.trim();
      const dv=document.getElementById('p-date').value;
      if(dv) p.date=dv;
      sortPanels(); resetCompare();
    }
    closeSheet(); render(); return;
  }
  if(sheetType==='eat'){
    const t=document.getElementById('eat-start-in').value;
    const dur=parseFloat(document.getElementById('eat-dur-in').value);
    if(t && isFinite(dur) && dur>0){
      const [h,m]=t.split(':').map(Number);
      EAT_START=h+m/60;
      EAT_END=Math.min(24,EAT_START+dur);
    }
    closeSheet(); render(); return;
  }
  const name=document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-name').focus(); return; }

  if(sheetType==='event'){
    const data={ title:name,
      time:document.getElementById('e-time').value||'09:00',
      dur:parseInt(document.getElementById('e-dur').value)||60,
      cat:'event', optional:false };
    if(eMode==='once'){
      data.date=document.getElementById('e-date').value||dk(); data.days=undefined;
    } else {
      data.date=undefined;
      data.days=eSelDows.length===7?undefined:[...eSelDows].sort((a,b)=>a-b);
    }
    data.notes=descDraft.notes||'';
    data.checklist=descDraft.checklist||[];
    if(editing) Object.assign(ROUTINES.find(r=>r.id===editing),data);
    else ROUTINES.push({id:'e'+Date.now(),...data});
    if(data.date){                                   // zum Datum springen
      const [y,m,d]=data.date.split('-').map(Number);
      viewDate=new Date(y,m-1,d); viewDate.setHours(0,0,0,0);
    }
    closeSheet(); render(); return;
  }

  if(sheetType==='routine'){
    const data={title:name,time:document.getElementById('f-time').value||'08:00',
      dur:parseInt(document.getElementById('f-dur').value)||15,
      cat:document.getElementById('f-cat').value, optional:isOptional};
    if(mode==='once'){ data.date=document.getElementById('f-date').value||dk(); data.days=undefined; }
    else { data.date=undefined; data.days=selDows.length===7?undefined:[...selDows].sort(); }
    data.notes=descDraft.notes||''; data.checklist=descDraft.checklist||[];
    if(editing) Object.assign(ROUTINES.find(r=>r.id===editing),data);
    else ROUTINES.push({id:'c'+Date.now(),...data});
  } else {
    const bid=document.getElementById('f-block').value;
    const data={name,sub:document.getElementById('f-sub').value.trim()||'—',
      dose:document.getElementById('f-dose').value.trim()||'—',
      notes:descDraft.notes||'', checklist:descDraft.checklist||[]};
    if(editing){
      const [obid,iid]=editing.split(':');
      const ob=SUPP_BLOCKS.find(b=>b.id===obid);
      const idx=ob.items.findIndex(x=>x.id===iid);
      const item={...ob.items[idx],...data};
      if(obid!==bid){ ob.items.splice(idx,1); SUPP_BLOCKS.find(b=>b.id===bid).items.push(item); }
      else ob.items[idx]=item;
    } else SUPP_BLOCKS.find(b=>b.id===bid).items.push({id:'c'+Date.now(),...data});
  }
  closeSheet(); render();
}
function deleteCurrent(){
  if(!editing) return;
  const id=editing;
  closeSheet();                       // closeSheet clears `editing`, so capture it first
  if(sheetType==='supp'){
    const [bid,iid]=id.split(':'); const b=SUPP_BLOCKS.find(x=>x.id===bid); if(!b) return;
    const i=b.items.findIndex(x=>x.id===iid); if(i<0) return;
    const it=b.items[i];
    deleteWithUndo(it.name, ()=>b.items.splice(i,1), ()=>b.items.splice(i,0,it));
  } else if(sheetType==='task'){
    const i=TASKS.findIndex(t=>t.id===id); if(i<0) return;
    const t=TASKS[i];
    deleteWithUndo(t.title, ()=>TASKS.splice(i,1), ()=>TASKS.splice(i,0,t));
  } else {
    const i=ROUTINES.findIndex(r=>r.id===id); if(i<0) return;
    const r=ROUTINES[i];
    deleteWithUndo(r.title, ()=>ROUTINES.splice(i,1), ()=>ROUTINES.splice(i,0,r));
  }
}
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeSheet(); });

/* ---------- ICS EXPORT ---------- */
const icsDate=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
  pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
function vevent(uid,title,time,durMin,note,onDay){
  const base=onDay||viewDate;
  const [h,m]=time.split(':').map(Number);
  const start=new Date(base); start.setHours(h,m,0,0);
  const end=new Date(start.getTime()+durMin*60000);
  return ['BEGIN:VEVENT','UID:'+uid+'-'+key(base)+'@routine','DTSTAMP:'+icsDate(new Date()),
    'DTSTART:'+icsDate(start),'DTEND:'+icsDate(end),'SUMMARY:'+title,
    ...(note?['DESCRIPTION:'+note]:[]),
    'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT'].join('\r\n');
}
const wrapCal=e=>['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Routine//EN','CALSCALE:GREGORIAN',
  'METHOD:PUBLISH',...e,'END:VCALENDAR'].join('\r\n');
function download(content,name,mime){
  const b=new Blob([content],{type:mime||'text/calendar;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
const exportAllRoutines=()=>download(wrapCal(activeRoutinesOn(viewDate).map(r=>vevent(r.id,r.title,r.time,r.dur))),'routine-'+dk()+'.ics');
function exportSupps(){
  const ev=SUPP_BLOCKS.filter(b=>b.items.length).map(b=>{
    const list=b.items.map(i=>i.name+' ('+i.dose+')').join(', ');
    return vevent('supp-'+b.id,'Supplements: '+b.title,b.time,10,list+(b.wait?' — '+b.wait:''));
  });
  download(wrapCal(ev),'supplements-'+dk()+'.ics');
}
function exportEverything(){
  const ev=activeRoutinesOn(viewDate).map(r=>vevent(r.id,r.title,r.time,r.dur));
  SUPP_BLOCKS.filter(b=>b.items.length).forEach(b=>ev.push(
    vevent('supp-'+b.id,'Supplements: '+b.title,b.time,10,b.items.map(i=>i.name+' ('+i.dose+')').join(', '))));
  download(wrapCal(ev),'day-'+dk()+'.ics');
}

/* ---------- COLD-OPEN BRIEFING ----------
   Jarvis reports before he is asked. Runs once per calendar day: the app is
   already rendered behind it, so this is never load-blocking, and a tap
   dismisses it immediately.

   Its "seen" stamp lives in its own storage key rather than in the app
   state, deliberately — it is per-device view state, not data the user
   owns, and it has no business in the backup export. */
/* ---------- SPOKEN BRIEFING ----------
   speechSynthesis is a built-in browser API: no library, no fetch, works
   offline — the only speech option that satisfies the one-file rule.

   iOS Safari imposes two constraints this is built around:
     - speak() must be reached synchronously from a user gesture, so the
       button calls it directly and never awaits anything first;
     - getVoices() is usually empty on first call and only fills after a
       'voiceschanged' event, so a voice is never required — the platform
       default is perfectly good, and a better one is adopted if it turns
       up later. */
const speechOK=()=>'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
/* Alex, chosen on the device. Apple ships no Southern-US voice, so a
   McConaughey impression is not on the table — Alex is simply the deepest,
   most natural American male Apple has. A slowed rate was tried for the
   drawl and dropped again: it read as sluggish rather than laid-back, so
   only the lowered pitch remains.

   Note this list OVERRIDES the phone's own default voice: setting Alex in
   iOS Settings alone does not reach the app, because a named match here
   wins over whatever the platform hands back.

   Only American names are listed now. They previously ran on into moira,
   órla, arthur and daniel, which produced the wrong outcome in the case
   that actually matters: iOS exposes only a subset of the system voices to
   web content, and Alex — a long-standing macOS voice — is frequently not
   among them. Every American name then missed, 'moira' hit, and the
   briefing spoke Irish despite Alex being selected on the device. With the
   Irish and British names gone, an unmatched list falls through to the
   locale passes below, which try en-US first. Matching by name rather than
   filtering by language stays deliberate: SpeechSynthesisVoice exposes no
   gender field, so a plain en-US filter is a coin toss between Samantha
   and Alex. */
const VOICE_PREFS=['moira','órla','orla','siobhán','siobhan','serena','martha'];
/* SpeechSynthesisVoice carries no gender field — it is not in the spec — so
   gender can only be steered by knowing the names. The lists stay; only the
   direction flipped. Alex was tried and rejected by ear, so Moira is back as
   the target and a female voice is now what the fallback should reach for.
   Names cover Apple's iOS/macOS set plus Chrome. */
const MALE_NAMES=['alex','aaron','evan','nathan','tom','daniel','arthur','malcolm',
  'oliver','gordon','lee','rishi','fred','ralph','albert','junior','reed','rocko',
  'eddy','grandpa','google uk english male'];
const FEMALE_NAMES=['samantha','karen','moira','órla','orla','tessa','fiona','serena',
  'martha','nicky','susan','allison','ava','zoe','noelle','kate','catherine','siobhán',
  'siobhan','flo','sandy','shelley','grandma','kathy','veena','amelie',
  'google uk english female','google us english'];
const nameIn=(v,list)=>list.some(n=>(v.name||'').toLowerCase().includes(n));
const englishVoices=()=>{
  try{ return (speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang||'')); }
  catch(e){ return []; }
};
let briefVoice=null;
function briefPickVoice(){
  const vs=englishVoices();
  if(!vs.length) return null;
  for(const n of VOICE_PREFS){
    const matches=vs.filter(v=>(v.name||'').toLowerCase().includes(n));
    // Enhanced/Premium variants share the base name and sound markedly
    // better, so prefer a local match — those are the downloaded ones.
    if(matches.length) return matches.find(v=>v.localService)||matches[0];
  }
  // Named preferences missed. Reach for ANY known female voice before
  // considering locale — the wrong gender is more jarring than the wrong
  // accent, which is the same rule as before, just pointed the other way.
  // Separate passes, not one regex with alternation: alternation order in a
  // filter predicate affects neither which voices match nor their order.
  const females=vs.filter(v=>nameIn(v,FEMALE_NAMES));
  for(const re of [/^en[-_]IE/i, /^en[-_]GB/i, /./]){
    const pool=females.filter(v=>re.test(v.lang||''));
    if(pool.length) return pool.find(v=>v.localService)||pool[0];
  }
  // No recognisable female voice at all: take anything not known to be
  // male before resorting to the first entry.
  const neutral=vs.filter(v=>!nameIn(v,MALE_NAMES));
  if(neutral.length) return neutral.find(v=>v.localService)||neutral[0];
  return vs.find(v=>v.localService)||vs[0];
}
if(speechOK()){
  briefVoice=briefPickVoice();
  // Voices usually arrive after first paint, so re-resolve when they do —
  // the first call almost always comes back empty.
  try{ speechSynthesis.addEventListener('voiceschanged',()=>{
    briefVoice=briefPickVoice();
  }); }catch(e){}
}

// hm() renders "2 h 10 min", which a synthesiser reads as "two h ten min".
const spokenHM=x=>{
  const {h,m}=splitHM(x);
  const p=[];
  if(h) p.push(h+(h===1?' hour':' hours'));
  if(m) p.push(m+(m===1?' minute':' minutes'));
  return p.length?p.join(' and '):'less than a minute';
};
// "07:05" spoken as-is can come out "zero seven zero five".
const spokenTime=t=>{ const [h,m]=t.split(':').map(Number);
  return m===0 ? h+" o'clock" : h+':'+pad(m); };

/* Shared by the briefing and the audition. Kept separate from the caller's
   try so a rejected voice costs the accent, not the whole utterance. */
function applyVoice(u){
  const v=briefVoice||briefPickVoice();
  u.lang=(v&&v.lang)||'en-GB';
  if(!v) return;
  try{ u.voice=v; }catch(e){ /* platform default it is */ }
}

/* Jarvis's register: formal, dry, addresses you as sir — once at the open
   and once at the close, since every sentence would be parody. Punctuation
   is doing real work here; synthesisers pause on commas and full stops, and
   that measured cadence is as much of the character as the accent. */
function briefingSpeech(){
  const now=new Date(), hr=now.getHours();
  const {total,done,pct}=arcCompletionPct();
  const st=eatingState(now);
  const nx=arcNextUp();
  const hello=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const parts=[hello+', sir. All systems online.'];
  parts.push(total
    ? `You are ${pct} percent through the day. ${done} of ${total} complete.`
    : 'Nothing is scheduled today.');
  parts.push(st.mode==='eating'
    ? `Your eating window is open, with ${spokenHM(st.left)} remaining.`
    : `Fasting continues for a further ${spokenHM(st.left)}.`);
  parts.push(nx
    ? `Next on your schedule, ${spokenTime(nx.time)}. ${nx.name}.`
    : 'Nothing further is scheduled today, sir.');
  return parts.join(' ');
}

let briefSpeaking=false;
function briefSetSpeaking(on){
  briefSpeaking=on;
  const b=document.getElementById('bootSpeak');
  if(b){ b.classList.toggle('on',on); b.textContent=on?'◼ Stop':'▶ Brief me'; }
  // While it is talking the overlay stays put; once it finishes, let the
  // normal dismissal resume rather than stranding the briefing on screen —
  // unless this was opened by hand, which never times out.
  if(!on && !bootManual && document.getElementById('boot') && !document.getElementById('boot').hidden){
    clearTimeout(bootTimer);
    bootTimer=setTimeout(bootDismiss,1600);
  }
}
function briefSpeak(e){
  if(e) e.stopPropagation();            // the whole overlay is a dismiss target
  if(!speechOK()) return;
  if(briefSpeaking){ briefStop(); return; }
  // Holding the overlay open is the point of pressing this.
  clearTimeout(bootTimer);
  try{
    speechSynthesis.cancel();           // iOS wedges if an old utterance is pending
    const u=new SpeechSynthesisUtterance(briefingSpeech());
    // Voice assignment in its own try: the setter rejects anything that is
    // not a real SpeechSynthesisVoice, and a stale entry from a
    // 'voiceschanged' race should degrade to the platform default rather
    // than swallow the whole utterance and leave it silent.
    applyVoice(u);
    // Measured and slightly lowered. Jarvis is never hurried, and the
    // default rate reads as a station announcement rather than an aide.
    // Pace kept where it was asked for. Pitch back to 0.9, the value in
    // place when this voice was judged best — 0.85 was tuned for a deep
    // male voice and drags a female one down unnaturally.
    u.rate=1.15; u.pitch=0.9;
    u.onend=()=>briefSetSpeaking(false);
    u.onerror=()=>briefSetSpeaking(false);
    briefSetSpeaking(true);
    speechSynthesis.speak(u);
  }catch(err){ briefSetSpeaking(false); }
}
function briefStop(){
  try{ speechSynthesis.cancel(); }catch(e){}
  briefSetSpeaking(false);
}

const BOOT_KEY='zeus.briefing.lastSeen';
const bootReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function bootLines(){
  const now=new Date();
  const {total,done,pct}=arcCompletionPct();
  const st=eatingState(now);
  const nx=arcNextUp();
  const dateLbl=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const out=[
    `<div class="boot-line boot-mark" style="animation-delay:.05s">Z&#931;VS</div>`,
    `<div class="boot-rule" style="animation-delay:.30s"></div>`,
    `<div class="boot-line boot-meta" style="animation-delay:.45s">Online · ${esc(dateLbl)} · ${pad(now.getHours())}:${pad(now.getMinutes())}</div>`,
    `<div class="boot-line boot-stat" style="animation-delay:.70s"><b>${pct}%</b>
       <span>${done} of ${total} complete</span></div>`,
    `<div class="boot-line boot-meta" style="animation-delay:.90s">${st.mode==='eating'
         ? 'Eating window · '+esc(hm(st.left))+' remaining'
         : 'Fasting · '+esc(hm(st.left))+' until the window opens'}</div>`
  ];
  out.push(nx
    ? `<div class="boot-line boot-next" style="animation-delay:1.10s">Next · ${esc(nx.time)}
         <span>${esc(nx.name)}</span></div>`
    : `<div class="boot-line boot-next" style="animation-delay:1.10s">
         <span>Nothing further scheduled today</span></div>`);
  // Only offered where the platform can actually speak.
  if(speechOK()) out.push(
    `<button class="boot-speak boot-line" id="bootSpeak" style="animation-delay:1.30s"
       onclick="briefSpeak(event)">▶ Brief me</button>`);
  return out.join('');
}

let bootTimer=null;
/* manual = opened deliberately from the header mark, which is the one case
   that must NOT time out: you asked for it, so it waits to be dismissed.
   The once-a-day automatic open still closes itself — it appears unbidden,
   possibly while you are mid-something, and blocking every launch behind a
   tap would be worse than the briefing vanishing unread. */
let bootManual=false;
function bootShow(manual){
  const el=document.getElementById('boot'); if(!el) return;
  // Any pending dismissal belongs to the previous showing. Without this, the
  // automatic morning briefing's timer keeps running and closes a briefing
  // you reopened from the mark seconds later.
  clearTimeout(bootTimer);
  bootManual=!!manual;
  document.getElementById('bootInner').innerHTML=bootLines();
  if(!briefVoice) briefVoice=briefPickVoice();
  // Name the voice that actually won. Which voices iOS exposes to web
  // content is neither documented nor guessable, so the briefing says it
  // outright rather than leaving it to be inferred from the accent.
  const skip=document.getElementById('bootSkip');
  if(skip) skip.textContent='Tap to dismiss'+
    (speechOK()?' · voice: '+((briefVoice&&briefVoice.name)||'system default'):'');
  el.hidden=false;
  document.body.style.overflow='hidden';
  // The last line finishes arriving at ~1.5s, so this is dwell time on a
  // fully-formed briefing, not time spent waiting for it to assemble.
  // A tap still dismisses instantly, so erring long costs nothing.
  if(!bootManual) bootTimer=setTimeout(bootDismiss, bootReduced()?3600:5600);
}
function bootDismiss(){
  const el=document.getElementById('boot');
  if(!el||el.hidden) return;
  // Dismissing the briefing should silence it too — speech outliving the
  // panel it belongs to, with no visible way to stop it, is the worst case.
  // Before clearTimeout, not after: briefStop() re-arms the dismiss timer
  // on its way out, and that re-armed one is what needs cancelling.
  if(briefSpeaking) briefStop();
  clearTimeout(bootTimer);
  document.body.style.overflow='';
  // The arc overlay locks body scroll too; do not fight it if it is open.
  if(arcOverlayOpen) document.body.style.overflow='hidden';
  if(bootReduced()){ el.hidden=true; return; }
  el.classList.add('out');
  setTimeout(()=>{ el.hidden=true; el.classList.remove('out'); },460);
}
function bootMaybeShow(){
  let seen=null;
  try{ seen=localStorage.getItem(BOOT_KEY); }catch(e){}
  const today=key(new Date());
  if(seen===today) return;
  try{ localStorage.setItem(BOOT_KEY,today); }catch(e){}
  bootShow(false);
}
// Replayable on demand from the header mark, so it is not a once-a-day-only
// curiosity you cannot look at again.
function bootReplay(){ bootShow(true); }

loadAll();
ensureActiveTabVisible();
render();
// Belt and braces: the header Settings button is a static element, not
// gated by SECTIONS, so this should never actually fire — but settings
// being unreachable is a state the app must never persist, so if that
// button is ever missing or hidden from the DOM for any reason, force
// every section back on rather than leave the user with no way back in.
(function ensureSettingsReachable(){
  const btn=document.getElementById('settingsBtn');
  const reachable=btn && !btn.hidden && getComputedStyle(btn).display!=='none';
  if(reachable) return;
  SECTIONS=normalizeSections();
  saveAll();
  ensureActiveTabVisible();
  render();
})();
bootMaybeShow();
if(ANCHORED_TABS.includes(activeTab)) scrollToAnchor();
document.getElementById('tabs').addEventListener('scroll',syncTabFade,{passive:true});
window.addEventListener('resize',syncTabFade);
syncTabFade();
setInterval(()=>{ renderEatWindow(); updateNowLine(); arcTick(); },60000);
if(SUBS.length){ startSubTimer(); subFetchAll(true); }
cloudBootResume();
</script>
