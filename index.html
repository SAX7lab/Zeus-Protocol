document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const ev=parseICS(rd.result);
      if(!ev.length){ importInfo='No events found in that file.'; }
      else { IMPORTED=IMPORTED.concat(ev); importInfo='Imported '+ev.length+' event'+(ev.length>1?'s':'')+' from '+f.name; }
    }catch(err){ importInfo='Could not read that file. Make sure it is a .ics export.'; }
    e.target.value=''; render();
  };
  rd.readAsText(f);
});

/* ---------- RENDER ---------- */
function renderDate(){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=Math.round((viewDate-t)/86400000);
  const lbl=d===0?'Today':d===1?'Tomorrow':d===-1?'Yesterday':'';
  document.getElementById('date').textContent=(lbl?lbl+' · ':'')+
    viewDate.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
function shiftDay(n){ viewDate.setDate(viewDate.getDate()+n); render(); }
function goToday(){ viewDate=new Date(); viewDate.setHours(0,0,0,0); render(); }

/* Open a tab where the user actually is in their day, not at the top of a
   list they have already worked through. Each render marks one element with
   id="scrollAnchor" — the NOW line, the next unchecked row, the blood
   panels — and this scrolls it just under the fixed header. Only runs on tab
   switch and at boot, never on re-render, or ticking something would yank
   the page. Scrolling up is always available. */
function scrollToAnchor(){
  setTimeout(()=>{
    const el=document.getElementById('scrollAnchor');
    if(!el) return;
    const hh=isDesktopLayout()?0:document.querySelector('header').offsetHeight;
    const top=el.getBoundingClientRect().top+window.scrollY-hh-12;
    window.scrollTo({top:Math.max(0,top),behavior:'instant'});
  },0);
}
const ANCHORED_TABS=['agenda','routine','supps','bio','cal'];

// Marks the first row still open as the anchor, ignoring anything already
// ticked or switched off for the day.
function markFirstOpenRow(c){
  if(c.querySelector('#scrollAnchor')) return;
  const first=[...c.querySelectorAll('.row')]
    .find(r=>!r.classList.contains('done')&&!r.classList.contains('opt-off'));
  if(!first) return;
  /* Anchor the enclosing block, not the row, when there is one. Scrolling
     straight to the row leaves its .block-head — the block's title and time —
     just above the viewport, so you land on "Mg Complex" with no indication
     that it belongs to "Daytime / post-workout · 18:00".
     Self-scoping: only Supps groups rows into .block, so Routine and Agenda
     keep anchoring the row itself. */
  (first.closest('.block')||first).id='scrollAnchor';
}

function syncTabFade(){
  const w=document.getElementById('tabsWrap'), t=document.getElementById('tabs');
  if(!w||!t) return;
  w.classList.toggle('at-end', t.scrollLeft+t.clientWidth >= t.scrollWidth-2);
}

// ROADMAP.md 5.4: SECTIONS decides which tab buttons exist at all. The six
// buttons always stay in the DOM (setTab()'s [id="tab-"+x] lookups and the
// desktop rail rely on that) — this only toggles [hidden] on them.
function renderTabBar(){
  SECTION_KEYS.forEach(k=>{
    const b=document.getElementById('tab-'+k);
    if(b) b.hidden=!SECTIONS[k];
  });
}
function nearestVisibleTab(){
  return SECTION_KEYS.find(k=>SECTIONS[k]) || 'agenda';
}
// Called after anything that can change either SECTIONS or activeTab's
// eligibility (a toggle flip, a profile pull, boot). Falls back rather
// than ever leaving activeTab pointed at a hidden tab.
function ensureActiveTabVisible(){
  renderTabBar();
  if(!SECTIONS[activeTab]) setTab(nearestVisibleTab());
}
function setTab(t){
  if(t==='cal' && calMode==='day') calMode='week';   // tapping Calendar out of day view goes to the default week view, like Back
  activeTab=t; activeFilter='all';
  // Transient status text belongs to the form that produced it. Without
  // this, a blood-pressure validation error or a PDF import result stayed
  // on screen after navigating away and back.
  bpMsg=''; bioMsg='';
  SECTION_KEYS.forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===t));
  document.getElementById('pageTitle').textContent =
    t==='agenda'?'Agenda':t==='routine'?'Daily Routine':t==='supps'?'Supplements':
    t==='tasks'?'Tasks':t==='cal'?'Calendar':t==='integrations'?'Integrations':'Bio Analysis';
  // Tasks are not day-scoped and deliberately excluded from the daily
  // percentage, so it hides the day nav and progress bar like cal/bio do.
  // Integrations has its own per-metric day selection (actSelectedDay),
  // independent of the global day nav, same reasoning as bio.
  const chromeless = (t==='cal'||t==='bio'||t==='tasks'||t==='integrations');
  // The right rail keeps the status block visible on every tab at desktop
  // width (it's a persistent sidebar there, not part of the day header).
  document.getElementById('progWrap').style.display = (chromeless&&!isDesktopLayout())?'none':'block';
  document.querySelector('.daynav').style.display = chromeless?'none':'flex';
  document.querySelector('.fab').style.display = (t==='bio'||t==='integrations')?'none':'block';
  window.scrollTo(0,0);
  const btn=document.getElementById('tab-'+t);
  if(btn&&btn.scrollIntoView) btn.scrollIntoView({inline:'center',block:'nearest'});
  syncTabFade();
  render();
  if(ANCHORED_TABS.includes(t)) scrollToAnchor();
}

function renderFilters(){
  const box=document.getElementById('filters'); box.innerHTML='';
  if(activeTab!=='routine'){ box.style.display='none'; return; }
  box.style.display='flex';
  Object.entries(CATS).forEach(([k,v])=>{
    if(k==='event') return;
    const b=document.createElement('button');
    b.className='chip'+(activeFilter===k?' active':''); b.textContent=v;
    b.onclick=()=>{ activeFilter=k; render(); }; box.appendChild(b);
  });
}

// header is position:fixed (out of flow) so it stays put while everything
// below it scrolls; this keeps body's top padding matched to its actual
// height, which changes per tab (daynav and the status block show or hide).
function syncHeaderHeight(){
  const h=document.querySelector('header'); if(!h) return;
  // At desktop width the header is a full-height left rail, not a top bar,
  // so there is nothing for body's top padding to clear — leave the
  // stylesheet's own value (the safe-area inset) in place instead.
  document.body.style.paddingTop=isDesktopLayout()?'':h.offsetHeight+'px';
}
window.addEventListener('resize',()=>{ syncHeaderHeight(); renderRail(); arcOnResize(); });

// Desktop-only right rail: today's agenda and today's open tasks, condensed.
// Fixed to the actual calendar day, not viewDate — the rail doesn't navigate
// with the day nav, it's the one thing on screen that always means "today".
// No-ops on mobile, where #railBio/#railTasks stay behind [hidden].
/* The rail is a summary; these are its way back to the real thing. */
// Both guarded by SECTIONS.bio even though renderRail() already hides the
// whole #railBio box when it's off — that box is the only thing these
// bind to, but a hidden Bio tab should never be reachable full stop.
function railOpenBio(){ if(SECTIONS.bio) setTab('bio'); }
function railBioKey(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); railOpenBio(); } }
function railOpenMarker(e,k){
  if(e) e.stopPropagation();   // the whole section is also a target
  if(!SECTIONS.bio) return;
  setTab('bio');               // render the tab first, then open onto it
  openMarkerDetail(k);
}
function railMarkerKey(e,k){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); railOpenMarker(e,k); } }

function renderRail(){
  if(!isDesktopLayout()) return;
  const today=new Date(); today.setHours(0,0,0,0);
  /* Bio at a glance. This slot used to repeat today's agenda, which was
     redundant beside the agenda tab and stale everywhere else. Biomarkers
     are the opposite case: the only data in the app you have to go looking
     for, so they are what belongs in a rail that is always on screen. */
  const bioBox=document.getElementById('railBio');
  // Inline style, not [hidden]: the (min-width:900px) block below sets
  // #railBio{display:block} by ID, which beats [hidden]'s attribute
  // selector on specificity alone regardless of source order. Only an
  // inline style reliably wins over that.
  if(bioBox) bioBox.style.display=SECTIONS.bio?'':'none';
  if(bioBox&&SECTIONS.bio){
    const rows=[];
    const last=BP.length?BP[BP.length-1]:null;
    if(last){
      const b=bpBand(last);
      const age=Math.floor((dayStart(today)-dayStart(new Date(last.ts)))/86400000);
      rows.push(`<div class="rail-row"><span class="rail-time">BP</span>
        <span class="rail-title">${last.sys}/${last.dia}</span>
        <span class="bp-band ${b.cls}">${b.label}</span></div>`);
      rows.push(`<div class="rail-sub">${age===0?'measured today':age+' day'+(age===1?'':'s')+' ago'}</div>`);
    }
    if(PANELS.length){
      const panel=PANELS[PANELS.length-1];
      const vals=(panel.values||[]).filter(v=>v&&v.v!=null);
      const out=vals.filter(v=>inRange(v)===false);
      const days=Math.floor((dayStart(today)-dayStart(parseDay(panel.date)))/86400000);
      rows.push(`<div class="rail-row"><span class="rail-time">Panel</span>
        <span class="rail-title">${vals.length} marker${vals.length===1?'':'s'}</span>
        <span class="bp-band ${out.length?'elev':'ok'}">${out.length?out.length+' out':'all in'}</span></div>`);
      rows.push(`<div class="rail-sub">${days} day${days===1?'':'s'} since panel</div>`);
      // Name the markers that are actually out of range — a count alone
      // still means opening the tab to find out which.
      // Each carries its own key, so a row opens that marker's history
      // directly rather than dropping you at the top of the tab to hunt.
      out.slice(0,4).forEach(v=>rows.push(
        `<div class="rail-row sub" role="button" tabindex="0"
              onclick="railOpenMarker(event,'${esc(v.key)}')"
              onkeydown="railMarkerKey(event,'${esc(v.key)}')">
           <span class="rail-title">${esc(v.displayName||v.label)}</span>
           <span class="rail-val">${esc(String(v.v))}${v.unit?' '+esc(v.unit):''}</span></div>`));
      if(out.length>4) rows.push(`<div class="rail-sub">+${out.length-4} more out of range</div>`);
    }
    bioBox.innerHTML=`<div class="rail-h">Bio<span class="rail-go">Open ›</span></div>`+
      (rows.length?rows.join(''):'<div class="rail-empty">No readings yet.</div>');
  }
  const todayKey=key(today);
  const due=TASKS.filter(t=>!t.done&&t.date===todayKey)
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const tBox=document.getElementById('railTasks');
  if(tBox) tBox.style.display=SECTIONS.tasks?'':'none';
  if(tBox&&SECTIONS.tasks){
    const rows=due.map(t=>
      `<div class="rail-row"><span class="rail-time">${t.time?esc(t.time):'—'}</span><span class="rail-title">${esc(t.title||'Untitled')}</span></div>`
    ).join('');
    tBox.innerHTML=`<div class="rail-h">Due today</div>`+(rows||'<div class="rail-empty">Nothing due.</div>');
  }
}

function render(){
  applyHeaderBrand();
  renderDate(); renderFilters();
  const c=document.getElementById('content'); c.innerHTML='';
  if(activeTab==='agenda') renderAgenda(c);
  else if(activeTab==='routine') renderRoutine(c);
  else if(activeTab==='supps') renderSupps(c);
  else if(activeTab==='tasks') renderTasks(c);
  else if(activeTab==='cal') renderCalendar(c);
  else if(activeTab==='bio') renderBio(c);
  else renderIntegrations(c);
  renderProgress(); renderEatWindow(); renderRail(); renderArc(); saveAll();
  renderCloudConflict();
  renderConsentGate();
  renderSettingsSheet();
  syncHeaderHeight();
}

/* ================= Nexus =================
   Replaced the tilted day-arc dial in August 2026, at the user's request:
   the seven domains systemsReport() already computes, orbiting the day's
   completion. Nothing new is tracked — this is that same report drawn
   instead of listed, which is why the SYSTEMS block and this view can never
   disagree.

   Two independent instances share everything below: the desktop right rail
   (-rail, always on screen) and the mobile full-screen overlay (-ov, opens
   on tap). Ids are suffixed accordingly; arcNode() resolves them.

   DEPTH IS COMPUTED, NOT CSS 3D. Orbits are ellipses; a node's angle gives
   its distance from the viewer, which drives its size and opacity. The old
   dial used a real rotateX on a preserve-3d disc and paid for it twice —
   layer divs sat in front of the nodes in Z and swallowed taps, and every
   label had to be counter-rotated to stay upright. Flat SVG has neither
   problem: a node's hit area is exactly where it is drawn. Do not
   reintroduce perspective here. */
const NX_CX=200, NX_CY=200, NX_R=150;
// Ellipse squash. Reads as the tilt of the orbital plane; also the only
// number to touch if the view ever needs to look flatter or steeper. 0.60
// rather than something flatter because the stage is close to square and a
// very flat ellipse leaves the top and bottom of it empty — depth still
// reads clearly at this angle.
const NX_TILT=0.60;
const NX_TURN=260000, NX_SAT_TURN=95000;   // ms per revolution — deliberately slow
const NX_STATE_COLOR={ok:'--moss',watch:'--amber',warn:'--rose'};
const NX_NS='http://www.w3.org/2000/svg';
const svgEl=(tag,a={})=>{ const e=document.createElementNS(NX_NS,tag); for(const k in a) e.setAttribute(k,a[k]); return e; };
// 'HH:MM' -> decimal hours. Used here and by systemsReport() to decide what
// is already past due.
const hhmmHours=t=>{ const [h,m]=t.split(':').map(Number); return h+m/60; };

function arcStageHTML(suffix){
  // The overlay's viewBox is wider than the drawing on purpose: labels sit
  // OUTSIDE their node (growing inward would cross the percentage in the
  // middle), and a name like BLOOD PRESSURE on a node at the right flank runs
  // ~70 units past the rim. Without the margin it is drawn outside the stage
  // box and lands under the detail card. The rail carries no labels, so it
  // keeps the tight box and stays as large as its 292px allows.
  const box = suffix==='ov' ? '-58 -4 516 408' : '0 0 400 400';
  return `<div class="arc-stage" id="arcStage-${suffix}">
      <svg class="nx-svg" viewBox="${box}" id="nxSvg-${suffix}" aria-hidden="true"></svg>
      <div class="arc-hud" id="arcHud-${suffix}"></div>
    </div>`;
}
function arcNode(base,suffix){ return document.getElementById(base+'-'+suffix); }

let arcOverlayOpen=false;
const arcState={
  rail:{ built:false, sig:null, doms:[], parts:null },
  ov:  { built:false, sig:null, doms:[], parts:null }
};

/* ---- what each domain is made of ----
   Only the three domains that own tickable things carry items; the rest are
   readouts and link into their tab instead. Optional routines switched off
   for viewDate are already excluded by activeRoutinesOn(); cat:'event'
   one-offs ride along inside it (they are ROUTINES rows), which is why they
   need no branch — sheetTypeFor() sorts routine vs event out by id. */
function nxRoutineItems(){
  const mr=marks(state);
  return activeRoutinesOn(viewDate).map(r=>({
    id:'r:'+r.id, time:r.time, name:r.title, done:!!mr[r.id],
    toggle:()=>{ const m=marks(state); m[r.id]=!m[r.id]; render(); },
    edit:()=>arcOpenRoutine(r.id)
  }));
}
function nxSuppItems(){
  const ms=marks(suppState);
  return SUPP_BLOCKS.filter(b=>b.items.length).map(b=>({
    id:'s:'+b.id, time:b.time, name:b.title, done:b.items.every(i=>ms[i.id]),
    toggle:()=>{ const m=marks(suppState); const all=b.items.every(i=>m[i.id]);
      b.items.forEach(i=>m[i.id]=!all); render(); },
    edit:()=>arcOpenSupp()
  }));
}
// Read-only by nature: an event from a subscribed feed is not ours to tick
// or edit, so these rows carry neither. The card's "Open Calendar" button is
// the way through to the day view.
function nxCalItems(){
  return eventsOn(viewDate).map(e=>({
    id:'e:'+(e.uid||e.title)+'|'+e.start.getTime(),
    time:e.allDay?'all day':hhmm(e.start),
    name:e.title||'Untitled', done:false
  }));
}
function nxTaskItems(){
  const dk=key(viewDate);
  return visibleTasks().filter(t=>t.date===dk)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''))
    .map(t=>({
      id:'t:'+t.id, time:t.time||'', name:t.title||'Untitled', done:!!t.done,
      toggle:()=>toggleTask(t.id), edit:()=>arcOpenTask(t.id)
    }));
}

// Keyed by systemsReport()'s own key, so the two cannot drift apart: a row
// this table does not know still renders, just without items or a link.
const NX_META={
  'Routine':     { items:nxRoutineItems, tab:'routine' },
  'Supplements': { items:nxSuppItems,    tab:'supps'   },
  fast:  { size:()=>2 },
  tasks: { items:nxTaskItems, tab:'tasks' },
  bio:   { tab:'bio', size:()=>PANELS.length },
  bp:    { tab:'bio', size:()=>BP.length },
  cal:   { items:nxCalItems, tab:'cal', size:()=>SUBS.length },
  integrations: { tab:'integrations' }
};

function nxDomains(){
  return systemsReport().map(r=>{
    const m=NX_META[r.key]||{};
    const items=m.items?m.items():[];
    return {
      key:r.key, label:r.label, state:r.state, detail:r.detail,
      // systemsReport() computes the short form itself. Deriving it here from
      // the sentence instead would put a second set of rules on the same
      // numbers, and they would drift the first time either side changed.
      val:r.val||r.detail,
      items, tab:m.tab||null,
      count:items.length||(m.size?m.size():1)
    };
  });
}

// Same activeTab-bracketing trick already used for edit-from-agenda: it's
// what makes sheetTypeFor()/openSheet() resolve the right sheet type for an
// id it wasn't opened from, then puts the tab back exactly as it was.
function arcOpenRoutine(id){
  arcCloseOverlay();
  const prev=activeTab; activeTab='routine'; openSheet('edit',id); activeTab=prev;
}
function arcOpenTask(id){
  arcCloseOverlay();
  const prev=activeTab; activeTab='tasks'; openSheet('edit',id); activeTab=prev;
}
function arcOpenSupp(){ arcCloseOverlay(); setTab(SECTIONS.supps?'supps':nearestVisibleTab()); }
function nxOpenTab(t){ arcCloseOverlay(); setTab(SECTIONS[t]?t:nearestVisibleTab()); }

/* ---- build ----
   Static furniture first (grid, perimeter ticks, gyro rings, core), then one
   group per domain. Rebuilt only when the set of domains or their state
   changes — see nxSig() — so ticking something repaints colours in place
   rather than replaying the whole constellation in the always-visible rail. */
function nxSig(doms){ return doms.map(d=>d.key+':'+d.state+':'+d.count).join(','); }

function nxBuild(suffix){
  const svg=arcNode('nxSvg',suffix); if(!svg) return;
  const doms=nxDomains();
  svg.innerHTML='';
  const P={doms:[], gyro:[], sweep:null, prog:null, inner:null};

  // -- ground plane: the ellipse the domains travel on, plus two fainter
  //    ones for depth. Purely furniture; nothing here encodes data.
  [1,0.66,0.34].forEach((k,i)=>{
    svg.appendChild(svgEl('ellipse',{cx:NX_CX,cy:NX_CY,rx:NX_R*k,ry:NX_R*k*NX_TILT,
      fill:'none',stroke:'var(--line)','stroke-width':1,
      'stroke-dasharray':i?'2 7':'', opacity:i?0.55:1}));
  });
  // radial spokes, every 30deg
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    svg.appendChild(svgEl('line',{
      x1:NX_CX+Math.cos(a)*NX_R*0.34, y1:NX_CY+Math.sin(a)*NX_R*0.34*NX_TILT,
      x2:NX_CX+Math.cos(a)*NX_R,      y2:NX_CY+Math.sin(a)*NX_R*NX_TILT,
      stroke:'var(--line)','stroke-width':0.6,opacity:.4}));
  }
  // -- perimeter ticks: instrument bezel, every 7.5deg, longer every fourth
  for(let i=0;i<48;i++){
    const a=i*Math.PI/24, maj=i%4===0, r1=NX_R+7, r2=NX_R+(maj?15:11);
    svg.appendChild(svgEl('line',{
      x1:NX_CX+Math.cos(a)*r1, y1:NX_CY+Math.sin(a)*r1*NX_TILT,
      x2:NX_CX+Math.cos(a)*r2, y2:NX_CY+Math.sin(a)*r2*NX_TILT,
      stroke:'var(--frost)','stroke-width':maj?1.3:0.7,opacity:maj?.45:.22}));
  }

  // -- radar sweep: one line from the hub out to the rim, following the same
  //    ellipse as everything else so it stays in the plane.
  P.sweep=svgEl('line',{x1:NX_CX,y1:NX_CY,stroke:'var(--frost)','stroke-width':1.2,opacity:.30});
  svg.appendChild(P.sweep);

  // -- gyro rings: a circle seen edge-on and rolling. Its MINOR AXIS is
  //    driven rather than the whole ellipse being rotated in 2D — that is
  //    the projection of a genuinely tumbling ring, and it is what sells the
  //    depth. Rotating an ellipse instead just looks like a spinning oval.
  [{r:104,a:0,sp:1},{r:118,a:62,sp:-0.72},{r:94,a:-48,sp:0.55}].forEach(g=>{
    g.node=svgEl('ellipse',{cx:NX_CX,cy:NX_CY,rx:g.r,ry:g.r*0.3,fill:'none',
      stroke:'var(--frost)','stroke-width':1,opacity:.18});
    svg.appendChild(g.node); P.gyro.push(g);
  });

  // -- glow. ONE filter, on ONE element (the completion ring), which does not
  //    move — only its dash length changes. Deliberately not applied per node:
  //    seven blurred groups repositioned every frame is exactly the jank the
  //    style notes warn about. Node emphasis is done with plain vector rings.
  const defs=svgEl('defs',{});
  const f=svgEl('filter',{id:'nxGlow-'+suffix,x:'-60%',y:'-60%',width:'220%',height:'220%'});
  f.appendChild(svgEl('feGaussianBlur',{stdDeviation:2.6,result:'b'}));
  const fm=svgEl('feMerge',{});
  fm.appendChild(svgEl('feMergeNode',{in:'b'}));
  fm.appendChild(svgEl('feMergeNode',{in:'SourceGraphic'}));
  f.appendChild(fm); defs.appendChild(f); svg.appendChild(defs);

  // -- core: completion as a ring. The percentage itself is HTML in .arc-hud
  //    on top, where it can use real type sizes instead of scaled SVG text.
  const CR=84, CC=2*Math.PI*CR;
  svg.appendChild(svgEl('circle',{cx:NX_CX,cy:NX_CY,r:CR,fill:'none',
    stroke:'rgba(95,216,245,.14)','stroke-width':3.5}));
  P.prog=svgEl('circle',{cx:NX_CX,cy:NX_CY,r:CR,fill:'none',stroke:'var(--frost)',
    'stroke-width':3.5,'stroke-dasharray':'0 '+CC,
    transform:'rotate(-90 '+NX_CX+' '+NX_CY+')'});
  P.progC=CC;
  svg.appendChild(P.prog);
  P.prog.setAttribute('filter','url(#nxGlow-'+suffix+')');
  P.inner=svgEl('circle',{cx:NX_CX,cy:NX_CY,r:73,fill:'none',stroke:'var(--frost)',
    'stroke-width':0.8,'stroke-dasharray':'1 6',opacity:.45});
  svg.appendChild(P.inner);
  // Bezel: four bracket arcs at the diagonals, and a ring of fine ticks that
  // turns against the inner dashes. Instrument housing, not data — it is what
  // makes the core read as a gauge rather than a pie chart.
  [45,135,225,315].forEach(deg=>{
    const a0=(deg-15)*Math.PI/180, a1=(deg+15)*Math.PI/180, br=96;
    svg.appendChild(svgEl('path',{d:'M '+(NX_CX+Math.cos(a0)*br)+' '+(NX_CY+Math.sin(a0)*br)+
      ' A '+br+' '+br+' 0 0 1 '+(NX_CX+Math.cos(a1)*br)+' '+(NX_CY+Math.sin(a1)*br),
      fill:'none',stroke:'var(--frost)','stroke-width':2,opacity:.5,'stroke-linecap':'round'}));
  });
  P.bezel=svgEl('circle',{cx:NX_CX,cy:NX_CY,r:101,fill:'none',stroke:'var(--frost)',
    'stroke-width':3,'stroke-dasharray':'1.2 9',opacity:.28});
  svg.appendChild(P.bezel);

  // -- domains
  doms.forEach((d,i)=>{
    const col='var('+NX_STATE_COLOR[d.state]+')';
    const rad=9+Math.min(d.count,8)*0.85;
    const o={d, col, rad, phase:i/doms.length};

    o.link=svgEl('line',{x1:NX_CX,y1:NX_CY,stroke:col,'stroke-width':1,opacity:.20});
    svg.appendChild(o.link);

    const g=svgEl('g',{class:'nx-node',tabindex:0,role:'button'});
    g.setAttribute('aria-label',d.label+', '+d.detail);
    o.sats=[];
    const satG=svgEl('g',{}); g.appendChild(satG);
    for(let j=0;j<Math.min(d.count,6);j++){
      const s={ph:j/Math.min(d.count,6), node:svgEl('circle',{r:2.4,fill:col,opacity:.6})};
      satG.appendChild(s.node); o.sats.push(s);
    }
    o.halo=svgEl('circle',{class:'nx-halo',fill:col,opacity:.12});
    // Targeting reticle — only drawn for the selected domain, and it turns,
    // which is the one place a little theatre costs nothing.
    o.ret =svgEl('circle',{fill:'none',stroke:'var(--frost)','stroke-width':1.3,
      'stroke-dasharray':'4 7',opacity:0});
    o.ring2=svgEl('circle',{fill:'none',stroke:col,'stroke-width':0.8,opacity:.38});
    o.ring=svgEl('circle',{class:'nx-ring',fill:'rgba(6,11,16,.85)',stroke:col,'stroke-width':2});
    o.dot =svgEl('circle',{fill:col});
    // Hit area far wider than the drawing. The old dial's 17px dots were the
    // single most-reported annoyance on the phone; this is the fix.
    o.hit =svgEl('circle',{class:'nx-hit'});
    [o.halo,o.ret,o.ring2,o.ring,o.dot,o.hit].forEach(n=>g.appendChild(n));
    o.lab=svgEl('text',{class:'nx-lab','font-size':10.5,'letter-spacing':1.1,fill:'var(--muted)'});
    o.lab.textContent=d.label.toUpperCase();
    o.val=svgEl('text',{class:'nx-val','font-size':11.5,'font-weight':600,fill:'var(--ink)'});
    o.val.textContent=d.val;
    g.appendChild(o.lab); g.appendChild(o.val);

    g.addEventListener('click',e=>{ e.stopPropagation(); arcSelect(d.key); });
    g.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); arcSelect(d.key); } });
    o.g=g; svg.appendChild(g);
    P.doms.push(o);
  });

  arcState[suffix].parts=P;
  arcState[suffix].doms=doms;
  arcState[suffix].sig=nxSig(doms);
}

// The value under a node is the one thing that changes WITHOUT changing the
// signature: ticking a supplement block moves 0/11 to 2/11 while the domain,
// its state and its item count all stay put. Without this the node kept
// showing the number it was built with while the card beside it showed the
// truth.
function nxSyncText(suffix,doms){
  const P=arcState[suffix].parts; if(!P) return;
  P.doms.forEach((o,i)=>{
    const d=doms[i]; if(!d||d.key!==o.d.key) return;
    if(d.val!==o.d.val) o.val.textContent=d.val;
    o.d=d;
  });
}

/* ---- per-frame placement ---- */
function nxPlace(suffix,t){
  const P=arcState[suffix].parts; if(!P) return;

  P.gyro.forEach(g=>{
    const k=Math.cos(t/9000*g.sp+g.a);
    g.node.setAttribute('ry',Math.max(3,Math.abs(k)*g.r).toFixed(1));
    g.node.setAttribute('transform','rotate('+(g.a*20+t/26000*g.sp*57).toFixed(2)+' '+NX_CX+' '+NX_CY+')');
    g.node.setAttribute('opacity',(0.09+Math.abs(k)*0.15).toFixed(3));
  });

  P.bezel.setAttribute('transform','rotate('+(t/70000*360).toFixed(2)+' '+NX_CX+' '+NX_CY+')');
  const sa=t/16000*Math.PI*2;
  P.sweep.setAttribute('x2',(NX_CX+Math.cos(sa)*NX_R).toFixed(2));
  P.sweep.setAttribute('y2',(NX_CY+Math.sin(sa)*NX_R*NX_TILT).toFixed(2));
  P.inner.setAttribute('transform','rotate('+(-t/40000*360).toFixed(2)+' '+NX_CX+' '+NX_CY+')');

  const pct=arcCompletionPct().pct;
  P.prog.setAttribute('stroke-dasharray',(P.progC*pct/100).toFixed(1)+' '+P.progC);

  P.doms.forEach(o=>{
    const a=(t/NX_TURN+o.phase)*Math.PI*2;
    const x=NX_CX+Math.cos(a)*NX_R, y=NX_CY+Math.sin(a)*NX_R*NX_TILT;
    const depth=(Math.sin(a)+1)/2;                 // 0 = far side, 1 = nearest
    const s=0.68+depth*0.38, sel=arcSelected===o.d.key;

    o.g.setAttribute('transform','translate('+x.toFixed(2)+','+y.toFixed(2)+')');
    o.g.setAttribute('opacity',(arcSelected&&!sel ? (0.48+depth*0.52)*0.42
                                                  : 0.48+depth*0.52).toFixed(3));
    o.halo.setAttribute('r',((o.rad+11)*s).toFixed(2));
    o.halo.setAttribute('opacity',sel?0.34:0.12);
    o.ring.setAttribute('r',(o.rad*s).toFixed(2));
    o.ring.setAttribute('stroke-width',sel?3:2);
    o.ring2.setAttribute('r',(o.rad*s+4.5).toFixed(2));
    o.ret.setAttribute('r',(o.rad*s+10).toFixed(2));
    o.ret.setAttribute('opacity',sel?0.85:0);
    if(sel) o.ret.setAttribute('transform','rotate('+(t/3500*360).toFixed(2)+')');
    o.dot .setAttribute('r',(o.rad*0.38*s).toFixed(2));
    o.hit .setAttribute('r',(o.rad*s+22).toFixed(2));
    o.link.setAttribute('x2',x.toFixed(2));
    o.link.setAttribute('y2',y.toFixed(2));
    o.link.setAttribute('opacity',(sel?0.5:0.10+depth*0.20).toFixed(3));

    /* Labels flip with position: to the side at the ellipse's flanks, stacked
       when the node is near the top or bottom, where a side label would run
       into its neighbour. Stacked labels go on the side facing AWAY from the
       core, or a node crossing the top writes straight over the percentage. */
    const c=Math.cos(a), off=o.rad*s+9;
    if(Math.abs(c)<0.42){
      const below=Math.sin(a)>0;
      o.lab.setAttribute('text-anchor','middle'); o.val.setAttribute('text-anchor','middle');
      o.lab.setAttribute('x',0); o.lab.setAttribute('y',below?off+11:-off-14);
      o.val.setAttribute('x',0); o.val.setAttribute('y',below?off+23:-off-2);
    } else {
      const right=c>0, ax=right?off:-off;
      o.lab.setAttribute('text-anchor',right?'start':'end');
      o.val.setAttribute('text-anchor',right?'start':'end');
      o.lab.setAttribute('x',ax); o.lab.setAttribute('y',-1);
      o.val.setAttribute('x',ax); o.val.setAttribute('y',11);
    }

    o.sats.forEach(sn=>{
      const b=(t/NX_SAT_TURN+sn.ph)*Math.PI*2+o.phase*3, sr=(o.rad+13)*s;
      sn.node.setAttribute('cx',(Math.cos(b)*sr).toFixed(2));
      sn.node.setAttribute('cy',(Math.sin(b)*sr*NX_TILT).toFixed(2));
      sn.node.setAttribute('opacity',(0.26+((Math.sin(b)+1)/2)*0.5).toFixed(3));
    });
  });
}

/* ---- the loop ----
   One rAF for both instances. Throttled to ~30fps and stopped outright when
   the tab is hidden or nothing is on screen: the rail copy is visible for a
   whole desktop session, and an unthrottled always-on rAF there is a real
   battery cost for motion nobody is watching.
   Selecting a domain freezes the orbit — otherwise what you just tapped
   drifts out from under your thumb while you read its card. */
const NX_REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let nxT0=performance.now(), nxFrozen=null, nxLast=0, nxRaf=null;

function nxNow(){
  if(NX_REDUCED) return NX_TURN*0.13;      // a laid-out constellation, never advancing
  if(nxFrozen!==null) return nxFrozen;
  return performance.now()-nxT0;
}
function nxLive(){
  if(document.hidden) return [];
  const out=[];
  if(isDesktopLayout() && arcState.rail.built) out.push('rail');
  if(arcOverlayOpen && arcState.ov.built) out.push('ov');
  return out;
}
function nxFrame(now){
  nxRaf=null;
  const live=nxLive();
  if(!live.length) return;                 // restarted by nxKick() when one appears
  if(now-nxLast>33){ nxLast=now; const t=nxNow(); live.forEach(s=>nxPlace(s,t)); }
  if(!NX_REDUCED && nxFrozen===null) nxRaf=requestAnimationFrame(nxFrame);
}
function nxKick(){
  const live=nxLive();
  if(!live.length) return;
  const t=nxNow(); live.forEach(s=>nxPlace(s,t));   // paint once even when frozen
  if(!NX_REDUCED && nxFrozen===null && nxRaf===null) nxRaf=requestAnimationFrame(nxFrame);
}
document.addEventListener('visibilitychange',nxKick);

/* ---- day summary in the middle ---- */
function arcCompletionPct(){
  const mr=marks(state), ms=marks(suppState);
  const vr=activeRoutinesOn(viewDate), vs=allSupps();
  const total=vr.length+vs.length;
  const done=vr.filter(r=>mr[r.id]).length+vs.filter(s=>ms[s.id]).length;
  return {total,done,pct:total?Math.round(done/total*100):0};
}
// The next still-open timed thing. No longer drawn in the middle of the
// constellation — it is the briefing that needs it (bootLines() and
// briefingSpeech() both open on "next up"), which is why it outlived the
// HUD row it used to fill.
function arcNextUp(){
  if(!sameDay(viewDate,new Date())) return null;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60;
  return [...nxRoutineItems(),...nxSuppItems(),...nxTaskItems()]
    .filter(i=>i.time&&!i.done&&hhmmHours(i.time)>=h)
    .sort((a,b)=>a.time.localeCompare(b.time))[0]||null;
}

// Deliberately just the headline. Everything this used to carry is already on
// screen and was fighting the drawing for the middle of the core ring: the
// eating countdown is its own node, "12/20 done" is what the percentage says,
// and what is coming next is the scheduled strip above the stage. At 390px
// the ring is ~130px across and none of it fitted anyway.
function arcHudHTML(){
  const {pct}=arcCompletionPct();
  const lbl=sameDay(viewDate,new Date()) ? 'Today'
    : viewDate.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  return `<div class="arc-cap">${esc(lbl)}</div><div class="arc-pct">${pct}%</div>`;
}
function arcRenderCentre(suffix){
  const hud=arcNode('arcHud',suffix); if(hud) hud.innerHTML=arcHudHTML();
}

/* ---- selection & detail card ----
   arcSelected holds a DOMAIN key. Everything reads back through nxDomains()
   rather than caching, so a tick elsewhere (or any re-render) keeps the card
   truthful instead of showing a stale done-state. */
let arcSelected=null;

// A tap on a rail node expands to the overlay first: at 292px the rail copy
// is a summary, and its detail card has nowhere to live.
function arcSelect(k){
  arcSelected=(arcSelected===k)?null:k;
  nxFreeze();
  if(arcSelected!==null && !arcOverlayOpen){ arcOpenOverlay(); return; }
  arcRenderDetail(); nxKick();
}
function arcClearSelection(){
  if(arcSelected===null) return;
  arcSelected=null; nxFreeze(); arcRenderDetail(); nxKick();
}
// Freezing keeps the clock where it stopped and resumes from there, so
// clearing a selection does not make the constellation jump.
function nxFreeze(){
  if(arcSelected!==null){ if(nxFrozen===null) nxFrozen=performance.now()-nxT0; }
  else if(nxFrozen!==null){ nxT0=performance.now()-nxFrozen; nxFrozen=null; }
}
function nxSelected(){
  return arcSelected ? nxDomains().find(d=>d.key===arcSelected)||null : null;
}
function nxItem(id){
  const d=nxSelected(); return d? d.items.find(i=>i.id===id)||null : null;
}
function nxItemToggle(id){ const i=nxItem(id); if(i) i.toggle(); }
function nxItemEdit(id){ const i=nxItem(id); if(i) i.edit(); }

function arcRenderDetail(){
  const box=document.getElementById('arcDetail'); if(!box) return;
  const d=nxSelected();
  if(!d){ box.innerHTML='<div class="arc-d-hint">Tap a domain for details</div>'; return; }
  const col='var('+NX_STATE_COLOR[d.state]+')';
  const stateLbl={ok:'Nominal',watch:'Watch',warn:'Attention'}[d.state];
  // Not every domain's items are ours to change — calendar events come from
  // a feed. Rows without a toggle get a plain marker in the checkbox's place
  // so the times still line up in a column.
  const rows=d.items.map(i=>`
    <div class="nx-i-row${i.done?' done':''}">
      ${i.toggle
        ? `<button class="nx-i-tick" onclick="nxItemToggle('${esc(i.id)}')"
             aria-label="${i.done?'Undo':'Mark done'} ${esc(i.name)}">${i.done?'✓':''}</button>`
        : `<span class="nx-i-bullet"><i style="background:${col}"></i></span>`}
      <span class="nx-i-time">${esc(i.time||'—')}</span>
      <span class="nx-i-name">${esc(i.name)}</span>
      ${i.edit
        ? `<button class="nx-i-edit" onclick="nxItemEdit('${esc(i.id)}')"
             aria-label="Edit ${esc(i.name)}">✎</button>`
        : ''}
    </div>`).join('');
  box.innerHTML=`<div class="arc-d-card">
    <button class="arc-d-close" onclick="arcClearSelection()" aria-label="Close details">✕</button>
    <div class="arc-d-top">
      <span class="arc-d-time" style="color:${col}">${esc(d.val)}</span>
      <span class="arc-d-status${d.state==='ok'?' on':''}">${stateLbl}</span>
    </div>
    <div class="arc-d-name">${esc(d.label)}</div>
    <div class="arc-d-meta"><span class="arc-d-tag" style="color:${col}">${esc(d.detail)}</span></div>
    ${rows?`<div class="nx-items">${rows}</div>`:''}
    ${d.tab?`<div class="arc-d-acts">
      <button class="pri" onclick="nxOpenTab('${d.tab}')">Open ${esc(TAB_LABEL[d.tab]||d.tab)} →</button>
    </div>`:''}
  </div>`;
}
const TAB_LABEL={routine:'Routine',supps:'Supps',tasks:'Tasks',cal:'Calendar',bio:'Bio',integrations:'Integrations'};

/* ---- scheduled strip above the constellation ----
   Mobile overlay only — the desktop rail already has its own "Due today"
   list (renderRail()). This is also what carries the day's actual times now
   that the dial is gone, so it is not decoration: it is the "when". */
function arcRenderTaskList(){
  const box=document.getElementById('arcTaskList');
  if(!box) return;
  const dayKey=key(viewDate);
  let tasks=visibleTasks().filter(t=>t.date===dayKey)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let heading='Scheduled';
  // Nothing on the day being viewed — fall back to the single nearest
  // upcoming dated task instead of just leaving the strip empty.
  if(!tasks.length){
    const upcoming=visibleTasks().filter(t=>t.date&&t.date>dayKey)
      .sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
    if(upcoming.length){ tasks=[upcoming[0]]; heading='Next up'; }
  }
  if(!tasks.length){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  box.innerHTML=`<div class="arc-tl-h">${heading}</div>
    <div class="arc-tl-scroll">${tasks.map(t=>{
      const timeLbl=t.date===dayKey?(t.time?esc(t.time):'All day'):esc(taskDateLabel(t));
      return `<button class="arc-tl-row${t.done?' done':''}" data-id="${t.id}">
        <span class="arc-tl-time">${timeLbl}</span>
        <span>${esc(t.title||'Untitled')}</span>
      </button>`;
    }).join('')}</div>`;
  box.querySelectorAll('[data-id]').forEach(b=>{ b.onclick=()=>arcOpenTask(b.dataset.id); });
}

/* ---- drivers ---- */
function arcRefresh(suffix){
  // Rebuild only when the constellation itself changed — a domain appearing,
  // a state flipping, a count moving. Ticking one routine of seventeen does
  // none of those, and rebuilding on every render would restart the orbit.
  const doms=nxDomains();
  if(nxSig(doms)!==arcState[suffix].sig) nxBuild(suffix);
  else nxSyncText(suffix,doms);
  arcRenderCentre(suffix);
  if(suffix==='ov'){ arcRenderTaskList(); arcRenderDetail(); }
  nxKick();
}
function arcBuildFull(suffix){
  nxBuild(suffix);
  arcRenderCentre(suffix);
  if(suffix==='ov'){ arcRenderTaskList(); arcRenderDetail(); }
  arcState[suffix].built=true;
  nxKick();
}
// Desktop: build once, then refresh in place on every render(). Mobile: only
// does anything while the overlay is open (arcOpenOverlay does the build).
function renderArc(){
  document.getElementById('progWrap').tabIndex=isDesktopLayout()?-1:0;
  if(isDesktopLayout()){
    if(!arcState.rail.built) arcBuildFull('rail'); else arcRefresh('rail');
  } else if(arcOverlayOpen){
    arcRefresh('ov');
  }
}
// Per-minute tick: the summary carries a clock and an eating countdown, and
// next-up rolls over. The constellation itself is driven by nxFrame().
function arcTick(){
  const suffix=isDesktopLayout()?'rail':(arcOverlayOpen?'ov':null);
  if(!suffix||!arcState[suffix].built) return;
  arcRenderCentre(suffix);
}
// The SVG scales with its viewBox, so nothing needs re-measuring — but
// crossing the 900px boundary changes which instance is live.
function arcOnResize(){ renderArc(); nxKick(); }

function arcBlockTap(){
  if(isDesktopLayout()) return;   // inert there — the arc is already inline in the rail
  arcOpenOverlay();
}
function arcBlockKey(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  e.preventDefault(); arcBlockTap();
}
function arcOpenOverlay(){
  arcOverlayOpen=true;
  document.getElementById('arcOverlay').classList.add('open');
  // The overlay is full-screen, unlike the bottom sheet the rest of the app
  // uses — nothing else locks body scroll, so without this a swipe on the
  // arc scrolls the page underneath instead of just sitting still.
  document.body.style.overflow='hidden';
  arcBuildFull('ov');
}
function arcCloseOverlay(){
  if(!arcOverlayOpen) return;
  arcOverlayOpen=false;
  arcSelected=null;   // reopen on the day summary, not on whatever was last tapped
  nxFreeze();         // ...which also releases the orbit the selection froze
  document.getElementById('arcOverlay').classList.remove('open');
  document.body.style.overflow='';
  nxKick();           // clear the lock-on left on the rail copy
}
function arcOverlayTap(e){
  if(e.target.id==='arcOverlay') arcCloseOverlay();   // tap outside the stage/close button
}
// Escape unwinds one level at a time: an open node readout first, the whole
// overlay only once nothing is selected.
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(arcSelected!==null){ arcClearSelection(); return; }
  if(arcOverlayOpen) arcCloseOverlay();
});

document.getElementById('arcRailWrap').innerHTML=
  arcStageHTML('rail')+
  '<button class="arc-expand" onclick="arcOpenOverlay()">Expand ⤢</button>';
document.getElementById('arcOvStageHost').innerHTML=arcStageHTML('ov');
// Clicking the rail disc itself expands too — the button is the visible
// affordance, the whole stage is the target. Nodes stop the event so
// tapping one still selects (arcSelect then expands with it selected).
document.getElementById('arcRailWrap').addEventListener('click',e=>{
  if(arcOverlayOpen) return;
  if(e.target.closest('.nx-node,.arc-expand')) return;
  arcOpenOverlay();
});

function renderRoutine(c){
  let items=visibleRoutines();
  if(activeFilter!=='all') items=items.filter(r=>r.cat===activeFilter);
  c.insertAdjacentHTML('beforeend',
    `<div class="tab-actions"><button class="opt-pill off" onclick="resetDay()">Reset day</button></div>`);
  if(!items.length){ c.insertAdjacentHTML('beforeend','<div class="empty">Nothing scheduled here.<br>Tap + to add something.</div>'); return; }
  const m=marks(state);
  items.forEach(r=>{
    const active=isOptActive(r,viewDate), done=active&&!!m[r.id];
    const row=document.createElement('div');
    row.className='row'+(done?' done':'')+(active?'':' opt-off');
    const pill=r.optional
      ? `<button class="opt-pill ${active?'':'off'}" data-opt="${r.id}">${active?'Optional · on':'Optional · off'}</button>`
      : '';
    row.innerHTML=`
      <div class="check ${done?'on':''}${active?'':' plus'}" data-${active?'id':'opt'}="${r.id}"></div>
      <div class="rbody">
        <div class="rtitle">${esc(r.title)}</div>
        <div class="rmeta"><span class="tag ${r.cat}">${LABEL[r.cat]}</span>
          <span class="row-time">${r.time} · ${r.dur} min</span>${r.date?'<span class="tag once">Single</span>':(r.cat==='event'?'<span class="tag once">Repeats</span>':'')}${pill}${streakPill(r)}</div>
        ${descPeekHTML(r,'r:'+r.id)}
      </div>
      <div class="acts">
        <button class="ico edit" data-edit="${r.id}" aria-label="Edit">✎</button>
        <button class="ico del" data-del="${r.id}" aria-label="Delete">✕</button>
      </div>`;
    c.appendChild(row);
    c.insertAdjacentHTML('beforeend',descPanelHTML(r,'r:'+r.id));
  });
  c.querySelectorAll('[data-opt]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); toggleOpt(x.dataset.opt); });
  c.querySelectorAll('.check').forEach(x=>x.onclick=()=>{ const m=marks(state); m[x.dataset.id]=!m[x.dataset.id]; render(); });
  c.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>openSheet('edit',x.dataset.edit));
  c.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{
    const r=ROUTINES.find(y=>y.id===x.dataset.del);
    const i=ROUTINES.indexOf(r);
    deleteWithUndo(r.title, ()=>ROUTINES.splice(i,1), ()=>ROUTINES.splice(i,0,r));
  });
  bindDescRows(c);
  markFirstOpenRow(c);
}

function renderSupps(c){
  const m=marks(suppState);
  c.insertAdjacentHTML('beforeend',
    `<div class="tab-actions"><button class="opt-pill off" onclick="resetSupps()">Reset day</button></div>`);
  SUPP_BLOCKS.forEach(block=>{
    const wrap=document.createElement('div'); wrap.className='block';
    wrap.innerHTML=`<div class="block-head"><span class="block-title">${esc(block.title)}</span>
      <button class="block-time" data-btime="${block.id}">${block.time} ✎</button></div>`;
    block.items.forEach(it=>{
      const done=!!m[it.id];
      const row=document.createElement('div'); row.className='row'+(done?' done':'');
      row.innerHTML=`
        <div class="check ${done?'on':''}" data-sid="${it.id}"></div>
        <div class="rbody"><div class="rtitle">${esc(it.name)}</div><div class="rmeta">${esc(it.sub)}</div>
          ${descPeekHTML(it,'s:'+block.id+':'+it.id)}</div>
        <span class="dose">${esc(it.dose)}</span>
        <div class="acts">
          <button class="ico edit" data-sedit="${block.id}:${it.id}" aria-label="Edit">✎</button>
          <button class="ico del" data-sdel="${block.id}:${it.id}" aria-label="Delete">✕</button>
        </div>`;
      wrap.appendChild(row);
      wrap.insertAdjacentHTML('beforeend',descPanelHTML(it,'s:'+block.id+':'+it.id));
    });
    if(block.wait){ const w=document.createElement('div'); w.className='wait-note'; w.textContent='⏱ '+block.wait; wrap.appendChild(w); }
    c.appendChild(wrap);
  });
  c.querySelectorAll('.check').forEach(x=>x.onclick=()=>{ const m=marks(suppState); m[x.dataset.sid]=!m[x.dataset.sid]; render(); });
  c.querySelectorAll('[data-sedit]').forEach(x=>x.onclick=()=>openSheet('edit',x.dataset.sedit));
  c.querySelectorAll('[data-sdel]').forEach(x=>x.onclick=()=>{
    const [bid,iid]=x.dataset.sdel.split(':');
    const b=SUPP_BLOCKS.find(y=>y.id===bid); const it=b.items.find(y=>y.id===iid);
    const i=b.items.indexOf(it);
    deleteWithUndo(it.name, ()=>b.items.splice(i,1), ()=>b.items.splice(i,0,it));
  });
  c.querySelectorAll('[data-btime]').forEach(b=>b.onclick=()=>{
    const bl=SUPP_BLOCKS.find(x=>x.id===b.dataset.btime);
    const v=prompt('Time for "'+bl.title+'" (HH:MM)',bl.time);
    if(v&&/^\d{1,2}:\d{2}$/.test(v)){ bl.time=v.length===4?'0'+v:v; render(); }
  });
  bindDescRows(c);
  markFirstOpenRow(c);
}

/* ---------- DRAG TO REORDER ----------
   Pointer Events rather than HTML5 drag-and-drop, which does not work on iOS
   Safari. Dragging starts on the handle only, so a swipe anywhere else on a
   row still scrolls the page; on touch a short hold is required first, and
   only once engaged do we preventDefault to stop the page moving underneath.
   Reordering is confined to the list it starts in. */
const DRAG_HOLD_MS=200, DRAG_EDGE=60;

function scrollParentOf(el){
  let p=el.parentElement;
  while(p&&p!==document.body){
    const o=getComputedStyle(p).overflowY;
    if(o==='auto'||o==='scroll') return p;
    p=p.parentElement;
  }
  return null;   // fall back to the window
}

function makeReorderable(list,onDrop){
  if(!list) return;
  list.querySelectorAll('[data-drag]').forEach(handle=>{
    handle.addEventListener('pointerdown',e=>beginDrag(e,list,handle,onDrop));
  });
}

function beginDrag(e,list,handle,onDrop){
  if(e.button&&e.button!==0) return;
  const item=handle.closest('[data-item]'); if(!item) return;
  const items=[...list.querySelectorAll('[data-item]')];
  const fromIdx=items.indexOf(item); if(fromIdx<0) return;
  const rects=items.map(el=>el.getBoundingClientRect());
  const h=rects[fromIdx].height;
  const startY=e.clientY;
  const scroller=scrollParentOf(list);
  let engaged=false, toIdx=fromIdx, hold=null;

  const engage=()=>{
    engaged=true;
    item.classList.add('drag-lift');
    items.forEach(el=>{ if(el!==item) el.classList.add('drag-shift'); });
  };
  if(e.pointerType==='mouse') engage(); else hold=setTimeout(engage,DRAG_HOLD_MS);

  try{ handle.setPointerCapture(e.pointerId); }catch(_){}

  const move=ev=>{
    if(!engaged){
      // Moved before the hold elapsed — treat it as a scroll, not a drag.
      if(Math.abs(ev.clientY-startY)>8){ clearTimeout(hold); finish(true); }
      return;
    }
    ev.preventDefault();
    item.style.transform=`translateY(${ev.clientY-startY}px) scale(1.02)`;

    let k=0;
    items.forEach((el,i)=>{ if(i!==fromIdx && rects[i].top+rects[i].height/2<ev.clientY) k++; });
    toIdx=k;
    items.forEach((el,i)=>{
      if(i===fromIdx) return;
      const fi = i<fromIdx ? i : i-1;
      let shift=0;
      if(fi<fromIdx && fi>=toIdx) shift=h;
      else if(fi>=fromIdx && fi<toIdx) shift=-h;
      el.style.transform=shift?`translateY(${shift}px)`:'';
    });

    const vh=window.innerHeight;
    const top=scroller?scroller.getBoundingClientRect().top:0;
    const bot=scroller?scroller.getBoundingClientRect().bottom:vh;
    if(ev.clientY<top+DRAG_EDGE){ scroller?scroller.scrollBy(0,-12):window.scrollBy(0,-12); }
    else if(ev.clientY>bot-DRAG_EDGE){ scroller?scroller.scrollBy(0,12):window.scrollBy(0,12); }
  };

  const finish=cancelled=>{
    clearTimeout(hold);
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
    items.forEach(el=>{ el.style.transform=''; el.classList.remove('drag-lift','drag-shift'); });
    if(!cancelled&&engaged&&toIdx!==fromIdx){
      const ids=items.map(el=>el.dataset.item);
      const [moved]=ids.splice(fromIdx,1);
      ids.splice(toIdx,0,moved);
      onDrop(ids);            // persist once, on drop — not on every move
    }
  };
  const up=()=>finish(false);

  document.addEventListener('pointermove',move,{passive:false});
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

/* ---------- TASKS ----------
   Completion replaces deletion: a ticked task stays visible for the rest of
   that day, then drops out of every view while staying in storage. */
let tasksDoneOpen=false;

const visibleTasks=()=>TASKS.filter(t=>!t.done || t.doneAt===key(new Date()));

function taskDateLabel(t){
  if(!t.date) return '';
  const dt=parseDay(t.date);
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((dt-today)/86400000);
  const base = diff===0?'Today' : diff===1?'Tomorrow'
    : dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return base+(t.time?' · '+t.time:'');
}
const taskOverdue=t=>!!t.date && !t.done && t.date<key(new Date());

function toggleTask(id){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  t.done=!t.done;
  t.doneAt=t.done?key(new Date()):null;
  render();
}
function deleteTask(id){
  const i=TASKS.findIndex(t=>t.id===id); if(i<0) return;
  const t=TASKS[i];
  deleteWithUndo(t.title, ()=>TASKS.splice(i,1), ()=>TASKS.splice(i,0,t));
}
function clearCompleted(){
  const todayKey=key(new Date());
  const n=TASKS.filter(t=>t.done&&t.doneAt===todayKey).length;
  if(!n) return;
  if(!confirm('Clear '+n+' completed task'+(n===1?'':'s')+'? This cannot be undone.')) return;
  TASKS=TASKS.filter(t=>!(t.done&&t.doneAt===todayKey));
  render();
}

const subCount=t=>countLabel(t.subtasks);

function taskRow(t,draggable){
  const row=document.createElement('div');
  row.className='row'+(t.done?' done':'');
  if(draggable) row.dataset.item=t.id;
  const when=t.date?`<div class="task-when${taskOverdue(t)?' overdue':''}">${esc(taskDateLabel(t))}</div>`:'';
  row.innerHTML=`<div class="check ${t.done?'on':''}" data-task="${t.id}"></div>
    <div class="rbody" data-topen="${t.id}"><div class="rtitle">${esc(t.title)||'<span class="ghost">Untitled</span>'}${subCount(t)}</div>${when}</div>
    ${draggable?`<button class="drag-handle" data-drag title="Reorder" aria-label="Reorder">⋮⋮</button>`:''}
    <div class="acts"><button class="ico del" data-tdel="${t.id}">✕</button></div>`;
  return row;
}
function bindTaskRows(c){
  c.querySelectorAll('[data-task]').forEach(x=>x.onclick=()=>toggleTask(x.dataset.task));
  c.querySelectorAll('[data-topen]').forEach(x=>x.onclick=()=>openTaskDetail(x.dataset.topen));
  c.querySelectorAll('[data-tdel]').forEach(x=>x.onclick=()=>deleteTask(x.dataset.tdel));
}

function renderTasks(c){
  const vis=visibleTasks(), todayKey=key(new Date());
  const byOrder=(a,b)=>(a.order||0)-(b.order||0);
  // Manual order wins so a drag survives a reload; date only breaks ties.
  const scheduled=vis.filter(t=>!t.done&&t.date)
    .sort((a,b)=>byOrder(a,b)||a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99'));
  const someday=vis.filter(t=>!t.done&&!t.date).sort(byOrder);
  const done=vis.filter(t=>t.done&&t.doneAt===todayKey).sort(byOrder);

  if(done.length) c.insertAdjacentHTML('beforeend',
    `<div class="tab-actions"><button class="opt-pill off" onclick="clearCompleted()">Clear completed</button></div>`);

  if(!scheduled.length&&!someday.length&&!done.length){
    c.insertAdjacentHTML('beforeend','<div class="empty">No tasks yet.<br>Tap + to add one.</div>');
    return;
  }

  // Each section is its own drag list, so a dated task can never land in
  // Someday and finished items stay in Done.
  const section=(title,list)=>{
    c.insertAdjacentHTML('beforeend',`<div class="day-sep">${title}</div>`);
    const wrap=document.createElement('div'); wrap.className='task-sec';
    list.forEach(t=>wrap.appendChild(taskRow(t,true)));
    c.appendChild(wrap);
    makeReorderable(wrap,ids=>{
      // Renumber only this section, leaving the others untouched.
      const base=Math.min(...list.map(t=>t.order||0));
      ids.forEach((id,i)=>{ const t=TASKS.find(x=>x.id===id); if(t) t.order=base+i; });
      saveAll(); render();
    });
  };

  if(scheduled.length) section('Scheduled',scheduled);
  if(someday.length) section('Someday',someday);
  if(done.length){
    c.insertAdjacentHTML('beforeend',
      `<div class="day-sep tasks-done-head" id="tasksDoneHead">Done (${done.length}) ${tasksDoneOpen?'▾':'▸'}</div>`);
    if(tasksDoneOpen){
      const wrap=document.createElement('div'); wrap.className='task-sec';
      done.forEach(t=>wrap.appendChild(taskRow(t,true)));
      c.appendChild(wrap);
      makeReorderable(wrap,ids=>{
        const base=Math.min(...done.map(t=>t.order||0));
        ids.forEach((id,i)=>{ const t=TASKS.find(x=>x.id===id); if(t) t.order=base+i; });
        saveAll(); render();
      });
    }
    const h=document.getElementById('tasksDoneHead');
    if(h) h.onclick=()=>{ tasksDoneOpen=!tasksDoneOpen; render(); };
  }
  bindTaskRows(c);
}

/* ---------- SYSTEMS ----------
   A diagnostics readout in the Jarvis sense: named subsystems, each with a
   state, reported without being asked. Everything here is derived from data
   the app already holds — nothing new is tracked — and the point is to
   surface neglect you would otherwise have to go looking for. */
const SYS_ORDER=['ok','watch','warn'];
function systemsReport(){
  const out=[];
  const mr=marks(state), ms=marks(suppState);

  /* Time-aware, not a bare ratio. Something scheduled for tonight is not a
     deviation at lunchtime, so only entries whose time has already passed
     count against you; yesterday's leftovers are the red case. A completion
     ratio alone reported half the day amber for no reason.

     Only meaningful while looking at today — a past or future day has no
     "now" to be measured against, so those fall back to the plain count. */
  const now=new Date(), nowH=now.getHours()+now.getMinutes()/60;
  const isToday=sameDay(viewDate,new Date());
  const yest=new Date(); yest.setDate(yest.getDate()-1); yest.setHours(0,0,0,0);
  const marksOn=(store,d)=>store[key(d)]||{};
  // "Open from yesterday" only counts if you were actually tracking
  // yesterday. With no record for that day — a fresh install, or simply a
  // day the app went untouched — every entry would read as missed and the
  // panel would open on red for someone who has done nothing wrong.
  const tracked=(store,d)=>Object.keys(marksOn(store,d)).length>0;

  // Same shape for both rows, so they cannot drift apart.
  const timeState=(label,items,doneOf,openYesterday,noneText,unit)=>{
    const total=items.length;
    if(!total){ out.push({key:label,label,detail:noneText,val:'—',state:'ok'}); return; }
    const done=items.filter(doneOf).length;
    if(!isToday){
      out.push({key:label,label,detail:done+'/'+total+' '+unit,val:done+'/'+total,
        state:done===total?'ok':'watch'});
      return;
    }
    const duePast=items.filter(i=>!doneOf(i)&&hhmmHours(i.at)<=nowH).length;
    const detail = openYesterday ? openYesterday+' open from yesterday'
      : duePast ? duePast+' past due · '+done+'/'+total
      : done===total ? 'all '+unit : done+'/'+total+' '+unit+' · on track';
    out.push({key:label,label,detail,val:done+'/'+total,
      state: openYesterday?'warn' : duePast?'watch' : 'ok'});
  };

  const vr=activeRoutinesOn(viewDate).map(r=>({id:r.id,at:r.time}));
  const yr=(isToday&&tracked(state,yest))?(()=>{ const ym=marksOn(state,yest);
    return activeRoutinesOn(yest).filter(r=>!ym[r.id]).length; })():0;
  timeState('Routine',vr,i=>!!mr[i.id],yr,'nothing scheduled','complete');

  // Supplement times live on the block, not the item, so pair them up.
  const vs=SUPP_BLOCKS.flatMap(b=>b.items.map(i=>({id:i.id,at:b.time})));
  const ys=(isToday&&tracked(suppState,yest))?(()=>{ const ym=marksOn(suppState,yest);
    return vs.filter(i=>!ym[i.id]).length; })():0;
  timeState('Supplements',vs,i=>!!ms[i.id],ys,'none configured','taken');

  // Only meaningful for today — a past or future day has no "now" to be in.
  if(sameDay(viewDate,new Date())){
    const st=eatingState(new Date());
    // Short form is deliberately compact: it is drawn under a node, where a
    // full sentence collides with its neighbour.
    out.push({key:'fast', label:st.mode==='eating'?'Eating window':'Fasting',
      detail:hm(st.left)+(st.mode==='eating'?' remaining':' until window opens'),
      val:Math.floor(st.left)+'h '+Math.round(st.left%1*60)+'m',
      state:'ok'});
  }

  const overdue=visibleTasks().filter(t=>taskOverdue(t)).length;
  const dueToday=visibleTasks().filter(t=>!t.done&&t.date===key(viewDate)).length;
  out.push({key:'tasks', label:'Tasks',
    detail: overdue?overdue+' overdue' : dueToday?dueToday+' due today' : 'clear',
    val: overdue?overdue+' overdue' : dueToday?dueToday+' due' : 'clear',
    state: overdue?'warn' : dueToday?'watch' : 'ok'});

  // Days since the newest panel. PANELS is date-sorted, so the last is newest.
  // Counted from the date IN the report, not from when it was imported — a
  // panel uploaded today but drawn six weeks ago is six weeks old.
  // Thresholds are the user's own testing cadence, set in September 2026:
  // amber past two months, red past three. They replaced a 30/60 pair that
  // ran ahead of an actually-monthly routine, which had it turning amber
  // before a panel was even due.
  if(PANELS.length){
    const last=PANELS[PANELS.length-1];
    const days=Math.floor((dayStart(new Date())-dayStart(parseDay(last.date)))/86400000);
    out.push({key:'bio', label:'Biomarkers',
      detail:days+' day'+(days===1?'':'s')+' since panel', val:days+'d',
      state: days>90?'warn' : days>60?'watch' : 'ok'});
  } else {
    out.push({key:'bio', label:'Biomarkers', detail:'no panel on file',
      val:'none', state:'watch'});
  }

  if(BP.length){
    const days=Math.floor((dayStart(new Date())-dayStart(new Date(bpLatest().ts)))/86400000);
    const b=bpBand(bpLatest());
    // State tracks HOW RECENT the reading is, not how good it was: green
    // within the last 7 days, amber from 8-14 days, red after that. Set
    // this way in August 2026 at the user's request — it used to colour by
    // band, which meant a normal reading from three months ago sat there
    // reading green; thresholds adjusted in September 2026 (was green only
    // on the day itself, amber 1-7 days, red past a week).
    // The band has not been dropped, it moved into the detail line, so a
    // High reading still says so even while the dot is green for being
    // fresh. Do not fold the band back into the state without asking.
    out.push({key:'bp', label:'Blood pressure',
      detail:bpLatest().sys+'/'+bpLatest().dia+' · '+b.label.toLowerCase()
             +' · '+(days===0?'today':days===1?'yesterday':days+'d ago'),
      val:bpLatest().sys+'/'+bpLatest().dia,
      state: days<=7?'ok' : days<=14?'watch' : 'warn'});
  }

  // Reports the DAY first and the plumbing second: how many events are on
  // this day is the thing worth glancing at, a feed count is not. State still
  // tracks feed health, because a silently failing feed is the one calendar
  // problem you cannot see by looking at the day.
  // Also present when there are no subscriptions but imported .ics events
  // exist — otherwise a day full of events had no calendar row at all.
  const calEvents=eventsOn(viewDate);
  if(SUBS.length||calEvents.length){
    const bad=SUBS.filter(s=>s.status==='err').length;
    const evLbl=calEvents.length
      ? calEvents.length+' event'+(calEvents.length===1?'':'s')
      : 'no events';
    const feeds=SUBS.length
      ? (bad ? bad+' of '+SUBS.length+' feeds failing'
             : SUBS.length+' feed'+(SUBS.length===1?'':'s')+' syncing')
      : 'imported only';
    out.push({key:'cal', label:'Calendar',
      detail: evLbl+' · '+feeds,
      val: bad ? bad+' failing' : evLbl,
      state: bad?'warn':'ok'});
  }

  // Only present once something is actually connected — Whoop or Apple
  // Health — same reasoning as the calendar row above: an unconnected
  // domain is not a deviation to report on, it just doesn't exist yet.
  // Reads whichever source(s) wrote into METRICS for this day; nothing
  // here assumes it's Whoop specifically (see activityDataFor()).
  if(cloudSession && (whoopStatus || Object.keys(METRICS).length)){
    const entry=activityDataFor(key(viewDate));
    const recovery=entry?entry.data.recovery_score:null;
    const steps=entry?activityStepsFor(entry.data):null;
    if(recovery!=null){
      out.push({key:'integrations', label:'Integrations',
        detail:'recovery '+recovery+'%', val:recovery+'%',
        state: recovery>=67?'ok' : recovery>=34?'watch' : 'warn'});
    } else if(whoopStatus){
      out.push({key:'integrations', label:'Integrations',
        detail:'no Whoop score yet', val:'—', state:'watch'});
    } else {
      out.push({key:'integrations', label:'Integrations',
        detail: steps!=null?steps.toLocaleString('en-GB')+' steps':'no data yet',
        val: steps!=null?steps.toLocaleString('en-GB'):'—', state:'ok'});
    }
  }
  return out;
}

// Worst state wins. Read by the SYSTEMS block and by the header's completion
// bar, which is why it is a function and not an expression inside one of them.
function systemsWorst(rows){
  return (rows||systemsReport())
    .reduce((w,r)=>SYS_ORDER.indexOf(r.state)>SYS_ORDER.indexOf(w)?r.state:w,'ok');
}

function systemsHTML(){
  const rows=systemsReport();
  const worst=systemsWorst(rows);
  const headline={ok:'All systems nominal',watch:'Minor deviations',warn:'Attention required'}[worst];
  return `<div class="sysblock ${worst}" id="sysBlock">
    <button class="sys-head" onclick="sysToggle()" aria-expanded="${sysOpen}">
      <span class="sys-dot ${worst}"></span>
      <span class="sys-title">Systems</span>
      <span class="sys-headline">${headline}</span>
      <span class="sys-caret">${sysOpen?'▾':'▸'}</span>
    </button>
    ${sysOpen?`<div class="sys-rows">${rows.map(r=>
      `<div class="sys-row">
         <span class="sys-dot ${r.state}"></span>
         <span class="sys-label">${esc(r.label)}</span>
         <span class="sys-detail">${esc(r.detail)}</span>
       </div>`).join('')}</div>`:''}
  </div>`;
}
let sysOpen=false;
function sysToggle(){ sysOpen=!sysOpen; render(); }

// ROADMAP.md 5.3. Today only — a past or future day has no "today's
// activity" to show — and only when there is actually something to show,
// so a signed-out user or a day before the Shortcut existed sees nothing.
function agendaActivityLineHTML(){
  if(!sameDay(viewDate,new Date())) return '';
  const entry=activityDataFor(key(new Date()));
  if(!entry) return '';
  const steps=activityStepsFor(entry.data), mins=activityMinutesFor(entry.data);
  const parts=[];
  if(steps!=null) parts.push(`<span><b>${esc(steps.toLocaleString('en-GB'))}</b> steps</span>`);
  if(mins!=null) parts.push(`<span><b>${esc(String(mins))}</b> min active</span>`);
  return parts.length?`<div class="act-today">${parts.join('')}</div>`:'';
}
function renderAgenda(c){
  c.insertAdjacentHTML('beforeend', agendaActivityLineHTML());
  c.insertAdjacentHTML('beforeend', systemsHTML());
  const items=agendaOn(viewDate);
  // insertAdjacentHTML, not innerHTML: the systems block is already in here
  // and assigning would wipe it.
  if(!items.length){
    c.insertAdjacentHTML('beforeend','<div class="empty">Nothing on this day.<br>Tap + to add something.</div>');
    return;
  }
  const mr=marks(state), ms=marks(suppState);
  const isToday=sameDay(viewDate,new Date());
  const nowT=isToday?hhmm(new Date()):null;
  let nowPlaced=false;

  items.forEach(a=>{
    if(nowT && !nowPlaced && a.t>nowT){
      const n=document.createElement('div'); n.className='now-line'; n.id='scrollAnchor';
      n.innerHTML='<span class="lbl">NOW '+nowT+'</span><span class="ln"></span>';
      c.appendChild(n); nowPlaced=true;
    }
    const row=document.createElement('div');
    if(a.kind==='routine'){
      const r=a.ref, active=isOptActive(r,viewDate), done=active&&!!mr[r.id];
      row.className='row'+(done?' done':'')+(active?'':' opt-off');
      const pill=r.optional
        ? `<button class="opt-pill ${active?'':'off'}" data-opt="${r.id}">${active?'Optional · on':'Optional · off'}</button>`
        : '';
      row.innerHTML=`<span class="ag-time">${r.time}<small>${r.dur} min</small></span>
        <div class="check ${done?'on':''}${active?'':' plus'}" data-${active?'id':'opt'}="${r.id}"></div>
        <div class="rbody"><div class="rtitle">${esc(r.title)}</div>
          <div class="rmeta"><span class="tag ${r.cat}">${LABEL[r.cat]}</span>${pill}${streakPill(r)}</div>
          ${descPeekHTML(r,'r:'+r.id)}</div>
        <div class="acts"><button class="ico edit" data-edit="${r.id}">✎</button></div>`;
    } else if(a.kind==='supp'){
      const b=a.ref, tot=b.items.length, dn=b.items.filter(i=>ms[i.id]).length, all=dn===tot;
      row.className='row'+(all?' done':'');
      row.innerHTML=`<span class="ag-time">${b.time}<small>${dn}/${tot}</small></span>
        <div class="check ${all?'on':''}" data-blk="${b.id}"></div>
        <div class="rbody"><div class="rtitle">Supplements · ${esc(b.title)}</div>
          <div class="ag-sub">${esc(b.items.map(i=>i.name).join(', '))}</div></div>
        <div class="acts"><button class="ico edit" data-goblk="1">✎</button></div>`;
    } else if(a.kind==='task'){
      const t=a.ref;
      row.className='row'+(t.done?' done':'');
      row.innerHTML=`<span class="ag-time">${a.allDay?'all<small>day</small>':a.t}</span>

          <div class="rmeta"><span class="tag task">Task</span>${subCount(t)}</div></div>`;
    } else {
      const e=a.ref, done=!!mr['ev:'+e.id];
      row.className='row'+(done?' done':'');
      const sub=e.src==='sub'?SUBS.find(s=>s.id===e.subId):null;

      const label=sub?esc(sub.name):(e.src==='sub'?'Calendar':'Imported');

        ${e.src==='sub'?'':`<div class="acts"><button class="ico del" data-edel="${e.id}">✕</button></div>`}`;
    }
    c.appendChild(row);
    if(a.kind==='routine') c.insertAdjacentHTML('beforeend',descPanelHTML(a.ref,'r:'+a.ref.id));
  });
  if(nowT && !nowPlaced){
    const n=document.createElement('div'); n.className='now-line'; n.id='scrollAnchor';
    n.innerHTML='<span class="lbl">NOW '+nowT+'</span><span class="ln"></span>';
    c.appendChild(n);
  }

  c.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{ const m=marks(state); m[x.dataset.id]=!m[x.dataset.id]; render(); });
  c.querySelectorAll('[data-opt]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); toggleOpt(x.dataset.opt); });
  c.querySelectorAll('[data-blk]').forEach(x=>x.onclick=()=>{
    const b=SUPP_BLOCKS.find(y=>y.id===x.dataset.blk), m=marks(suppState);
    const all=b.items.every(i=>m[i.id]); b.items.forEach(i=>m[i.id]=!all); render();
  });
  c.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{ activeTab='routine'; openSheet('edit',x.dataset.edit); activeTab='agenda'; });
  c.querySelectorAll('[data-goblk]').forEach(x=>x.onclick=()=>setTab(SECTIONS.supps?'supps':nearestVisibleTab()));
  c.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>deleteEventById(b.dataset.edel));
  bindTaskRows(c);
  bindDescRows(c);
  markFirstOpenRow(c);
}

function deleteEventById(id){
  const i=IMPORTED.findIndex(e=>e.id===id);

}

let monthsBack=0, monthsFwd=12, monthScrollHooked=false;
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];

function dayFlags(d){
  const k=key(d);
  const calColors=[...new Set(eventsOn(d).map(eventColor))];
  const once=ROUTINES.filter(r=>r.date===k).length;
  const sport=activeRoutinesOn(d).filter(r=>r.cat==='sport').length;
  return {calColors,once,sport};
}
function dotsHTML(f){
  let dots=f.calColors.slice(0,4).map(c=>`<span class="dot" style="background:${c}"></span>`).join('');
  if(f.once) dots+='<span class="dot once"></span>';
  if(f.sport) dots+='<span class="dot sport"></span>';
  return dots;
}
// Desktop-width month cells show titles instead of dots; kept behind
// [hidden] on the wrapper so mobile markup and rendering are unaffected.
function cellEventsHTML(d){
  const evs=eventsOn(d), shown=evs.slice(0,3);
  const previews=shown.map(e=>{
    const c=eventColor(e);
    return `<div class="mev" style="background:${hexA(c,0.16)};border-left-color:${c}">${esc(e.title)}</div>`;
  }).join('');
  const more=evs.length>shown.length?`<div class="mev-more">+${evs.length-shown.length} more</div>`:'';
  return previews+more;
}

function monthBlock(offset){
  const base=new Date(); base.setHours(0,0,0,0); base.setDate(1);
  base.setMonth(base.getMonth()+offset);
  const y=base.getFullYear(), mo=base.getMonth();
  const first=new Date(y,mo,1), lead=(first.getDay()+6)%7;
  const dim=new Date(y,mo+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);

  let cells='';
  for(let i=0;i<lead;i++) cells+='<button class="cell pad"><span class="num"></span></button>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,mo,d);
    const f=dayFlags(dt);
    const cls=['cell'];
    if(sameDay(dt,today)) cls.push('today');
    if(sameDay(dt,viewDate)) cls.push('sel');
    if(dt.getDay()===0||dt.getDay()===6) cls.push('wknd');
    cells+=`<button class="${cls.join(' ')}" data-day="${key(dt)}">
      <span class="num">${d}</span><span class="dots">${dotsHTML(f)}</span>
      <div class="cell-events" hidden>${cellEventsHTML(dt)}</div></button>`;
  }
  return `<div class="month" id="m${offset}">
      <div class="mhead">${MONTH_NAMES[mo]} <span>${y}</span></div>
      <div class="wdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
      <div class="mgrid">${cells}</div>
    </div>`;
}

/* ---------- ACCOUNT & CLOUD SYNC PANEL ----------
   Lives in the header Settings sheet (renderSettingsSheet), not any one
   tab. Signed out, it is a collapsed one-liner so a user who never wants
   cloud sync pays nothing for it visually either — opening it is also
   what triggers the first, speculative load of supabase-js (see
   acctToggleOpen). */
function cloudStatusLabel(){
  if(cloudStatus==='synced') return {cls:'ok', txt:'Synced'};
  if(cloudStatus==='pending') return {cls:'watch', txt:'Syncing…'};
  if(cloudStatus==='error') return {cls:'warn', txt:cloudStatusMsg||'Sync error'};
  return {cls:'', txt:'Offline — will retry'};
}
function acctToggleOpen(){
  acctOpen=!acctOpen;
  if(acctOpen) loadSupabaseSDK().catch(()=>{});   // pre-warm only; real errors surface on submit
  render();
}
function acctReadFields(){
  const email=((document.getElementById('acctEmail')||{}).value||'').trim();
  const password=(document.getElementById('acctPassword')||{}).value||'';
  return {email,password};
}
async function acctSignIn(){
  if(acctBusy) return;
  const {email,password}=acctReadFields();
  acctEmailDraft=email;
  if(!email||!password){ acctMsg='Enter both email and password.'; render(); return; }
  acctBusy=true; acctMsg='Signing in…'; render();
  try{
    const sb=await getSbClient();
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    cloudSession=data.session; cloudEmail=data.user.email; saveCloudMeta();
    acctBusy=false; acctMsg=''; render();
    await cloudProceedAfterAuth(sb);
  }catch(e){
    acctBusy=false;
    acctMsg=/Invalid login credentials/i.test(e.message||'') ? 'Wrong email or password.' : (e.message||'Sign-in failed.');
    render();
  }
}
async function acctSignUp(){
  if(acctBusy) return;
  const {email,password}=acctReadFields();
  acctEmailDraft=email;
  if(!email||!password){ acctMsg='Enter both email and password.'; render(); return; }
  if(password.length<6){ acctMsg='Password needs at least 6 characters.'; render(); return; }
  acctBusy=true; acctMsg='Creating account…'; render();
  try{
    const sb=await getSbClient();
    const {data,error}=await sb.auth.signUp({email,password});
    if(error) throw error;
    acctBusy=false;
    if(data.session){
      // Confirmation switched off on this project — session arrives immediately.
      cloudSession=data.session; cloudEmail=data.user.email; saveCloudMeta();
      acctMsg=''; render();
      await cloudProceedAfterAuth(sb);
    }else{
      acctMsg='Account created — check your email to confirm it, then sign in.';
      render();
    }
  }catch(e){
    acctBusy=false;
    acctMsg=/already registered|already exists/i.test(e.message||'') ? 'That email already has an account — sign in instead.' : (e.message||'Sign-up failed.');
    render();
  }
}
async function acctSyncNow(){
  if(!cloudSession||acctBusy) return;
  acctBusy=true; render();
  try{ const sb=await getSbClient(); await cloudReconcile(sb); }
  catch(e){ cloudStatus='error'; cloudStatusMsg=e.message||'Sync failed.'; }
  acctBusy=false; render();
}
async function acctSignOut(){
  if(cloudPushTimer){ clearTimeout(cloudPushTimer); cloudPushTimer=null; }
  try{ if(sbClient) await sbClient.auth.signOut(); }catch(e){}
  cloudSession=null; cloudEmail=''; cloudLastSyncedAt=null; cloudLastPushedJSON=null;
  cloudConflict=null; cloudStatus='offline'; cloudStatusMsg=''; acctMsg=''; acctOpen=false;
  consentRow=null; consentGateOpen=false; consentChecked=false;
  acctDeleteOpen=false; acctDeleteTyped=''; acctDeleteBusy=false; acctDeleteMsg='';
  connLoaded=false; connLoading=false; connTokens=[];

  METRICS={}; actSelectedDay=null;

  whoopSyncing=false; whoopMsg='';
  saveCloudMeta();
  render();
}
function consentToggleCheck(v){ consentChecked=v; render(); }
async function consentAccept(){
  if(!consentChecked||!cloudSession||acctBusy) return;
  acctBusy=true; render();
  try{
    const sb=await getSbClient();
    const nowIso=new Date().toISOString();
    const {error}=await sb.from('consents')
      .upsert({user_id:cloudSession.user.id, accepted_at:nowIso, version:CONSENT_VERSION});
    if(error) throw error;
    consentRow={accepted_at:nowIso, version:CONSENT_VERSION};
    consentGateOpen=false; consentChecked=false;
    acctBusy=false; render();
    await cloudReconcile(sb);
  }catch(e){
    acctBusy=false;
    cloudStatusMsg=e.message||'Could not save consent — try again.';
    render();
  }
}
function acctDeleteToggle(){
  acctDeleteOpen=!acctDeleteOpen; acctDeleteTyped=''; acctDeleteMsg='';

}
// Deletes the auth.users row via the delete_own_account() RPC in
// zeus-schema.sql — SECURITY DEFINER, scoped to auth.uid(), since the
// client only ever holds the anon key and must never see a service-role
// key. on delete cascade on app_data/consents/profiles handles the rest.
// Local storage is never touched, so the app keeps working offline after.
async function acctDeleteAccount(){
  if(!cloudSession||acctDeleteBusy) return;
  const el=document.getElementById('acctDeleteInput');
  acctDeleteTyped=el?el.value:'';
  if(acctDeleteTyped.trim()!=='DELETE'){ acctDeleteMsg='Type DELETE (all caps) to confirm.'; render(); return; }
  acctDeleteBusy=true; acctDeleteMsg='Deleting…'; render();
  try{
    download(JSON.stringify({...collectState(), exportedAt:new Date().toISOString(), appVersion:APP_VERSION, schema:2},null,2),
      'zeus-backup-before-delete-'+key(new Date())+'.json', 'application/json;charset=utf-8');
    const sb=await getSbClient();
    const {error}=await sb.rpc('delete_own_account');
    if(error) throw error;
    acctDeleteOpen=false; acctDeleteBusy=false; acctDeleteTyped=''; acctDeleteMsg='';
    await acctSignOut();
  }catch(e){
    acctDeleteBusy=false;
    acctDeleteMsg=e.message||'Could not delete the account — try again.';
    render();
  }
}
function acctDeferConflict(){
  cloudConflict=null;
  cloudStatus='error'; cloudStatusMsg='Sync paused — cloud and this device differ. Tap Sync now to decide.';
  render();
}
function acctChooseLocal(){
  if(!cloudConflict) return;
  const {remote}=cloudConflict;
  download(JSON.stringify({...remote.payload, exportedAt:new Date().toISOString(), appVersion:APP_VERSION, schema:2},null,2),
    'zeus-conflict-cloud-'+key(new Date())+'.json', 'application/json;charset=utf-8');
  cloudConflict=null;
  cloudLastPushedJSON=null;   // the cloud copy just downloaded differs from ours — force the push through
  cloudPushNow();
  render();
}
function acctChooseCloud(){
  if(!cloudConflict) return;
  const {remote}=cloudConflict;
  download(JSON.stringify({...collectState(), exportedAt:new Date().toISOString(), appVersion:APP_VERSION, schema:2},null,2),
    'zeus-conflict-device-'+key(new Date())+'.json', 'application/json;charset=utf-8');
  applyBackup(remote.payload);
  cloudLastSyncedAt=remote.updated_at; saveCloudMeta();
  cloudConflict=null;
  saveAll();
  cloudLastPushedJSON=JSON.stringify(cloudSyncPayload());   // same reasoning as in cloudReconcile's pull branch
  render();
  // Same as the pull branch in cloudReconcile: SUBS came back with no
  // events, so fetch now rather than waiting for the next timer tick.
  if(SUBS.length){ startSubTimer(); subFetchAll(true); }
}
