/* ---------- CONNECTIONS (ROADMAP.md 5.3) ----------
   Long-lived device tokens for the Apple Shortcut that posts to the
   ingest Edge Function — a Supabase session expires in ~1h, too short
   for a daily automation. Only the SHA-256 hash ever reaches the
   database (matches supabase/functions/ingest, which hashes the
   presented token the same way to look it up); the plaintext exists
   only in connGeneratedPlaintext, in memory, never persisted, and is
   cleared the moment the user dismisses the one-time reveal. */
let connOpen=false;
let connLoaded=false, connLoading=false, connTokens=[];
let connNewLabel='', connGenerating=false, connGeneratedPlaintext=null, connMsg='';

function randomDeviceToken(){
  const bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  // base64url, unpadded — compact and safe as a bearer token / header value.
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256Hex(str){
  const digest=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function connLoadTokens(){
  if(!cloudSession) return;
  try{
    const sb=await getSbClient();
    const {data,error}=await sb.from('device_tokens')
      .select('id,label,created_at,last_used')
      .eq('user_id',cloudSession.user.id).is('revoked_at',null)
      .order('created_at',{ascending:false});
    if(error) throw error;
    connTokens=data||[];
  }catch(e){
    connMsg=e.message||connMsg;
  }
}
function connTokenListHTML(){
  if(connLoading) return '<div class="sub-empty">Loading…</div>';
  if(!connTokens.length) return '<div class="sub-empty">No tokens yet.</div>';
  return connTokens.map(t=>`
    <div class="sub-row">
      <div class="sub-info">
        <div class="sub-name">${esc(t.label||'Unnamed token')}</div>
        <div class="sub-meta">Created ${new Date(t.created_at).toLocaleDateString()} · ${t.last_used?'last used '+new Date(t.last_used).toLocaleString():'never used'}</div>
      </div>
      <button class="ico del" onclick="connRevokeToken('${t.id}')" title="Revoke">✕</button>
    </div>`).join('');
}
// Refreshes just the token list in place, not the whole card via render() —
// the label input sits in the same card, and a full render() while someone
// is mid-label would blow their typing away the moment this resolves.
function refreshConnTokenList(){
  const el=document.getElementById('connTokenList');
  if(el) el.innerHTML=connTokenListHTML();
}
async function connGenerateToken(){
  if(!cloudSession||connGenerating) return;
  const el=document.getElementById('connLabelInput');
  connNewLabel=el?el.value:'';
  connGenerating=true; connMsg=''; render();
  try{
    const token=randomDeviceToken();
    const hash=await sha256Hex(token);
    const sb=await getSbClient();
    const {error}=await sb.from('device_tokens')
      .insert({user_id:cloudSession.user.id, token_hash:hash, label:connNewLabel.trim()||null});
    if(error) throw error;
    connGeneratedPlaintext=token;   // shown once; never re-derivable, since only the hash was stored
    connNewLabel='';
    await connLoadTokens();
  }catch(e){
    connMsg=e.message||'Could not create a token.';
  }
  connGenerating=false; render();
}
async function connRevokeToken(id){
  if(!cloudSession) return;
  if(!confirm('Revoke this token? Any Shortcut using it will stop working.')) return;
  try{
    const sb=await getSbClient();
    const {error}=await sb.from('device_tokens')
      .update({revoked_at:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
    await connLoadTokens();
    refreshConnTokenList();
  }catch(e){
    connMsg=e.message||'Could not revoke the token.';
    render();
  }
}
async function connCopyToken(){
  if(!connGeneratedPlaintext) return;
  try{ await navigator.clipboard.writeText(connGeneratedPlaintext); connMsg='Copied.'; }
  catch(e){ connMsg='Could not copy — select the text and copy it manually.'; }
  render();
}
function connDismissGenerated(){
  connGeneratedPlaintext=null; connMsg='';
  render();
}
// Shared by the first-connect prompt below and the token-management card —
// same generate/reveal form either way, just embedded in different cards.
function connTokenFormHTML(cta){
  return connGeneratedPlaintext ? `
    <div class="gsub" style="color:var(--amber);margin-bottom:6px">Copy this now — it will not be shown again.</div>
    <div class="gid-input" style="user-select:all;word-break:break-all;cursor:text">${esc(connGeneratedPlaintext)}</div>
    <div class="backup-row" style="margin-top:0">
      <button class="gbtn pri" onclick="connCopyToken()">Copy</button>
      <button class="gbtn sec" onclick="connDismissGenerated()">Done</button>
    </div>` : `
    <input class="gid-input" id="connLabelInput" placeholder="Label (optional) — e.g. iPhone Shortcut" value="${esc(connNewLabel)}" ${connGenerating?'disabled':''}>
    <div class="backup-row" style="margin-top:0">
      <button class="gbtn pri" ${connGenerating?'disabled':''} onclick="connGenerateToken()">${connGenerating?'Generating…':cta}</button>
    </div>`;
}
function connMsgHTML(){
  return connMsg?`<div class="gsub" style="margin:10px 0 0;color:${/copied/i.test(connMsg)?'var(--moss)':'var(--rose)'}">${esc(connMsg)}</div>`:'';
}
// First-time prompt, shown in the Settings sheet until at least one
// Shortcut token exists — same role as Whoop's "Connect Whoop" card, just
// backed by a device token instead of OAuth since HealthKit has no web
// API (ROADMAP.md 5.3).
function appleHealthConnectCardHTML(){
  return `<div class="gcard">
    <div class="gtop"><span class="gtitle">Apple Health</span></div>
    <div class="gsub">Steps and workout minutes, via an Apple Shortcut. Not connected.</div>
    ${connTokenFormHTML('Connect Apple Health')}

}
// Token management once at least one connection exists — add another device,
// see last-used times, revoke. Collapsed by default like the Settings
// sheet's other cards.
function connectionsCardHTML(){
  if(!connOpen){
    return `<div class="gcard cal-collapsed" onclick="connOpen=true;render()">
      <div class="gtop"><span class="gtitle">Manage Apple Health</span>
        <span class="cal-collapsed-meta">${connTokens.length} token${connTokens.length===1?'':'s'} ›</span></div>

  return `<div class="gcard">

    <div class="gsub">Long-lived tokens for the Apple Shortcut that sends Health data — a signed-in session expires in about an hour, too short for a daily automation.</div>
    ${connTokenFormHTML('Generate Shortcut token')}
    ${connMsgHTML()}
    <div id="connTokenList" style="margin-top:14px">${connTokenListHTML()}</div>
  </div>`;
}
// Connect card + token management — lives in the header Settings sheet now
// (renderSettingsSheet). The actual step/workout dashboard is
// activitySectionHTML(), called directly from renderIntegrations; it

function appleHealthSettingsHTML(){
  if(!cloudSession) return '';
  if(!connLoaded&&!connLoading){

  if(!connLoaded){
    return `<div class="gcard"><div class="gtop"><span class="gtitle">Apple Health</span></div>
      <div class="gsub">Loading…</div></div>`;
  }
  return connTokens.length ? connectionsCardHTML() : appleHealthConnectCardHTML();

function refreshDots(){
  document.querySelectorAll('[data-day]').forEach(b=>{
    const f=dayFlags(parseDay(b.dataset.day));
    const el=b.querySelector('.dots'); if(el) el.innerHTML=dotsHTML(f);

function bindDayCells(root){
  root.querySelectorAll('[data-day]:not([data-bound])').forEach(b=>{

function loadEarlier(){
  const w=document.getElementById('monthWrap'); if(!w) return;
  const before=document.body.scrollHeight;
  let add=''; for(let i=monthsBack+6;i>=monthsBack+1;i--) add+=monthBlock(-i);
  w.insertAdjacentHTML('afterbegin',add);
  monthsBack+=6;
  bindDayCells(w);
  const after=document.body.scrollHeight;
  window.scrollBy(0, after-before);
}

const HOUR_PX_MOBILE=84, HOUR_PX_DESKTOP=64;
const hourPx=()=>isDesktopLayout()?HOUR_PX_DESKTOP:HOUR_PX_MOBILE;

function layoutDay(entries){
  const sorted=[...entries].sort((a,b)=>a.start-b.start||a.end-b.end);
  let cluster=null;
  sorted.forEach(e=>{
    if(cluster && e.start<cluster.maxEnd){ cluster.items.push(e); cluster.maxEnd=Math.max(cluster.maxEnd,e.end); }
    else { cluster={items:[e],maxEnd:e.end}; }
    e.cluster=cluster;
  });
  const seen=new Set();
  sorted.forEach(e=>{
    const cl=e.cluster; if(seen.has(cl)) return; seen.add(cl);
    const cols=[];
    cl.items.forEach(it=>{
      let ci=cols.findIndex(end=>end<=it.start);
      if(ci===-1){ ci=cols.length; cols.push(it.end); } else cols[ci]=it.end;
      it.col=ci;
    });
    cl.items.forEach(it=>{ it.colCount=cols.length; });
  });
}

function scrollDayView(){
  setTimeout(()=>{
    const wrap=document.getElementById('dayTimeline'); if(!wrap) return;
    const now=new Date();
    const mins=sameDay(viewDate,now)?(now.getHours()*60+now.getMinutes()):7*60;
    const hh=isDesktopLayout()?0:document.querySelector('header').offsetHeight;
    const top=wrap.offsetTop+mins/60*hourPx()-hh-40;
    window.scrollTo({top:Math.max(0,top),behavior:'instant'});
  },0);
}

function updateNowLine(){
  const el=document.getElementById('nowLine'); if(!el) return;
  if(!sameDay(viewDate,new Date())){ el.remove(); return; }
  const now=new Date();
  el.style.top=((now.getHours()*60+now.getMinutes())/60*hourPx())+'px';
}

function renderDayView(c){
  // Calendar-only, on purpose — routines and supplements live in the Agenda
  // tab; mixing them into the day timeline made it too crowded.
  const evs=eventsOn(viewDate);
  const allDayItems=evs.filter(e=>e.allDay);
  const timedItems=evs.filter(e=>!e.allDay);
  const dayTasks=visibleTasks().filter(t=>t.date===key(viewDate));
  const untimedTasks=dayTasks.filter(t=>!t.time);
  const timedTasks=dayTasks.filter(t=>t.time);
  const isToday=sameDay(viewDate,new Date());

  c.insertAdjacentHTML('beforeend',`
    <div class="day-head">
      <button class="day-back" onclick="calMode=calReturnMode;render()">‹ Back</button>
      <div class="day-title">${esc(viewDate.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</div>
      <div class="day-arrows"><button onclick="shiftDay(-1)">‹</button><button onclick="shiftDay(1)">›</button></div>
    </div>`);

  if(allDayItems.length||untimedTasks.length){
    const rows=allDayItems.map(e=>{
      const color=eventColor(e);
      return `<div class="day-allday" style="border-left-color:${color};background:${hexA(color,0.16)}">${esc(e.title)}</div>`;
    }).concat(untimedTasks.map(t=>
      `<div class="day-allday" style="border-left-color:${TASK_COLOR};background:${hexA(TASK_COLOR,0.16)}"
        onclick="openTaskDetail('${t.id}')">${esc(t.title)}</div>`
    )).join('');
    c.insertAdjacentHTML('beforeend',`<div class="day-allday-strip">${rows}</div>`);
  }

  const entries=timedItems.map(e=>{
    const start=e.start.getHours()*60+e.start.getMinutes();
    return {start,end:start+Math.max(e.dur,1),dur:e.dur,title:e.title,color:eventColor(e),tap:''};
  }).concat(timedTasks.map(t=>{
    // Tasks carry no duration, so give them a nominal 30-minute block.
    const [h,m]=t.time.split(':').map(Number);
    const start=h*60+m;
    return {start,end:start+30,dur:30,title:t.title,color:TASK_COLOR,
      tap:`onclick="openTaskDetail('${t.id}')"`};
  }));
  layoutDay(entries);

  const blocksHTML=entries.map(en=>{
    const top=en.start/60*hourPx(), height=Math.max(40,en.dur/60*hourPx());
    const widthPct=100/en.colCount, leftPct=widthPct*en.col;
    const endMin=en.start+en.dur;
    const timeLbl=`${pad(Math.floor(en.start/60)%24)}:${pad(en.start%60)}–${pad(Math.floor(endMin/60)%24)}:${pad(endMin%60)}`;
    return `<div class="day-block" style="top:${top}px;height:${height}px;
      left:calc(${leftPct}% + 2px);width:calc(${widthPct}% - 4px);
      border-left-color:${en.color};background:${hexA(en.color,0.16)};cursor:${en.tap?'pointer':'default'}" ${en.tap||''}>
      <div class="db-title">${esc(en.title)}</div><div class="db-time">${timeLbl}</div>
    </div>`;
  }).join('');

  const hp=hourPx();
  const hourLabels=Array.from({length:24},(_,h)=>`<div class="day-hour" style="top:${h*hp}px">${pad(h)}:00</div>`).join('');
  const hourLines=Array.from({length:24},(_,h)=>`<div class="day-hourline" style="top:${h*hp}px"></div>`).join('');
  const nowLine=isToday?`<div class="now-line-day" id="nowLine" style="top:${(new Date().getHours()*60+new Date().getMinutes())/60*hp}px"></div>`:'';

  c.insertAdjacentHTML('beforeend',`
    <div class="day-timeline" id="dayTimeline" style="height:${24*hp}px">
      ${hourLabels}${hourLines}${nowLine}
      <div class="day-events">${blocksHTML}</div>
    </div>`);
}

function weekStart(d){
  const dt=new Date(d); dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-((dt.getDay()+6)%7));
  return dt;
}

function weekRangeLabel(start){
  const end=new Date(start); end.setDate(start.getDate()+6);
  const sameMonthYear=start.getMonth()===end.getMonth()&&start.getFullYear()===end.getFullYear();
  if(sameMonthYear) return start.getDate()+' – '+end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const sameYear=start.getFullYear()===end.getFullYear();
  const f=(d,withYear)=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:withYear?'numeric':undefined});
  return f(start,!sameYear)+' – '+f(end,true);
}

// Only real calendar events (imported/subscribed) preview here, on purpose —
// routines and supplements already crowd the Agenda tab, and a full week of
// them stacked into these narrow grid cells would be unreadable.
let weeksBack=0, weeksFwd=8, weekScrollHooked=false;

function weekBlock(offset){
  const anchor=weekStart(new Date());
  const start=new Date(anchor); start.setDate(anchor.getDate()+offset*7);
  const today=new Date(); today.setHours(0,0,0,0);

  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const evs=eventsOn(d);
    const cls=['wk-cell'];
    if(sameDay(d,today)) cls.push('today');
    if(sameDay(d,viewDate)) cls.push('sel');
    const shown=evs.slice(0,3);
    const previews=shown.map(e=>{
      const c2=eventColor(e);
      return `<div class="wk-ev" style="background:${hexA(c2,0.16)};border-left-color:${c2}">${esc(e.title)}</div>`;
    }).join('');
    const more=evs.length>shown.length?`<div class="wk-more">+${evs.length-shown.length} more</div>`:'';
    cells+=`<button class="${cls.join(' ')}" data-day="${key(d)}">
      <span class="wk-daynum">${d.getDate()}</span>
      <div class="wk-evs">${previews}${more}</div>
    </button>`;
  }
  return `<div class="weekrow" id="w${offset}">
    <div class="wk-label">${esc(weekRangeLabel(start))}</div>
    <div class="wgrid">${cells}</div>
  </div>`;
}

function loadEarlierWeeks(){
  const w=document.getElementById('weekWrap'); if(!w) return;
  const before=document.body.scrollHeight;
  let add=''; for(let i=weeksBack+4;i>=weeksBack+1;i--) add+=weekBlock(-i);
  w.insertAdjacentHTML('afterbegin',add);
  weeksBack+=4;
  bindDayCells(w);
  const after=document.body.scrollHeight;
  window.scrollBy(0, after-before);
}

function renderWeekView(c){
  c.insertAdjacentHTML('beforeend','<button class="earlier-btn" onclick="loadEarlierWeeks()">‹ Earlier weeks</button>');
  c.insertAdjacentHTML('beforeend',
    '<div class="wgrid-head"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>');

  const wrap=document.createElement('div'); wrap.id='weekWrap';
  let html=''; for(let i=-weeksBack;i<=weeksFwd;i++) html+=weekBlock(i);
  wrap.innerHTML=html;
  c.appendChild(wrap);
  c.insertAdjacentHTML('beforeend','<div class="month-hint">Keep scrolling for more weeks</div>');

  bindDayCells(wrap);

  if(!weekScrollHooked){
    weekScrollHooked=true;
    window.addEventListener('scroll',()=>{
      if(activeTab!=='cal'||calMode!=='week') return;
      if(window.innerHeight+window.scrollY > document.body.offsetHeight-600){
        const w=document.getElementById('weekWrap'); if(!w) return;
        if(w.dataset.busy) return; w.dataset.busy='1';
        let add=''; for(let i=weeksFwd+1;i<=weeksFwd+4;i++) add+=weekBlock(i);
        weeksFwd+=4; w.insertAdjacentHTML('beforeend',add);
        bindDayCells(w);
        delete w.dataset.busy;
      }
    },{passive:true});
  }
}

function renderCalendar(c){
  if(calMode==='day'){ renderDayView(c); return; }
  // Same idea as Bio: the subscription card renders first but the view
  // opens below it, on the calendar itself. Account sign-in, personalisation,
  // backup/erase and device connections used to render here too — they moved
  // into the header Settings sheet (openSettingsSheet) so hiding this tab can
  // never seal them away again.
  c.insertAdjacentHTML('beforeend', subCardHTML());

  c.insertAdjacentHTML('beforeend',
    `<div class="cal-view-switch" id="scrollAnchor">
      <button class="chip${calMode==='week'?' active':''}" onclick="calMode='week';render()">Week</button>
      <button class="chip${calMode==='month'?' active':''}" onclick="calMode='month';render()">Month</button>
    </div>`);

  if(calMode==='week'){ renderWeekView(c); return; }

  c.insertAdjacentHTML('beforeend','<button class="earlier-btn" onclick="loadEarlier()">‹ Earlier months</button>');

  const wrap=document.createElement('div'); wrap.id='monthWrap';
  let html='';
  for(let i=-monthsBack;i<=monthsFwd;i++) html+=monthBlock(i);
  wrap.innerHTML=html;
  c.appendChild(wrap);
  c.insertAdjacentHTML('beforeend','<div class="month-hint">Keep scrolling for more months</div>');

  bindDayCells(wrap);

  if(!monthScrollHooked){
    monthScrollHooked=true;
    window.addEventListener('scroll',()=>{
      if(activeTab!=='cal') return;
      if(window.innerHeight+window.scrollY > document.body.offsetHeight-600){
        const w=document.getElementById('monthWrap'); if(!w) return;
        if(w.dataset.busy) return; w.dataset.busy='1';
        let add=''; for(let i=monthsFwd+1;i<=monthsFwd+6;i++) add+=monthBlock(i);
        monthsFwd+=6; w.insertAdjacentHTML('beforeend',add);
        bindDayCells(w);
        delete w.dataset.busy;
      }
    },{passive:true});
  }
}

/* ---------- MARKER DETAIL ----------
   One marker's history across every panel, as a sheet with an inline-SVG
   trend chart. No charting library: the app stays a single self-contained
   file. */

const normLabel=s=>String(s||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'');
let mdPoints=[];   // per-dot summaries for the chart currently on screen

function pickMarkerPoint(i){
  const p=mdPoints[i], box=document.getElementById('mdPoint');
  if(!p||!box) return;
  const rangeCls=p.range==='in range'?'inrange':'outrange';
  box.innerHTML=`<b>${esc(p.date)}</b> · ${esc(p.val)}`
    +(p.range?` · <span class="${rangeCls}">${p.range}</span>`:'')
    +(p.chg?`<br><span class="md-sub">${esc(p.chg)}</span>`:'')
    +(p.qual?`<br><span class="md-sub">Reported as a limit — the exact value is unknown.</span>`:'');
  document.querySelectorAll('.md-dot').forEach((el,j)=>el.setAttribute('r',j===i?'6':'4'));
}

function refLabel(v){
  if(v.refLo!=null&&v.refHi!=null) return v.refLo+'–'+v.refHi;
  if(v.refHi!=null) return '< '+v.refHi;
  if(v.refLo!=null) return '> '+v.refLo;
  return '';
}
function inRange(v){
  if(v==null||v.v==null) return null;
  if(v.refLo!=null&&v.refHi!=null) return v.v>=v.refLo&&v.v<=v.refHi;
  if(v.refHi!=null) return v.v<=v.refHi;
  if(v.refLo!=null) return v.v>=v.refLo;
  return null;
}
function fmtPanelDate(s){
  const [y,m,d]=String(s).split('-').map(Number);
  if(!y||!m||!d) return String(s);
  return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
const fmtNum=n=>Math.abs(n)>=100?n.toFixed(0):Math.abs(n)>=10?n.toFixed(1):n.toFixed(2).replace(/0$/,'');

// PANELS is date-sorted, so readings come back chronologically. The parser's
// key already includes section and unit, which is what we want — but a lab
// that renames a section or switches units between reports would break the
// chain, so fall back to a normalised label when the key finds no history.
function collectReadings(mkKey){
  const byKey=[];
  PANELS.forEach(p=>{ const hit=p.values.find(x=>x.key===mkKey); if(hit) byKey.push({panel:p,v:hit}); });
  if(byKey.length>=2) return byKey;
  const latest=byKey.length?byKey[byKey.length-1].v:null;
  if(!latest) return byKey;
  const target=normLabel(latest.label);
  const byLabel=[];
  PANELS.forEach(p=>{ const hit=p.values.find(x=>normLabel(x.label)===target); if(hit) byLabel.push({panel:p,v:hit}); });
  return byLabel.length>byKey.length?byLabel:byKey;
}

function markerChartSVG(readings,latest){
  const num=readings.filter(r=>r.v.text==null&&isFinite(r.v.v));
  if(!num.length) return '';
  const W=320,H=180,PL=38,PR=10,PT=12,PB=24;
  const PW=W-PL-PR, PH=H-PT-PB;
  const ts=num.map(r=>{ const [y,m,d]=r.panel.date.split('-').map(Number); return new Date(y,m-1,d).getTime(); });
  const t0=Math.min(...ts), t1=Math.max(...ts);
  const xOf=t=> (t1===t0) ? PL+PW/2 : PL+(t-t0)/(t1-t0)*PW;

  const vals=num.map(r=>r.v.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=((hi-lo)||Math.abs(hi)||1)*0.1;
  let ymin=lo-pad, ymax=hi+pad;
  // Pull the reference band in only when it is near the data; a far-off
  // bound would flatten the trend into a straight line.
  const span=ymax-ymin;
  const {refLo,refHi}=latest;
  if(refLo!=null&&refLo>ymin-span&&refLo<ymax+span){ ymin=Math.min(ymin,refLo-pad); ymax=Math.max(ymax,refLo+pad); }
  if(refHi!=null&&refHi>ymin-span&&refHi<ymax+span){ ymin=Math.min(ymin,refHi-pad); ymax=Math.max(ymax,refHi+pad); }
  if(ymax-ymin<1e-9){ ymin-=1; ymax+=1; }
  const yOf=v=>PT+(1-(v-ymin)/(ymax-ymin))*PH;

  let band='';
  if(refLo!=null||refHi!=null){
    const top=refHi!=null?yOf(Math.min(refHi,ymax)):PT;
    const bot=refLo!=null?yOf(Math.max(refLo,ymin)):PT+PH;
    if(bot>top) band=`<rect x="${PL}" y="${top}" width="${PW}" height="${bot-top}"
      fill="var(--moss)" opacity="0.10"/>`;
  }

  const pts=num.map((r,i)=>xOf(ts[i]).toFixed(1)+','+yOf(r.v.v).toFixed(1));
  const line=num.length>1
    ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--frost)" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>` : '';
  // Summary shown when a dot is tapped, indexed the same as the dots.
  mdPoints=num.map((r,i)=>{
    const prev=i>0?num[i-1]:null;
    let chg='';
    if(prev){
      const d=r.v.v-prev.v.v;
      chg=(Math.abs(d)<1e-9?'No change':(d>0?'▲ +'+fmtNum(d):'▼ '+fmtNum(d)))
        +' since '+fmtPanelDate(prev.panel.date);
    }
    const inR=inRange(r.v);
    return {date:fmtPanelDate(r.panel.date),
      val:(r.v.qual||'')+fmtNum(r.v.v)+(r.v.unit?' '+r.v.unit:''),
      range:inR===true?'in range':inR===false?'outside range':'',
      qual:!!r.v.qual, chg};
  });

  const dots=num.map((r,i)=>{
    const inR=inRange(r.v), col=(inR===false)?'var(--amber)':'var(--frost)';
    const [cx,cy]=[xOf(ts[i]),yOf(r.v.v)];
    // A qualifier ("<0.06") means the true value is unknown — hollow it out
    // rather than implying a precise reading.
    const dot=r.v.qual
      ? `<circle class="md-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(--bg)" stroke="${col}" stroke-width="2"/>`
      : `<circle class="md-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${col}"/>`;
    // A 4px dot is far too small to hit on a phone, so an invisible disc
    // carries the tap.
    return dot+`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="12" fill="transparent"
      style="cursor:pointer" onclick="pickMarkerPoint(${i})"/>`;
  }).join('');

  const first=num[0].panel.date, last=num[num.length-1].panel.date;
  const dateLbls=num.length>1
    ? `<text x="${PL}" y="${H-6}" fill="var(--faint)" font-size="10">${esc(fmtPanelDate(first))}</text>
       <text x="${W-PR}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtPanelDate(last))}</text>`
    : `<text x="${PL+PW/2}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="middle">${esc(fmtPanelDate(first))}</text>`;

  return `<div class="md-chart"><svg viewBox="0 0 ${W} ${H}" role="img">
    ${band}
    <line x1="${PL}" y1="${PT+PH}" x2="${W-PR}" y2="${PT+PH}" stroke="var(--line)" stroke-width="1"/>
    ${line}${dots}
    <text x="${PL-6}" y="${PT+4}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtNum(ymax))}</text>
    <text x="${PL-6}" y="${PT+PH}" fill="var(--faint)" font-size="10" text-anchor="end">${esc(fmtNum(ymin))}</text>
    ${dateLbls}
  </svg></div>`;
}

function markerDetailHTML(mkKey){
  const readings=collectReadings(mkKey);
  const back=`<button class="md-back" onclick="closeSheet()">‹ Back</button>`;
  if(!readings.length) return back+`<div class="md-note">No readings found for this marker.</div>`;

  const last=readings[readings.length-1], v=last.v;
  const isText=v.text!=null;
  const rl=refLabel(v), inR=inRange(v);

  // delta against the previous numeric reading
  let deltaHTML='';
  if(!isText){
    const prevNum=[...readings].slice(0,-1).reverse().find(r=>r.v.text==null&&isFinite(r.v.v));
    if(prevNum){
      const d=v.v-prevNum.v.v;
      const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
      const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
      deltaHTML=`<span class="md-delta ${cls}">${arrow} ${d>0?'+':''}${fmtNum(d)}</span>`;
    }
  }

  const header=`
    <div class="md-name">${esc(v.displayName||v.label)}</div>
    <div class="md-meta">${v.unit?esc(v.unit):'no unit'}${rl?' · reference '+esc(rl):' · no reference range'}${v.section?' · '+esc(v.section):''}</div>
    <div class="md-latest">
      <span class="md-val ${isText?'':(inR===false?'outr':inR===true?'inr':'')}">${isText?esc(v.text):esc(v.qual||'')+fmtNum(v.v)}</span>
      ${!isText&&v.unit?`<span class="md-unit">${esc(v.unit)}</span>`:''}
      ${deltaHTML}
    </div>
    <div class="md-meta">Latest · ${esc(fmtPanelDate(last.panel.date))}</div>`;

  const chart=isText?'':markerChartSVG(readings,v);   // also fills mdPoints
  const pointBox=chart?`<div class="md-point" id="mdPoint">Tap a point on the chart for details.</div>`:'';
  const single=!isText&&readings.filter(r=>r.v.text==null&&isFinite(r.v.v)).length<2
    ? `<div class="md-note">A trend needs at least two panels.</div>` : '';

  const rows=[...readings].reverse().map((r,i,arr)=>{
    const nxt=arr[i+1];   // chronologically previous
    let chg='<span class="flat">—</span>';
    if(r.v.text==null&&nxt&&nxt.v.text==null&&isFinite(r.v.v)&&isFinite(nxt.v.v)){
      const d=r.v.v-nxt.v.v;
      const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
      const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
      chg=`<span class="${cls}">${arrow} ${d>0?'+':''}${fmtNum(d)}</span>`;
    }
    const odd=r.v.unit!==v.unit;
    return `<div class="md-row">
      <span class="md-date">${esc(fmtPanelDate(r.panel.date))}</span>
      <span class="md-reading">${r.v.text!=null?esc(r.v.text):esc(r.v.qual||'')+fmtNum(r.v.v)}${r.v.unit?' '+esc(r.v.unit):''}${odd?'<span class="md-flag">≠ unit</span>':''}</span>
      <span class="md-chg">${r.v.text!=null?'':chg}</span>
    </div>`;
  }).join('');

  const mixed=readings.some(r=>r.v.unit!==v.unit)
    ? `<div class="md-note">≠ marks a reading the lab reported in a different unit. It is listed but not plotted as comparable.</div>` : '';

  return back+header+chart+pointBox+single+`<div class="md-sec">Readings</div>`+rows+mixed;
}

/* ---------- BLOOD PRESSURE ----------
   A hand-entered log, unlike the panels, which are parsed out of a PDF. Each
   reading carries its own timestamp so a measurement typed in later still
   sits at the time it was actually taken. */
const bpLatest=()=>BP.length?BP[BP.length-1]:null;

// The usual clinical bands, used only to colour the reading — never to
// diagnose. Anything at or above 140/90 reads as high, 130/85 as elevated.
function bpBand(r){
  if(r.sys>=140||r.dia>=90) return {cls:'high', label:'High'};
  if(r.sys>=130||r.dia>=85) return {cls:'elev', label:'Elevated'};
  if(r.sys<90||r.dia<60)    return {cls:'low',  label:'Low'};
  return {cls:'ok', label:'Normal'};
}
const bpWhen=ts=>{
  const d=new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+hhmm(d);
};

function bpAdd(){
  const sysEl=document.getElementById('bp-sys'), diaEl=document.getElementById('bp-dia'),
        pulEl=document.getElementById('bp-pulse'), whenEl=document.getElementById('bp-when');
  const sys=parseInt(sysEl.value,10), dia=parseInt(diaEl.value,10);
  const pulse=pulEl.value?parseInt(pulEl.value,10):null;
  // Guard rails wide enough for any real reading, narrow enough to catch a
  // slipped digit or the two fields being filled the wrong way round.
  if(!(sys>=60&&sys<=260)||!(dia>=30&&dia<=200)||sys<=dia){
    bpMsg='Check the numbers — systolic first, and it must be the higher one.';
    render(); return;
  }
  // datetime-local has no timezone; it is already local wall time, which is
  // what was meant, so it converts straight through Date().
  const ts=(whenEl&&whenEl.value)?new Date(whenEl.value).toISOString():new Date().toISOString();
  BP.push({id:'bp'+Date.now(), sys, dia, pulse, ts});
  BP.sort((a,b)=>a.ts.localeCompare(b.ts));
  bpMsg=''; render();
}
function bpDelete(id){
  const i=BP.findIndex(r=>r.id===id); if(i<0) return;
  const r=BP[i];
  deleteWithUndo(r.sys+'/'+r.dia, ()=>BP.splice(i,1), ()=>BP.splice(i,0,r));
}
let bpMsg='';

/* ---------- ACTIVITY (ROADMAP.md 5.3) ----------
   Steps and workout minutes from metrics, read into METRICS by
   cloudFetchMetrics(). Signed out, METRICS is always {} (never persisted
   to DB_KEY — see its declaration), so this whole section renders nothing,
   same as if it did not exist. */
const ACTIVITY_METRICS=[
  {key:'steps', label:'steps', color:'var(--clay)', get:activityStepsFor},
  {key:'mins',  label:'workout min', color:'var(--frost)', get:d=>activityMinutesFor(d)},
];
// The canonical 30-calendar-day range, today last — NOT Object.keys(METRICS).
// A day METRICS has no entry for still needs its own slot here, both so the
// chart leaves a visible gap at the right date instead of silently
// shrinking to fewer columns, and so tapping that gap can still select it
// (activityDataFor() returning null is exactly the "no data" case below).
function activityDayRange(){
  const out=[];
  for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(key(d)); }
  return out;
}
function pickActivityDay(day){ actSelectedDay=day; render(); }
// Trailing 7 days strictly before `day` (not including it) — comparing a
// day against a baseline that already contains itself would flatter or
// punish it depending on which way it moved.
function activityTrailingAvg(days,day,get){
  const idx=days.indexOf(day);
  if(idx<0) return null;
  const window=days.slice(Math.max(0,idx-7),idx);
  const vals=window.map(d=>{ const e=activityDataFor(d); return e?get(e.data):null; }).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((s,v)=>s+v,0)/vals.length;
}
function activityDeltaHTML(val,avg){
  if(val==null||avg==null||avg===0) return '';
  const pct=(val-avg)/avg*100;
  const up=pct>=0;
  return `<div class="md-delta" style="color:${up?'var(--moss)':'var(--amber)'}">${up?'▲ +':'▼ '}${Math.abs(pct).toFixed(0)}% vs 7-day avg</div>`;
}
function activityFmtDay(d){
  const [y,m,dd]=d.split('-').map(Number);
  return new Date(y,m-1,dd).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function activityBarChartSVG(days,metric){
  const W=320,H=132,PL=6,PR=6,PT=8,PB=20;
  const PW=W-PL-PR, PH=H-PT-PB;
  const n=days.length, gap=1.5;
  const bw=Math.max(1,(PW-gap*(n-1))/n);
  const vals=days.map(d=>{ const e=activityDataFor(d); return e?metric.get(e.data):null; });
  const numeric=vals.filter(v=>v!=null);
  const maxV=numeric.length?Math.max(...numeric,1):1;
  const avg=numeric.length?numeric.reduce((s,v)=>s+v,0)/numeric.length:null;
  const yOf=v=>PT+PH-(v/maxV)*PH;
  const bars=days.map((d,i)=>{
    const v=vals[i]; if(v==null) return '';   // no bar for a missing day — a gap, not a zero
    const x=PL+i*(bw+gap), y=yOf(v), h=Math.max(0,PT+PH-y);
    const selected=d===actSelectedDay;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
      fill="${metric.color}" opacity="${selected?1:0.7}"/>`;
  }).join('');
  const hits=days.map((d,i)=>{
    const x=PL+i*(bw+gap);
    return `<rect x="${x.toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${PH}"
      fill="transparent" style="cursor:pointer" onclick="pickActivityDay('${d}')"/>`;
  }).join('');
  const avgLine=avg!=null?`<line x1="${PL}" y1="${yOf(avg).toFixed(1)}" x2="${W-PR}" y2="${yOf(avg).toFixed(1)}"
    stroke="${metric.color}" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`:'';
  return `<div class="md-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(metric.label)}, last 30 days">
    ${avgLine}${bars}${hits}
    <text x="${PL}" y="${H-6}" fill="var(--faint)" font-size="9" font-family="var(--mono)">${esc(activityFmtDay(days[0]))}</text>
    <text x="${W-PR}" y="${H-6}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="var(--mono)">${esc(activityFmtDay(days[days.length-1]))}</text>
  </svg></div>`;
}
function activityFreshnessHTML(){
  const newest=metricsFreshness();
  if(!newest) return '';
  const d=new Date(newest);
  const hoursAgo=(Date.now()-d.getTime())/3600000;
  if(hoursAgo>36){
    const days=Math.floor(hoursAgo/24);
    return `<span style="color:var(--amber)">Last sync ${days<1?'today':days+' day'+(days===1?'':'s')+' ago'}</span>`;
  }
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return `<span style="color:var(--faint)">Synced ${hh}:${mm}</span>`;
}
// Shared with the Whoop card below via actSelectedDay: picking a day in
// either card's chart or nav arrows moves both, so activity and recovery
// for the same day sit side by side rather than needing two selections.
function activityShiftDay(delta){
  const days=activityDayRange();
  const todayKey=key(new Date());
  const cur=actSelectedDay&&days.includes(actSelectedDay)?actSelectedDay:todayKey;
  const newIdx=days.indexOf(cur)+delta;
  if(newIdx<0||newIdx>=days.length) return;
  actSelectedDay=days[newIdx];
  render();
}
function activitySectionHTML(){
  if(!cloudSession) return '';   // cloud-only by nature
  if(!Object.keys(METRICS).length) return '';   // nothing has ever synced
  const days=activityDayRange();
  const todayKey=key(new Date());
  const selDay=actSelectedDay&&days.includes(actSelectedDay)?actSelectedDay:todayKey;
  const entry=activityDataFor(selDay);

  const stats=ACTIVITY_METRICS.map(m=>{
    const val=entry?m.get(entry.data):null;
    const avg=activityTrailingAvg(days,selDay,m.get);
    return `<div class="act-stat">
      <div class="md-val">${val!=null?val.toLocaleString('en-GB'):'—'}</div>
      <div class="md-unit">${esc(m.label)}</div>
      ${activityDeltaHTML(val,avg)}
    </div>`;
  }).join('');

  const charts=ACTIVITY_METRICS.map(m=>activityBarChartSVG(days,m)).join('');
  const atStart=days.indexOf(selDay)<=0, atEnd=selDay===todayKey;

  return `<div class="gcard">
    <div class="gtop"><span class="gtitle">Apple Health</span>${activityFreshnessHTML()}</div>
    <div class="gsub" style="display:flex;align-items:center;gap:8px">
      <button class="ico edit" style="width:26px;height:26px;flex-shrink:0" ${atStart?'disabled':''}
        onclick="activityShiftDay(-1)" title="Previous day">‹</button>
      <span style="flex:1;text-align:center">${esc(activityFmtDay(selDay))}${selDay===todayKey?' · today':''}</span>
      <button class="ico edit" style="width:26px;height:26px;flex-shrink:0" ${atEnd?'disabled':''}
        onclick="activityShiftDay(1)" title="Next day">›</button>
    </div>
    <div class="act-stats">${stats}</div>
    ${charts}
  </div>`;
}

/* ---------- WHOOP (ROADMAP.md 5.3) ----------
   Recovery/sleep as rings, strain as a plain number (it has no "good"
   direction the way a percentage does), 30-day trend bars reusing
   activityBarChartSVG — it already reads via activityDataFor(), which
   merges every source's fields for a day, so it works unchanged for
   Whoop's field names too. whoop_tokens itself is never queried for
   access_token/refresh_token here — connection status only, per that
   table's comment in zeus-schema.sql. */
let whoopStatus=null, whoopStatusLoaded=false, whoopStatusLoading=false;
let whoopSyncing=false, whoopMsg='';
const WHOOP_METRICS=[
  {key:'recovery', label:'recovery %', color:'var(--moss)', get:d=>d.recovery_score},
  {key:'strain',   label:'strain',     color:'var(--frost)', get:d=>d.strain},
  {key:'sleep',    label:'sleep %',    color:'var(--amber)', get:d=>d.sleep_performance_percentage},
];
function recoveryColor(pct){ return pct>=67?'var(--moss)':pct>=34?'var(--amber)':'var(--rose)'; }
function sleepColor(pct){ return pct>=85?'var(--moss)':pct>=60?'var(--amber)':'var(--rose)'; }
// A plain outline + "—" when pct is null — a real 0% ring would read as
// a genuine zero score, which "no data yet" is not the same thing as.
// `pct` always drives how much of the ring is filled (0-100); `label`
// overrides what's drawn in the middle for rings that aren't percentages
// themselves — strain's ring fills by strain/21 (Whoop's own scale) but
// shows the raw strain number, not that fill percentage.
function ringSVG(pct,color,size,strokeWidth,label){
  size=size||96; strokeWidth=strokeWidth||10;
  const r=(size-strokeWidth)/2, c=2*Math.PI*r;
  if(pct==null){
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${strokeWidth}"/>
      <text x="${size/2}" y="${size/2+8}" text-anchor="middle" fill="var(--faint)" font-family="var(--mono)"
        font-size="${Math.round(size*.22)}" font-weight="700">—</text>
    </svg>`;
  }
  const clamped=Math.max(0,Math.min(100,pct)), dash=(clamped/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${strokeWidth}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"
      stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+8}" text-anchor="middle" fill="var(--ink)" font-family="var(--mono)"
      font-size="${Math.round(size*.22)}" font-weight="700">${label!=null?label:Math.round(clamped)+'%'}</text>
  </svg>`;
}
async function loadWhoopStatus(){
  if(!cloudSession) { whoopStatus=null; return; }
  try{
    const sb=await getSbClient();
    const {data,error}=await sb.from('whoop_tokens')
      .select('connected_at,last_sync,whoop_user_id').eq('user_id',cloudSession.user.id).maybeSingle();
    if(error) throw error;
    whoopStatus=data||null;
  }catch(e){
    whoopMsg=e.message||whoopMsg;
  }
}
async function whoopConnect(){
  if(!cloudSession) return;
  const sb=await getSbClient();
  const {data}=await sb.auth.getSession();
  if(!data.session) return;
  window.location.href=SUPABASE_URL+'/functions/v1/whoop-auth?start=1&access_token='
    +encodeURIComponent(data.session.access_token);
}
async function whoopSyncNow(){
  if(!cloudSession||whoopSyncing) return;
  whoopSyncing=true; whoopMsg=''; render();
  try{
    const sb=await getSbClient();
    const {data,error}=await sb.functions.invoke('whoop-sync',{method:'POST'});
    if(error) throw error;
    if(data&&data.ok===false) throw new Error(data.error||'Sync failed.');
    await loadWhoopStatus();
    await cloudFetchMetrics(sb);
  }catch(e){
    whoopMsg=e.message||'Could not sync Whoop.';
  }
  whoopSyncing=false; render();
}
function whoopFreshnessHTML(){
  if(!whoopStatus) return '';
  if(!whoopStatus.last_sync) return `<span style="color:var(--amber)">Never synced</span>`;
  const d=new Date(whoopStatus.last_sync);
  const hoursAgo=(Date.now()-d.getTime())/3600000;
  if(hoursAgo>36){
    const days=Math.floor(hoursAgo/24);
    return `<span style="color:var(--amber)">Last sync ${days<1?'today':days+' day'+(days===1?'':'s')+' ago'}</span>`;
  }
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return `<span style="color:var(--faint)">Synced ${hh}:${mm}</span>`;
}

// Dashboard only — connecting lives in Settings now (whoopConnectCardHTML
// above). Nothing to show here until whoopStatus confirms a connection.
function whoopSectionHTML(){
  if(!cloudSession) return '';
  if(!whoopStatusLoaded&&!whoopStatusLoading){
    whoopStatusLoading=true;
    loadWhoopStatus().then(()=>{ whoopStatusLoading=false; whoopStatusLoaded=true; render(); });
  }
  if(!whoopStatusLoaded||!whoopStatus) return '';

  const days=activityDayRange();
  const todayKey=key(new Date());
  const selDay=actSelectedDay&&days.includes(actSelectedDay)?actSelectedDay:todayKey;
  const entry=activityDataFor(selDay);
  const d=entry?entry.data:{};
  const recovery=d.recovery_score, sleep=d.sleep_performance_percentage, strain=d.strain;

  // Whoop's own strain scale tops out at 21 (not 0-100), so the ring fills
  // by strain/21 but the label in the middle stays the raw strain number,
  // same as the Whoop app — not the fill percentage.
  const strainPct = strain!=null ? Math.min(100,(strain/21)*100) : null;
  // Sized (and the container gap tightened) so all three fit on one row
  // even at a narrow phone width — at the default 96px ring size, three
  // rings plus the old 22px gaps ran past a 375px screen's content width
  // and wrapped the third ring onto its own line.
  const RS=76, RSW=8;
  const rings=`<div class="whoop-rings">
    <div class="whoop-ring-tile">
      ${ringSVG(sleep,sleep!=null?sleepColor(sleep):null,RS,RSW)}
      <div class="whoop-ring-label">Sleep</div>
    </div>
    <div class="whoop-ring-tile">
      ${ringSVG(recovery,recovery!=null?recoveryColor(recovery):null,RS,RSW)}
      <div class="whoop-ring-label">Recovery</div>
    </div>
    <div class="whoop-ring-tile">
      ${ringSVG(strainPct,'var(--frost)',RS,RSW,strain!=null?strain.toFixed(1):null)}
      <div class="whoop-ring-label">Strain</div>
    </div>
  </div>`;

  const charts=WHOOP_METRICS.map(m=>
    `<div class="gsub" style="margin:14px 0 2px">${esc(m.label)} · 30 days</div>${activityBarChartSVG(days,m)}`
  ).join('');
  const atStart=days.indexOf(selDay)<=0, atEnd=selDay===todayKey;

  return `<div class="gcard">
    <div class="gtop"><span class="gtitle">Whoop</span>${whoopFreshnessHTML()}</div>
    <div class="gsub" style="display:flex;align-items:center;gap:8px">
      <button class="ico edit" style="width:26px;height:26px;flex-shrink:0" ${atStart?'disabled':''}
        onclick="activityShiftDay(-1)" title="Previous day">‹</button>
      <span style="flex:1;text-align:center">${esc(activityFmtDay(selDay))}${selDay===todayKey?' · today':''}</span>
      <button class="ico edit" style="width:26px;height:26px;flex-shrink:0" ${atEnd?'disabled':''}
        onclick="activityShiftDay(1)" title="Next day">›</button>
    </div>
    ${rings}
    ${whoopMsg?`<div class="gsub" style="color:var(--rose)">${esc(whoopMsg)}</div>`:''}
    <div class="backup-row" style="margin-top:2px">
      <button class="opt-pill" ${whoopSyncing?'disabled':''} onclick="whoopSyncNow()">${whoopSyncing?'Syncing…':'Sync now'}</button>
    </div>
    ${charts}
  </div>`;
}

      <span class="bp-sep">/</span>

// datetime-local wants local wall time, not UTC — toISOString() would shift it.
function bpNowLocal(){
  const d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}

/* Per-reading summaries for the chart currently on screen, same idea as
   mdPoints for the marker chart. */
let bpPoints=[];

const bpSigned=n=>(n>0?'+':n<0?'\u2212':'')+Math.abs(n);

function pickBpPoint(i){
  const p=bpPoints[i], box=document.getElementById('bpPoint');
  if(!p||!box) return;
  box.innerHTML=`<b>${esc(p.date)}</b> · ${p.sys}/${p.dia}`
    +` · <span class="bp-band ${p.cls}">${esc(p.label)}</span>`
    +(p.pulse?`<br><span class="md-sub">Pulse ${p.pulse}</span>`:'')
    +(p.chg?`<br><span class="md-sub">${esc(p.chg)}</span>`:'');
  // Both dots of the selected reading grow, not just one — a reading is the
  // pair, and highlighting half of it reads as picking systolic alone.
  document.querySelectorAll('.bp-dot').forEach(el=>
    el.setAttribute('r', Number(el.dataset.i)===i ? '6' : '3.5'));
  const g=document.getElementById('bpGuide');
  if(g){ g.setAttribute('x1',p.x); g.setAttribute('x2',p.x); g.style.display=''; }
}

/* Timeline of every reading: systolic and diastolic as two lines against a
   shared scale, with the normal band shaded behind them. Tapping anywhere in
   a reading's column selects it. */
function bpChartHTML(){
  const W=320,H=170,PL=34,PR=10,PT=12,PB=26;
  const PW=W-PL-PR, PH=H-PT-PB;
  const ts=BP.map(r=>new Date(r.ts).getTime());
  const lo=Math.min(50,...BP.map(r=>r.dia))-8, hi=Math.max(150,...BP.map(r=>r.sys))+8;
  const t0=ts[0], t1=ts[ts.length-1];
  const xOf=t=>PL+(t1===t0?PW/2:(t-t0)/(t1-t0)*PW);
  const yOf=v=>PT+PH-((v-lo)/(hi-lo))*PH;
  const line=key=>BP.map((r,i)=>(i?'L':'M')+xOf(ts[i]).toFixed(1)+' '+yOf(r[key]).toFixed(1)).join(' ');
  const dots=key=>BP.map((r,i)=>
    `<circle class="bp-dot" data-i="${i}" cx="${xOf(ts[i]).toFixed(1)}"
      cy="${yOf(r[key]).toFixed(1)}" r="3.5"
      fill="${key==='sys'?'var(--frost)':'var(--moss)'}"/>`).join('');

  bpPoints=BP.map((r,i)=>{
    const b=bpBand(r), prev=i?BP[i-1]:null;
    return {
      date:bpWhen(r.ts), sys:r.sys, dia:r.dia, pulse:r.pulse||0,
      cls:b.cls, label:b.label, x:xOf(ts[i]).toFixed(1),
      chg: prev ? bpSigned(r.sys-prev.sys)+'/'+bpSigned(r.dia-prev.dia)
                  +' since '+bpWhen(prev.ts) : ''
    };
  });
  // The tap target is the whole COLUMN, not the dots: systolic and diastolic
  // are one reading taken at one moment, so the column is the thing you mean
  // to select — and it gives a target the width of the gap between readings
  // instead of a 3.5px dot. Edges extend to the halfway point either side.
  const hits=BP.map((r,i)=>{
    const x=Number(xOf(ts[i]));
    const lft=i?  (x+Number(xOf(ts[i-1])))/2 : PL;
    const rgt=i<BP.length-1 ? (x+Number(xOf(ts[i+1])))/2 : W-PR;
    return `<rect x="${lft.toFixed(1)}" y="${PT}" width="${Math.max(1,rgt-lft).toFixed(1)}"
      height="${PH}" fill="transparent" style="cursor:pointer"
      onclick="pickBpPoint(${i})"/>`;
  }).join('');
  const yTicks=[60,90,120,150].filter(v=>v>lo&&v<hi).map(v=>
    `<line x1="${PL}" y1="${yOf(v).toFixed(1)}" x2="${W-PR}" y2="${yOf(v).toFixed(1)}"
       stroke="var(--line)" stroke-width="1"/>
     <text x="${PL-6}" y="${(yOf(v)+3).toFixed(1)}" text-anchor="end" fill="var(--faint)"
       font-size="9" font-family="var(--mono)">${v}</text>`).join('');
  // Normal zone: 90-120 systolic over 60-80 diastolic, shaded as one band.
  const band=`<rect x="${PL}" y="${yOf(120).toFixed(1)}" width="${PW}"
    height="${Math.max(0,yOf(60)-yOf(120)).toFixed(1)}" fill="var(--moss)" opacity=".07"/>`;
  const first=new Date(BP[0].ts), last=new Date(BP[BP.length-1].ts);
  const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return `<div class="md-chart"><svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Blood pressure over time">
    ${band}${yTicks}
    <line id="bpGuide" y1="${PT}" y2="${PT+PH}" stroke="var(--frost)"
      stroke-width="1" stroke-dasharray="2 3" opacity=".55" style="display:none"/>
    <path d="${line('sys')}" fill="none" stroke="var(--frost)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('dia')}" fill="none" stroke="var(--moss)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${dots('sys')}${dots('dia')}${hits}
    <text x="${PL}" y="${H-8}" fill="var(--faint)" font-size="9"
      font-family="var(--mono)">${esc(fmt(first))}</text>
    ${BP.length>1?`<text x="${W-PR}" y="${H-8}" text-anchor="end" fill="var(--faint)"
      font-size="9" font-family="var(--mono)">${esc(fmt(last))}</text>`:''}
  </svg></div>`;
}

function bpDetailHTML(){
  const rows=[...BP].reverse().map(r=>{
    const b=bpBand(r);
    return `<div class="md-row">
      <span class="md-date">${esc(bpWhen(r.ts))}</span>
      <span class="md-reading">${r.sys}/${r.dia}${r.pulse?` <span class="md-sub">· ${r.pulse}</span>`:''}</span>
      <span class="bp-band ${b.cls}">${b.label}</span>
      <button class="ico del" style="margin-left:8px" onclick="bpDelete('${r.id}')"
        aria-label="Delete reading">✕</button>
    </div>`;
  }).join('');
  const avgOf=k=>Math.round(BP.reduce((s,r)=>s+r[k],0)/BP.length);
  return `<button class="md-back" onclick="closeSheet()">‹ Back</button>
    <div class="md-name">Blood pressure</div>
    <div class="md-meta">${BP.length} reading${BP.length===1?'':'s'} · average ${avgOf('sys')}/${avgOf('dia')}</div>
    ${bpChartHTML()}
    <div class="bp-legend">
      <span><i style="background:var(--frost)"></i>Systolic</span>
      <span><i style="background:var(--moss)"></i>Diastolic</span>
    </div>
    <div class="md-point" id="bpPoint">Tap a point on the chart for details.</div>
    <div class="md-sec">All readings</div>
    ${rows}`;
}

/* Collapse header, same pattern and chrome as the calendar tab's
   "Data & backup" card. The flag name is passed as a string because inline
   handlers resolve against global scope, which for a classic script includes
   top-level let bindings — the existing calDataOpen card relies on the same. */
function bioFold(title,open,flag){
  return open
    ? `<div class="gcard" style="margin-bottom:8px"><div class="gtop">

    : `<div class="gcard cal-collapsed" onclick="${flag}=true;render()"><div class="gtop">
         <span class="gtitle">${esc(title)}</span>
         <span class="cal-collapsed-meta">›</span>
       </div></div>`;
}

function renderBio(c){
  /* Blood pressure carries id="scrollAnchor", and scrollToAnchor() puts it
     just under the header on open, so the tab lands there and the upload
     fold is a scroll up away rather than something to scroll past every
     time. */
  c.insertAdjacentHTML('beforeend', bioFold('Upload biomarkers',bioUploadOpen,'bioUploadOpen'));
  if(bioUploadOpen) c.insertAdjacentHTML('beforeend',
    `<div class="upload-zone" style="margin-top:0">
      <p>Pick a blood test <strong>PDF</strong>. Values are read out and compared with your previous panel.</p>
      <button class="import-btn" ${bioBusy?'disabled':''} onclick="document.getElementById('pdfInput').click()">
        ${bioBusy?'Reading…':'Choose PDF'}</button>
      ${bioMsg?`<div class="import-status">${esc(bioMsg)}</div>`:''}
    </div>`);

  c.insertAdjacentHTML('beforeend', bpSectionHTML());

  if(!PANELS.length){
    c.insertAdjacentHTML('beforeend','<div class="empty">No blood panels yet.<br>Upload one to start tracking.</div>');
    c.querySelectorAll('[data-bio]').forEach(b=>b.onclick=()=>{ bioNote=bioNote===b.dataset.bio?'':b.dataset.bio; render(); });
    return;
  }

  // PANELS is sorted by date, so the default pair is the newest panel and the
  // one before it — importing an older report later never shifts this.
  const hasHistory=PANELS.length>1;
  const cur=(cmpA&&PANELS.find(p=>p.id===cmpA))||PANELS[PANELS.length-1];
  const prev=hasHistory?((cmpB&&PANELS.find(p=>p.id===cmpB))||PANELS[PANELS.length-2]):null;

  if(hasHistory){
    const opts=selId=>PANELS.slice().reverse().map(p=>
      `<option value="${p.id}"${p.id===selId?' selected':''}>${esc(p.date)}${p.label?' · '+esc(p.label):''}</option>`).join('');
    c.insertAdjacentHTML('beforeend',
      `<div class="compare-row">
        <span class="compare-lbl">Compare</span>
        <select class="compare-sel" onchange="setCompare('a',this.value)">${opts(cur.id)}</select>
        <span class="compare-lbl">against</span>
        <select class="compare-sel" onchange="setCompare('b',this.value)">${opts(prev.id)}</select>
      </div>`);
  } else {
    c.insertAdjacentHTML('beforeend',
      `<div class="day-sep">Panel · ${esc(cur.date)} · no earlier panel to compare</div>`);
  }

  let lastSection=null;
  cur.values.forEach(v=>{
    if(v.section!==lastSection){
      lastSection=v.section;
      c.insertAdjacentHTML('beforeend',`<div class="day-sep">${esc(v.section||'Other')}</div>`);
    }
    const pv=prev?prev.values.find(x=>x.key===v.key):null;
    let statusHTML='', delta='<span class="flat">—</span>';
    if(v.text!=null){
      statusHTML=`<div class="mk-sub">${esc(v.text)}</div>`;
    } else {
      if(pv&&pv.text==null&&pv.v!=null){
        const d=v.v-pv.v;
        const cls=Math.abs(d)<1e-9?'flat':(d>0?'up':'down');
        const arrow=Math.abs(d)<1e-9?'':(d>0?'▲':'▼');
        const dv=Math.abs(d)>=10?d.toFixed(0):d.toFixed(1);
        delta=`<span class="${cls}">${arrow} ${d>0?'+':''}${dv}</span>`;
      }
      let rangeLbl='', inR=null;
      if(v.refLo!=null&&v.refHi!=null){ rangeLbl=v.refLo+'–'+v.refHi; inR=v.v>=v.refLo&&v.v<=v.refHi; }
      else if(v.refHi!=null){ rangeLbl='< '+v.refHi; inR=v.v<=v.refHi; }
      else if(v.refLo!=null){ rangeLbl='> '+v.refLo; inR=v.v>=v.refLo; }
      if(rangeLbl) statusHTML=`<div class="mk-sub ${inR?'inrange':'outrange'}">${inR?'in range':'outside range'} · ${esc(rangeLbl)}${v.unit?' '+esc(v.unit):''}</div>`;
    }
    const valTxt=v.text!=null?esc(v.text):esc(v.qual||'')+v.v;
    c.insertAdjacentHTML('beforeend',
      `<div class="mk" data-mk="${v.key}">
        <div class="mk-name">${esc(v.displayName)}
          ${statusHTML}
        </div>
        <span class="mk-val">${valTxt}${v.text==null&&v.unit?`<small>${esc(v.unit)}</small>`:''}</span>
        <span class="mk-delta">${v.text!=null?'':delta}</span>
      </div>`);
  });

  c.insertAdjacentHTML('beforeend','<div class="day-sep">Panel history</div>');
  PANELS.slice().reverse().forEach(p=>{
    c.insertAdjacentHTML('beforeend',
      `<div class="panel-row">
        <div class="panel-date">${esc(p.date)}<div class="panel-meta">${p.label?esc(p.label)+' · ':''}${esc(p.name)} · ${p.values.length} values</div></div>
        <div class="acts">
          <button class="ico edit" data-pedit="${p.id}">✎</button>
          <button class="ico del" data-pdel="${p.id}">✕</button>
        </div>
      </div>`);
  });

  c.querySelectorAll('[data-bio]').forEach(b=>b.onclick=()=>{ bioNote=bioNote===b.dataset.bio?'':b.dataset.bio; render(); });
  c.querySelectorAll('[data-mk]').forEach(x=>x.onclick=()=>openMarkerDetail(x.dataset.mk));
  c.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>openPanelSheet(b.dataset.pedit));
  c.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
    const i=PANELS.findIndex(p=>p.id===b.dataset.pdel);
    if(i>-1&&confirm('Delete the panel from '+PANELS[i].date+'?')){
      PANELS.splice(i,1); resetCompare(); render();
    }
  });
}

function renderProgress(){
  // Skipping the computation on cal/bio used to be harmless because #pct/#bar
  // sit inside a display:none progWrap on those tabs. At desktop progWrap
  // stays visible in the right rail, so the number now has to stay correct
  // there too — the early return only ever mattered while the block was hidden.
  if((activeTab==='cal'||activeTab==='bio') && !isDesktopLayout()) return;
  let total,done;
  const mr=marks(state), ms=marks(suppState);
  if(activeTab==='routine'){ const v=activeRoutinesOn(viewDate); total=v.length; done=v.filter(r=>mr[r.id]).length; }
  else if(activeTab==='supps'){ const v=allSupps(); total=v.length; done=v.filter(s=>ms[s.id]).length; }
  else { const vr=activeRoutinesOn(viewDate), vs=allSupps();
    total=vr.length+vs.length; done=vr.filter(r=>mr[r.id]).length+vs.filter(s=>ms[s.id]).length; }
  const pct=total?Math.round(done/total*100):0;
  const bar=document.getElementById('bar'), pctEl=document.getElementById('pct');
  bar.style.width=pct+'%';
  pctEl.textContent=pct+'%';
  // Colour reports the SYSTEMS state, not this number. The two say different
  // things on purpose: the bar's length is how much of the day is ticked off,
  // its colour is whether anything anywhere needs attention — so a full bar
  // can still read amber with, say, a blood panel overdue. Same rule as the
  // SYSTEMS dot, via systemsWorst(), so they can never disagree.
  //
  // Integrations is excluded here specifically: a Whoop recovery score is
  // not something achieved or missed today the way a routine or an overdue
  // panel is, so it should not tint the ONE number that measures completion.
  // It still shows its own colour on its own SYSTEMS row and Nexus node.
  const worst=systemsWorst(systemsReport().filter(r=>r.key!=='integrations'));
  ['watch','warn'].forEach(c=>{ bar.classList.toggle(c,worst===c); pctEl.classList.toggle(c,worst===c); });
}

/* Shared notes + checklist renderer, used by both the task detail view and
   the event sheet. Kept in one place deliberately: two copies of the drag,
   sink-on-done and add-row behaviour would drift apart.
   `owner` is the object holding the data; `field` names its array. */
function renderChecklist(box,owner,field,onChange){
  if(!box||!owner) return;
  const list=owner[field]||(owner[field]=[]);
  const commit=()=>{ (onChange||saveAll)(); renderChecklist(box,owner,field,onChange); };

  box.innerHTML=list.map(s=>`
    <div class="sub-item${s.done?' done':''}" data-item="${s.id}">
      <button class="sub-check ${s.done?'on':''}" data-ck="${s.id}"></button>
      <input class="sub-input" value="${esc(s.title)}" data-cktitle="${s.id}" placeholder="Item">
      <button class="drag-handle" data-drag title="Reorder" aria-label="Reorder">⋮⋮</button>
      <button class="sub-del" data-ckdel="${s.id}">✕</button>
    </div>`).join('')
    +`<div class="sub-item">
        <button class="sub-check" style="visibility:hidden"></button>
        <input class="sub-input cl-add" placeholder="Add item">
      </div>`;

  box.querySelectorAll('[data-ck]').forEach(el=>el.onclick=()=>{
    const s=list.find(x=>x.id===el.dataset.ck); if(!s) return;
    s.done=!s.done;
    sinkDone(owner,field);
    commit();
  });
  box.querySelectorAll('[data-cktitle]').forEach(el=>el.oninput=()=>{
    const s=list.find(x=>x.id===el.dataset.cktitle);
    if(s){ s.title=el.value; (onChange||saveAll)(); }   // no re-render: it would drop the caret
  });
  box.querySelectorAll('[data-ckdel]').forEach(el=>el.onclick=()=>{
    const i=list.findIndex(x=>x.id===el.dataset.ckdel); if(i<0) return;
    const s=list[i];
    deleteWithUndo(s.title||'Item',
      ()=>{ list.splice(i,1); commit(); },
      ()=>{ list.splice(i,0,s); commit(); });
  });

  const add=box.querySelector('.cl-add');
  if(add) add.onkeydown=e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const v=add.value.trim(); if(!v) return;
    list.push({id:'s'+Date.now()+Math.floor(Math.random()*1000),title:v,done:false});
    sinkDone(owner,field);
    commit();
    const nxt=box.querySelector('.cl-add'); if(nxt) nxt.focus();   // keep typing
  };

  makeReorderable(box,ids=>{
    const map={}; list.forEach(s=>map[s.id]=s);
    owner[field]=ids.map(id=>map[id]).filter(Boolean);
    commit();
  });
}
function sinkDone(owner,field){
  const l=owner[field]||[];
  owner[field]=[...l.filter(s=>!s.done),...l.filter(s=>s.done)];
}

// Binds an auto-growing notes textarea to owner[field].
function bindNotes(el,owner,field,onChange){
  if(!el||!owner) return;
  el.value=owner[field]||'';
  const grow=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; };
  el.oninput=()=>{ owner[field]=el.value; grow(); (onChange||saveAll)(); };
  setTimeout(grow,0);
}

/* ---------- INLINE DESCRIPTIONS ----------
   A row with notes or checklist items shows a one-line preview; tapping it
   expands the full text and lets the items be ticked without opening the
   edit sheet. Open rows are tracked by reference so the state survives the
   re-render that ticking triggers. */
let descOpen=new Set();

const hasDesc=o=>!!(o&&((o.notes&&o.notes.trim())||(o.checklist&&o.checklist.length)));
function descPreview(o){
  const t=String(o.notes||'').trim().replace(/\s+/g,' ');
  if(t) return t.length>62?t.slice(0,62)+'…':t;
  return (o.checklist||[]).length+' item'+((o.checklist||[]).length===1?'':'s');
}
// ref addresses the owner across renders: r:<id> or s:<blockId>:<itemId>
function descOwner(ref){
  const p=String(ref).split(':');
  if(p[0]==='r') return ROUTINES.find(x=>x.id===p[1]);
  if(p[0]==='s'){ const b=SUPP_BLOCKS.find(x=>x.id===p[1]); return b&&b.items.find(i=>i.id===p[2]); }
  return null;
}
function descPeekHTML(o,ref){
  if(!hasDesc(o)) return '';
  const open=descOpen.has(ref);
  return `<div class="desc-peek" data-desc="${ref}">
    <span class="desc-caret">${open?'▾':'▸'}</span>
    <span class="desc-text">${esc(descPreview(o))}</span>${countLabel(o.checklist)}</div>`;
}
function descPanelHTML(o,ref){
  if(!hasDesc(o)||!descOpen.has(ref)) return '';
  const notes=String(o.notes||'').trim();
  const items=(o.checklist||[]).map(c=>
    `<div class="desc-item${c.done?' done':''}">
      <button class="sub-check ${c.done?'on':''}" data-dck="${ref}" data-dckid="${c.id}"></button>
      <span>${esc(c.title)}</span>
    </div>`).join('');
  return `<div class="desc-panel">${notes?`<div class="desc-notes">${esc(notes)}</div>`:''}${items}</div>`;
}
function bindDescRows(c){
  c.querySelectorAll('[data-desc]').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const ref=el.dataset.desc;
    descOpen.has(ref)?descOpen.delete(ref):descOpen.add(ref);
    render();
  });
  c.querySelectorAll('[data-dck]').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const o=descOwner(el.dataset.dck); if(!o) return;
    const item=(o.checklist||[]).find(x=>x.id===el.dataset.dckid); if(!item) return;
    item.done=!item.done;
    render();
  });
}

const countLabel=(list)=>{
  const n=(list||[]).length;
  return n?`<span class="sub-count">${list.filter(s=>s.done).length}/${n}</span>`:'';
};

function openSheet(kind,ref){
  if(activeTab==='tasks'){ kind==='edit'?openTaskDetail(ref):newTaskAndOpen(); return; }
  showSheetChrome(true);
  sheetType=sheetTypeFor(kind,ref);
  editing=kind==='edit'?ref:null;

  document.getElementById('panelFields').style.display='none';
  document.getElementById('eatFields').style.display='none';
  document.getElementById('taskFields').style.display='none';
  document.getElementById('f-name-field').style.display='block';
  document.getElementById('f-name-label').textContent='Name';
  document.getElementById('deleteBtn').style.display=kind==='edit'?'block':'none';
  document.getElementById('saveBtn').textContent=kind==='edit'?'Save':'Add';

  document.getElementById('sheetHint').textContent =
    kind==='edit' ? 'Change any detail below.'
    : sheetType==='event' ? 'A one-off entry for a single day.'
    : sheetType==='supp' ? 'Add a supplement to a time block.'
    : 'Optional ones stay greyed out until you switch them on for a day.';

  if(sheetType==='routine'){
    const r=editing?ROUTINES.find(x=>x.id===editing):null;
    document.getElementById('f-name').value=r?r.title:'';
    document.getElementById('f-time').value=r?r.time:'08:00';
    document.getElementById('f-dur').value=r?r.dur:15;
    document.getElementById('f-cat').value=r?r.cat:'health';
    document.getElementById('f-date').value=r&&r.date?r.date:dk();
    setKind(r?!!r.optional:false);
    if(r&&r.date){ setMode('once'); selDows=[0,1,2,3,4,5,6]; }
    else { setMode('repeat'); selDows=r&&r.days?[...r.days]:[0,1,2,3,4,5,6]; }
    renderDows();
    initDescDraft(r);
  } else if(sheetType==='event'){
    const r=editing?ROUTINES.find(x=>x.id===editing):null;
    document.getElementById('f-name').value=r?r.title:'';
    // Only roll the date forward when adding onto today; while looking at
    // another day the user means that day, and "next hour from now" would
    // drag them back to the present.
    const nf=nextFullHour(), rollDate=!r && sameDay(viewDate,new Date());
    document.getElementById('e-date').value=(r&&r.date)?r.date:(rollDate?key(nf):dk());
    document.getElementById('e-time').value=r?r.time:hhmm(nf);
    document.getElementById('e-dur').value=r?r.dur:60;
    if(r && !r.date){ eSelDows=r.days?[...r.days]:[1,2,3,4,5,6,0]; setEMode('repeat'); }
    else { eSelDows=[1,2,3,4,5,6,0]; setEMode('once'); }
    renderEDows();
    initDescDraft(r);
  } else {
    const sel=document.getElementById('f-block');
    sel.innerHTML=SUPP_BLOCKS.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');
    if(editing){
      const [bid,iid]=editing.split(':');
      const it=SUPP_BLOCKS.find(b=>b.id===bid).items.find(x=>x.id===iid);
      document.getElementById('f-name').value=it.name;
      document.getElementById('f-sub').value=it.sub==='—'?'':it.sub;
      document.getElementById('f-dose').value=it.dose==='—'?'':it.dose;
      sel.value=bid;
      initDescDraft(it);
    } else {
      ['f-name','f-sub','f-dose'].forEach(i=>document.getElementById(i).value='');
      initDescDraft(null);
    }
  }
  document.getElementById('overlay').classList.add('open');
