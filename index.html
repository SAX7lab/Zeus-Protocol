<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Zoom is switched off deliberately: the layout is already phone-width, and
     a stray pinch or a double-tap on a checkbox would otherwise leave the whole
     page magnified. iOS honours this in a home-screen app; plain Safari ignores
     user-scalable and still allows pinch, which is the accessibility escape hatch. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black", not "black-translucent": translucent makes iOS lay the app out
     underneath the status bar, so the header's top was hidden behind the
     clock. With "black" iOS reserves that strip itself. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="ZEUS">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060b10">
<meta name="supported-color-schemes" content="dark">
<title>ZEUS Protocol</title>
<style>
  /* ---------- MARK II PALETTE ----------
     The Jarvis restyle is mostly colour temperature: the old palette was
     warm (cream ink on green-black, like paper in a dim room), this one is
     cold (blue-white on blue-black, like light with nothing behind it).
     Token names and their jobs are unchanged, so every existing rule keeps
     working — only the values they resolve to moved. Semantics are intact:
     moss still means done, rose still means fasting/overdue.
     --line is the one token that changed *kind* as well as value: it used
     to be neutral grey, it is now faintly cyan, which is what makes plain
     dividers read as HUD rather than as borders. */
  :root {
    color-scheme: dark;
    --bg:#060b10; --surface:#0d1822; --ink:#d6e9f2;
    --muted:rgba(214,233,242,0.62); --faint:rgba(214,233,242,0.34);
    --line:rgba(95,216,245,0.20);
    --frost:#5fd8f5; --frost-soft:rgba(95,216,245,0.16);
    --moss:#4fe6b0; --clay:#ff9a5c; --clay-soft:rgba(255,154,92,0.16);
    --amber:#ffc247; --rose:#ff5f6d; --rose-soft:rgba(255,95,109,0.14);
    /* Edge/accent glow. Never applied to body text — glowing prose is the
       fastest way to make an interface unreadable — and deliberately kept
       off list rows, where a blurred shadow per row costs real paint time
       while scrolling. */
    --glow:0 0 14px rgba(95,216,245,0.34);
    --glow-soft:0 0 10px rgba(95,216,245,0.22);
    /* Corner notch depth for the clip-path HUD bevel. */
    --notch:9px;
    /* Third type role. Georgia carries headings, the system sans carries
       prose, and this carries anything the eye scans down a column. System
       stack only — no web font, the file stays self-contained. */
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }

  /* Data face: every value that has to line up vertically. tabular-nums is
     the point — without it a 1 is narrower than a 7 and columns wander. */
  .pct, .ag-time, .ag-time small, .row-time, .dose, .sub-count, .task-when,
  .streak-pill, .eat-left, .eat-sub, .block-time,
  .mk-val, .mk-val small, .mk-delta, .mk-sub,
  .md-val, .md-unit, .md-delta, .md-date, .md-reading, .md-chg, .md-point,
  .day-hour, .db-time, .cell .num, .wk-daynum, .wk-label,
  .panel-date, .panel-meta, .compare-sel {
    font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* Micro-labels: section headings and tags, unified. */
  .eat-label, .opt-pill, .tag, .day-sep, .seclabel, .md-sec, .eat-sub {
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; }
  .wdays div, .wgrid-head div { font-family:var(--mono); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background-color:#060b10; min-height:100%; }
  html,body { background-color:#060b10; background-color:var(--bg);
    color:#d6e9f2; color:var(--ink); }
  body { min-height:100vh; min-height:100dvh; overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
    /* Kills the double-tap-to-zoom gesture while leaving scrolling alone. The
       drag handles override this with touch-action:none of their own. */
    touch-action:manipulation; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    max-width:640px; margin:0 auto; min-height:100vh; }

  /* The fixed header is out of flow, so body's safe-area padding does not
     apply to it — it carries its own inset. The inset is 0 now that the
     status bar is opaque ("black"); most of the old 40px breathing room
     went to the .crest row, so the header grew only slightly. */
  header { padding:calc(14px + env(safe-area-inset-top)) 20px 0; border-bottom:1px solid var(--line);
    position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:640px;
    background:var(--bg); z-index:10; }

  .crest { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px; }
  .crest .sponsor { height:24px; width:auto; flex-shrink:1; min-width:0; object-fit:contain; }
  .brandrow { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .brandtext { min-width:0; }
  .logo {
    flex-shrink:0; margin-top:2px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:23px; font-weight:700; letter-spacing:.10em;
    color:var(--ink); line-height:1;
    padding:7px 11px 6px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface);
  }
  .eyebrow { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--frost); font-weight:600; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:24px; font-weight:600; line-height:1.25; margin-top:6px; }

  /* .headerctrls wraps the day nav plus the settings button — the button
     is a sibling, not a daynav child, so toggling .daynav's display for
     the chromeless tabs (setTab()) never takes it down with it. That is
     the whole point: Settings must stay reachable no matter which tabs
     or sections are on screen. */
  .headerctrls { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .daynav { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .daynav button { background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:32px; height:32px; border-radius:9px; font-size:15px; flex-shrink:0; }
  .daynav .dlabel { flex:1; font-size:14px; color:var(--muted); }
  .daynav .today-btn { width:auto; padding:0 12px; font-size:12px; font-weight:600; color:var(--frost); }

  /* One status block: the day's percentage and the eating window read
     together, with their two bars stacked directly beneath. */
  .progress-wrap { margin-top:12px; }
  .status-head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:7px; }
  .status-left { display:flex; align-items:baseline; gap:6px; min-width:0; }
  /* Sits under the eating-window bar, so each bar keeps its own caption. */
  .eat-line { margin-top:5px; cursor:pointer; }
  .eat-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .pct { font-size:24px; font-weight:600; color:var(--moss); line-height:1; }
  /* Both carry the SYSTEMS state; .pct's glow is restated because the base
     rule further down hard-codes a green one. */
  .pct.watch { color:var(--amber); text-shadow:0 0 18px rgba(255,194,71,.45); }
  .pct.warn  { color:var(--rose);  text-shadow:0 0 18px rgba(255,95,109,.45); }
  .pct-sub { font-size:12.5px; color:var(--muted); }
  .progress-track { height:6px; background:rgba(214,233,242,.10); border-radius:4px; overflow:hidden;
    margin-bottom:3px; }
  .progress-bar { height:100%; width:0%; background:var(--moss); border-radius:4px;
    transition:width .4s ease, background-color .4s ease; }
  .progress-bar.watch { background:var(--amber); }
  .progress-bar.warn  { background:var(--rose); }

  /* Six tabs no longer fit at a readable size, so the bar scrolls sideways
     rather than shrinking the labels. The fade lives on the wrapper, not the
     scroller, so it stays pinned to the right edge instead of scrolling away. */
  .tabs-wrap { position:relative; margin-top:14px; }
  .tabs-wrap::after { content:''; position:absolute; right:0; top:0; bottom:0; width:34px;
    background:linear-gradient(to right,transparent,var(--bg)); pointer-events:none;
    opacity:1; transition:opacity .2s; }
  .tabs-wrap.at-end::after { opacity:0; }
  .tabs { display:flex; gap:0; width:100%; overflow-x:auto; flex-wrap:nowrap;
    scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; scroll-snap-align:center; padding:13px 14px; font-size:12.5px; font-weight:700;
    background:none; border:none; color:var(--faint); border-bottom:2.5px solid transparent;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.01em; }
  .tab.active { color:var(--ink); border-bottom-color:var(--frost); }
  .tab:not(.active):active { color:var(--muted); }

  .filters { display:flex; gap:8px; padding:14px 20px; overflow-x:auto; }
  .chip { font-size:13px; padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); white-space:nowrap; font-weight:500; }
  .chip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  main { padding:4px 14px 96px; }   /* bottom clears the floating + button */
  .tab-actions { display:flex; gap:8px; flex-wrap:wrap; padding:2px 6px 12px; }
  .task-when { font-size:12.5px; line-height:1.5; color:var(--frost); margin-top:3px; }
  .task-when.overdue { color:var(--rose); }
  .tasks-done-head { cursor:pointer; }
  .tag.task { color:var(--amber); }

  .row { display:flex; align-items:center; gap:11px; padding:13px 6px; border-bottom:1px solid var(--line); }
  .check { flex-shrink:0; width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(214,233,242,.35); display:grid; place-items:center; transition:all .2s; }
  .check.on { background:var(--moss); border-color:var(--moss); }
  .check.on::after { content:"✓"; color:var(--bg); font-size:15px; font-weight:800; }
  .rbody { flex:1; min-width:0; }
  .rtitle { font-size:15.5px; font-weight:600; line-height:1.25; }
  .row.done .rtitle { text-decoration:line-through; opacity:.45; }
  .rmeta { font-size:12.5px; line-height:1.5; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag { font-weight:700; }
  .tag.health{color:var(--frost);} .tag.sport{color:var(--clay);}
  .tag.mental{color:var(--moss);} .tag.planning{color:var(--amber);}
  .tag.imported{color:var(--frost);} .tag.event{color:var(--frost);} .tag.once{color:var(--amber);}
  .tag-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .dose { flex-shrink:0; font-size:12.5px; font-weight:700; color:var(--clay);
    background:var(--clay-soft); padding:4px 8px; border-radius:7px; }

  .acts { display:flex; gap:5px; flex-shrink:0; }
  .ico { width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:14px; line-height:1; display:grid; place-items:center; }
  .ico.edit { color:var(--frost); }
  .ico.del  { color:var(--rose); }

  .block { margin-top:20px; }
  .block-head { display:flex; align-items:baseline; justify-content:space-between; padding:0 6px 8px; border-bottom:1px solid var(--line); }
  .block-title { font-family:Georgia,serif; font-size:17.5px; font-weight:600; }
  .block-time { font-size:12px; color:var(--frost); font-weight:600; background:var(--frost-soft);
    border:none; padding:5px 10px; border-radius:7px; }
  .wait-note { margin:12px 6px 0; padding:10px 14px; background:rgba(255,194,71,.12);
    border-radius:10px; font-size:13px; color:var(--amber); font-weight:500; }

  .note { margin:18px 6px 0; padding:14px 16px; border-radius:12px; background:var(--frost-soft);
    font-size:12.5px; line-height:1.55; color:var(--frost); }
  .note strong { color:var(--ink); }
  .note.warn { background:rgba(255,194,71,.12); color:var(--amber); }

  .import-btn { background:var(--frost); color:var(--bg); border:none; padding:12px 22px;
    border-radius:11px; font-size:14.5px; font-weight:700; }
  #fileInput { display:none; }
  .import-status { margin-top:10px; font-size:12.5px; color:var(--moss); font-weight:600; }

  .day-sep { color:var(--faint); padding:16px 6px 6px; }

  /* Undo toast — sits above the floating + button, not under it. */
  .undo-toast { position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(92px + env(safe-area-inset-bottom)); width:calc(100% - 28px); max-width:612px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:none; align-items:center; gap:12px; z-index:30;
    box-shadow:0 6px 20px rgba(0,0,0,.4); overflow:hidden; }
  .undo-toast.show { display:flex; }
  .undo-label { flex:1; min-width:0; font-size:13px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .undo-btn { flex-shrink:0; background:none; border:none; color:var(--frost);
    font-size:13.5px; font-weight:700; padding:4px 6px; }
  .undo-bar { position:absolute; left:0; bottom:0; height:2px; background:var(--amber);
    animation:undo-drain 5s linear forwards; }
  @keyframes undo-drain { from { width:100%; } to { width:0; } }

  .btn-primary,.btn-ghost { flex:1; padding:14px 8px; border-radius:12px; font-size:14.5px; font-weight:600; border:none; }
  .btn-primary { background:var(--ink); color:var(--bg); }
  .btn-ghost { background:var(--surface); border:1px solid var(--line); color:var(--ink); }
  .btn-danger { background:var(--rose-soft); color:var(--rose); border:none; padding:14px;
    border-radius:12px; font-size:14.5px; font-weight:600; }
  .empty { text-align:center; color:var(--faint); padding:44px 20px; font-size:15px; line-height:1.6; }


  /* Month grid */
  .month { margin-bottom:26px; }
  .mhead { font-family:Georgia,serif; font-size:19px; font-weight:600; padding:6px 6px 10px;
    position:sticky; top:0; background:var(--bg); z-index:5; }
  .mhead span { color:var(--muted); font-weight:400; font-size:15px; }
  .wdays { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 2px 6px; }
  .wdays div { text-align:center; font-size:11px; font-weight:700; color:var(--faint);
    text-transform:uppercase; letter-spacing:.05em; }
  .mgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:0 2px; }
  .cell { aspect-ratio:1/1.05; border-radius:10px; background:none; border:none; padding:4px 0 0;
    display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink); }
  .cell.pad { visibility:hidden; }
  .cell .num { font-size:14.5px; font-weight:600; width:28px; height:28px; border-radius:50%;
    display:grid; place-items:center; }
  .cell.today .num { background:var(--frost); color:var(--bg); font-weight:800; }
  .cell.sel .num { box-shadow:inset 0 0 0 2px var(--frost); }
  .cell.today.sel .num { box-shadow:inset 0 0 0 2px var(--ink); }
  .cell.wknd .num { color:var(--muted); }
  .dots { display:flex; gap:3px; height:5px; }
  .dot { width:5px; height:5px; border-radius:50%; }
  .dot.once { background:var(--amber); }
  .dot.sport { background:var(--clay); }
  .month-hint { text-align:center; color:var(--faint); font-size:12.5px; padding:6px 0 26px; }
  .earlier-btn { display:block; width:100%; margin:0 0 14px; font-size:13px; padding:7px 14px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    white-space:nowrap; font-weight:500; }

  /* Day view */
  .day-head { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; }
  .day-back { background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; flex-shrink:0; }
  .day-title { flex:1; font-family:Georgia,serif; font-size:15px; font-weight:600; text-align:center; }
  .day-arrows { display:flex; gap:6px; flex-shrink:0; }
  .day-arrows button { width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:16px; }
  .day-allday-strip { display:flex; flex-direction:column; gap:6px; margin:0 6px 16px; }
  .day-allday { padding:8px 10px; border-radius:8px; border-left:3px solid; font-size:12.5px;
    font-weight:600; color:var(--ink); }
  .day-timeline { position:relative; margin:0 6px 30px; }
  .day-hour { position:absolute; left:0; width:48px; font-size:11px; color:var(--faint); transform:translateY(-6px); }
  .day-hourline { position:absolute; left:52px; right:0; height:1px; background:var(--line); }
  .day-events { position:absolute; left:56px; right:0; top:0; bottom:0; }
  .day-block { position:absolute; border-radius:8px; padding:4px 8px; overflow:hidden;
    border-left:3px solid; box-sizing:border-box; }
  .db-title { font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .db-time { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .now-line-day { position:absolute; left:52px; right:0; height:1.5px; background:var(--rose); z-index:2; }
  .now-line-day::before { content:''; position:absolute; left:-4px; top:-3.25px; width:8px; height:8px;
    border-radius:50%; background:var(--rose); }

  /* Week view */
  .cal-view-switch { display:flex; gap:8px; margin:0 6px 14px; }
  .wgrid-head { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; padding:0 2px 4px;
    position:sticky; top:0; background:var(--bg); z-index:5; }
  .wgrid-head div { text-align:center; font-size:9.5px; font-weight:700; color:var(--faint);
    text-transform:uppercase; letter-spacing:.02em; }
  .weekrow { margin-bottom:20px; }
  .wk-label { font-family:Georgia,serif; font-size:13px; color:var(--muted); padding:0 6px 8px; }
  .wgrid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; padding:0 2px; }
  .wk-cell { min-width:0; min-height:124px; border-radius:9px; background:none; border:none; padding:8px 3px 4px;
    display:flex; flex-direction:column; align-items:stretch; color:var(--ink); text-align:left; }
  .wk-daynum { align-self:center; font-size:14px; font-weight:700; width:25px; height:25px;
    border-radius:50%; display:grid; place-items:center; margin-bottom:6px; flex-shrink:0; }
  .wk-cell.today .wk-daynum { background:var(--frost); color:var(--bg); }
  .wk-cell.sel .wk-daynum { box-shadow:inset 0 0 0 2px var(--frost); }
  .wk-evs { display:flex; flex-direction:column; gap:3px; overflow:hidden; min-width:0; }
  .wk-ev { font-size:10.5px; line-height:1.35; padding:3px 5px; border-radius:5px; border-left:2px solid;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .wk-more { font-size:9.5px; color:var(--faint); padding:0 3px; }

  /* Agenda */
  .ag-time { flex-shrink:0; width:50px; font-size:13px; font-weight:700; color:var(--frost); line-height:1.3; }
  .ag-time small { display:block; font-size:10.5px; color:var(--faint); font-weight:600; }
  .now-line { display:flex; align-items:center; gap:8px; padding:6px 6px; }
  .now-line .lbl { font-size:10.5px; font-weight:800; color:var(--rose); letter-spacing:.08em; }
  .now-line .ln { flex:1; height:1.5px; background:var(--rose); opacity:.7; }
  .ag-sub { font-size:12px; color:var(--faint); margin-top:2px; }
  .compact-import { display:flex; gap:9px; align-items:center; margin:10px 6px 16px;
    padding:12px 14px; border:1px dashed rgba(95,216,245,.4); border-radius:12px;
    background:rgba(95,216,245,.05); }
  .compact-import .ci-txt { flex:1; font-size:12.5px; color:var(--muted); line-height:1.4; }
  .compact-import button { background:var(--frost); color:var(--bg); border:none; padding:10px 15px;
    border-radius:9px; font-size:13px; font-weight:700; flex-shrink:0; }


  .gcard { margin:10px 6px 16px; padding:16px; border-radius:14px; background:var(--surface);
    border:1px solid var(--line); }
  .gcard.on { border-color:rgba(79,230,176,.45); background:rgba(79,230,176,.07); }
  .gcard.cal-collapsed { margin-bottom:12px; cursor:pointer; }
  .gcard.cal-collapsed .gtop { margin-bottom:0; }
  .cal-collapsed-meta { font-size:12.5px; color:var(--muted); font-weight:600; }
  .gtop { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .gtitle { font-family:Georgia,serif; font-size:16px; font-weight:600; flex:1; }
  .gsub { font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px; }
  .gsub b { color:var(--ink); font-weight:600; }
  .grow { display:flex; gap:8px; }
  .gbtn { flex:1; padding:11px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; }
  .gbtn.pri { background:var(--frost); color:var(--bg); }
  .gbtn.sec { background:var(--bg); color:var(--muted); border:1px solid var(--line); }

  /* ================= Nexus =================
     Replaced the tilted day-arc dial in August 2026 at the user's request.
     Same shell as before — one instance in the mobile overlay (#arcOverlay),
     one always-on copy in the desktop rail (#arcRailWrap), ids suffixed
     -ov / -rail — but the drawing is different in kind: the seven domains
     systemsReport() already computes, orbiting the day's completion.

     DEPTH IS COMPUTED, NOT CSS 3D (see the block comment on nxPlace). The
     old dial used a real rotateX on a preserve-3d disc, and paid for it
     twice: layer divs sat in front of the nodes in Z and swallowed taps, and
     every label needed counter-rotating to stay upright. Flat SVG has
     neither problem. Do not reintroduce perspective here. */
  .arc-stage { position:relative; }
  .nx-svg { position:absolute; inset:0; width:100%; height:100%;
    display:block; overflow:visible; }
  .nx-node { cursor:pointer; }
  .nx-node:focus { outline:none; }
  .nx-node:focus-visible .nx-ring { stroke:var(--ink); stroke-width:3; }
  /* Transparent, and far wider than the drawing: nxPlace() sizes it to the
     node radius plus 22 SVG units. The old dial's 17px dots were the single
     most-reported annoyance on the phone — this is the fix, and it is why
     nothing else in the stage is hit-testable. */
  .nx-hit { fill:transparent; }
  .nx-lab, .nx-val { pointer-events:none; }
  .nx-val { text-shadow:0 0 12px rgba(95,216,245,.45); }
  /* Scanlines. Overlay only, and only as a wash over the whole stage — one
     static gradient, not a per-element effect, so it costs nothing per frame.
     The rail copy is small enough that they would read as moire. */
  .arc-overlay .arc-stage::after { content:''; position:absolute; inset:0;
    pointer-events:none; background:repeating-linear-gradient(0deg,
      rgba(95,216,245,.05) 0 1px, transparent 1px 3px); }
  /* SVG text scales with the viewBox. The rail copy is 292px against a 400
     unit box, so labels that read fine in the 560px overlay come out at
     ~7px there. At that size the rail is a summary — colour, size and the
     centre readout still carry it — so it simply carries no labels. */
  #arcRailWrap .nx-lab, #arcRailWrap .nx-val { display:none; }

  /* Always the day summary now, and always click-through: detail moved out
     to its own card, so nothing in the middle of the disc can swallow a tap
     meant for a node behind it. */
  /* Sits inside the core ring (r=84 of a 400 unit box), so it is narrower
     than it was in the middle of the old disc — overrun would cross the ring
     rather than just look loose. Dead centre now: the constellation is
     symmetric about the middle, the tilted disc was not. */
  .arc-hud { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; animation:arc-fade .8s ease 1.9s both;
    width:min(34%, 150px); }
  @keyframes arc-fade { from { opacity:0; transform:translate(-50%,-42%) } }
  .arc-cap { font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted); }
  .arc-pct { font-family:var(--mono); font-size:clamp(26px,7vw,38px); font-weight:600;
    color:var(--moss); font-variant-numeric:tabular-nums; line-height:1; margin:5px 0 0;
    text-shadow:0 0 26px rgba(79,230,176,.35); }

  /* ---- node detail card (below the arc on phones, beside it on desktop) ----
     Sized for reading, not for squeezing into the middle of a tilted ring:

  .arc-detail { width:100%; max-width:min(96vw, 560px); }
  /* --surface sits only a shade above the overlay's ground, so on the busy
     grid backdrop the card read as translucent. Lifting it with a flat cyan
     wash over the token, a brighter edge and a real drop shadow makes it
     sit clearly ON TOP without inventing a new colour. drop-shadow, not
     box-shadow: clip-path would crop a box-shadow away entirely. */
  .arc-d-card {
    background:linear-gradient(rgba(95,216,245,.07), rgba(95,216,245,.07)), var(--surface);

  .arc-d-top { display:flex; align-items:baseline; gap:10px; padding-right:34px; }

  .arc-d-acts { display:flex; gap:8px; margin-top:14px; }

    flex:1; font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:700; min-height:44px; padding:0 8px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); border-radius:0;
    clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
  .arc-d-acts .pri { background:var(--frost-soft); border-color:rgba(95,216,245,.45); color:var(--frost); }
  .arc-d-acts .pri.undo { background:rgba(79,230,176,.14); border-color:rgba(79,230,176,.45); color:var(--moss); }
  .arc-d-close { position:absolute; top:8px; right:8px; width:30px; height:30px;
    border-radius:50%; border:1px solid var(--line); background:var(--bg); color:var(--muted);
    font-size:12px; line-height:1; display:grid; place-items:center; }
  /* Shown in the card's place when nothing is selected, so the layout does
     not jump when a node is tapped and the affordance is discoverable. */
  .arc-d-hint { text-align:center; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    border:1px dashed var(--line); padding:14px 12px; }
  /* The domain's own items, tickable and editable in place. Capped and
     scrollable: a routine day is seventeen rows, and on the phone this card
     is pinned to the bottom of the overlay with the constellation above it. */
  .nx-items { margin-top:12px; border-top:1px solid var(--line); padding-top:4px;
    max-height:min(34vh, 260px); overflow-y:auto; }
  .nx-i-row { display:flex; align-items:center; gap:9px; padding:2px 0; }
  .nx-i-row.done .nx-i-name { color:var(--faint); text-decoration:line-through; }
  .nx-i-tick { width:34px; height:34px; flex-shrink:0; border:1px solid var(--line);
    background:var(--bg); color:var(--moss); font-size:13px; line-height:1;
    display:grid; place-items:center; border-radius:0; }
  .nx-i-row.done .nx-i-tick { border-color:rgba(79,230,176,.5); background:rgba(79,230,176,.14); }
  /* Wide enough for "all day", not just HH:MM — otherwise a mixed calendar
     list steps the title column in and out row by row. */
  .nx-i-time { font-family:var(--mono); font-size:11px; color:var(--frost);
    font-variant-numeric:tabular-nums; flex-shrink:0; min-width:52px; }
  /* min-width:0 or a long title refuses to shrink and pushes the pencil out
     of the card — the same flex trap the date/time inputs hit. */
  .nx-i-name { flex:1; min-width:0; font-size:14px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nx-i-edit { width:34px; height:34px; flex-shrink:0; border:0; background:none;
    color:var(--faint); font-size:13px; }
  /* Same footprint as .nx-i-tick so a mixed or read-only list keeps its
     columns; a dot rather than an empty box, which would read as unticked. */
  .nx-i-bullet { width:34px; height:34px; flex-shrink:0; display:grid; place-items:center; }
  .nx-i-bullet i { width:6px; height:6px; border-radius:50%; display:block; }
  .nx-i-time { white-space:nowrap; }

  /* Lock-on and the radar sweep both moved into the script: selection is a
     stroke-width/opacity change applied per frame by nxPlace(), and the sweep
     is a line whose far end is placed on the same ellipse as everything else,
     so it stays in the orbital plane instead of spinning across it. */

  /* ---- mobile: opens on demand, full-screen ---- */
  .arc-overlay { display:none; position:fixed; inset:0; background:var(--bg); z-index:35;
    /* overflow-x:hidden matters: the disc's rings/pins are 3D-transformed
       and nothing clips them, so a few pixels legitimately poke past
       .arc-stage's own box near the edges. Without this, that sliver of
       horizontal overflow made the whole page pannable sideways with a
       swipe — visually confusing since nothing was actually "there" to
       scroll to, just a stray few px of transformed content. */
    overflow-y:auto; overflow-x:hidden;
    padding:calc(24px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom)); }
  /* align-items default (stretch), not center: a centered flex item has no
     definite cross-axis size, so .arc-stage's width:100% below had nothing
     real to resolve against and rendered oversized (WebKit in particular
     falls back to something far bigger than the viewport). Stretching
     #arcOvStageHost gives it a real width — .arc-stage still ends up
     visually centered via its own max-width + margin:auto. */
  .arc-overlay.open { display:flex; flex-direction:column; justify-content:center; }
  /* Mark II atmosphere: a faint cyan grid and scanlines behind the disc, so
     the overlay reads as a projection surface rather than a blank screen.
     Both are pure background-image — no extra elements, nothing to hit-test,
     and the disc/pins sit above it untouched. */
  .arc-overlay::before {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(95,216,245,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(95,216,245,.05) 1px, transparent 1px),
      repeating-linear-gradient(rgba(95,216,245,.035) 0 1px, transparent 1px 3px),
      radial-gradient(120% 70% at 50% 42%, rgba(95,216,245,.10), transparent 65%);
    background-size:44px 44px, 44px 44px, 100% 3px, 100% 100%;
  }
  .arc-overlay > * { position:relative; z-index:1; }
  .arc-ov-body { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;
    /* Reserves the band the detail card is pinned into, below. */
    padding-bottom:196px; }
  /* On a phone the card is pinned to the bottom rather than sitting in the
     column flow. In flow it changed the body's height when it swapped
     between the hint and a full card, which re-centred the flex column and
     moved the whole disc vertically — the arc jumped out from under your
     finger every time you selected something, which is half the reason
     nodes felt impossible to hit. Pinned, the disc never moves. */
  .arc-detail { position:absolute; left:12px; right:12px;
    bottom:calc(18px + env(safe-area-inset-bottom)); width:auto; max-width:none; }
  #arcOvStageHost { width:100%; display:flex; justify-content:center; }
  /* The stage must stay SQUARE: the SVG's viewBox is 400x400 with the
     default xMidYMid-meet, so a non-square box would scale the disc down to
     the shorter side instead of filling the wider one. Growth therefore
     comes from width, and the vertical slack the tilt leaves is reclaimed
     by easing the tilt (below) rather than by squashing the box. */
  /* aspect-ratio matches the viewBox (516x408). Left at 1 it letterboxed a
     wide drawing inside a square box and threw away a fifth of the width —
     on a phone that is the difference between legible labels and not. */
  .arc-overlay .arc-stage { width:100%; max-width:min(100vw, 620px);
    aspect-ratio:516/408; margin:0 auto; }
  /* The 42% default was tuned for the rail's steep 44deg, where the disc's
     visual centre sits high. At the overlay's gentler tilt the readout has
     to drop back toward the true centre or it collides with the ring's top
     edge — which it did, with the taller next-up row added. */
  .arc-overlay .arc-hud { top:50%; }
  /* Eased well back from the rail's 44deg. Foreshortening is what made the
     far side of the ring hard to read, and a rounder disc also wastes less
     of the screen's height — both of which is what "bigger and readable"
     actually needs here. Scoped, so the rail keeps its steeper angle. */
  .arc-close { position:fixed; top:calc(16px + env(safe-area-inset-top)); right:16px;
    width:36px; height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    color:var(--ink); font-size:15px; z-index:36; }

  /* Scheduled-tasks strip above the stage. A horizontal chip scroller, not
     a tall list — it sits in the centred column's free space without
     pushing the stage down much, even with several tasks. */
  .arc-tasklist { width:100%; max-width:460px; margin:0 auto 16px; flex-shrink:0; }
  .arc-tl-h { font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--faint); margin:0 4px 8px; }
  .arc-tl-scroll { display:flex; gap:8px; overflow-x:auto; padding:0 4px 2px; scrollbar-width:none; }
  .arc-tl-scroll::-webkit-scrollbar { display:none; }
  .arc-tl-row { flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:8px 13px;
    border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:500; white-space:nowrap; }
  .arc-tl-row.done { opacity:.45; text-decoration:line-through; }
  .arc-tl-time { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--frost);
    font-weight:600; font-size:12px; }

  /* ---- the status block becomes the mobile open-trigger ---- */
  .progress-wrap { cursor:pointer; border-radius:10px; transition:background-color .12s ease; }
  .progress-wrap:active { background:var(--line); }
  .eat-subrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  /* Same visual language as .ico.edit (bordered surface, frost glyph) so it
     reads as a real button, not a faint stray character — the first version
     of this (bare 11px var(--faint) text) was too subtle to spot. */
  .eat-edit { flex-shrink:0; width:24px; height:24px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--frost); font-size:12px; line-height:1;
    display:grid; place-items:center; }
  .eat-edit:active { background:var(--line); }

  .link-btn { width:100%; margin-top:6px; padding:12px; border-radius:10px; background:var(--frost-soft);
    color:var(--frost); border:none; font-size:14px; font-weight:600; }

  /* ---------- cold-open briefing ---------- */
  .boot { position:fixed; inset:0; z-index:60; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; gap:22px;
    background-image:
      repeating-linear-gradient(rgba(95,216,245,.045) 0 1px, transparent 1px 3px),
      radial-gradient(90% 60% at 50% 45%, rgba(95,216,245,.12), transparent 70%);
  }
  .boot[hidden] { display:none; }
  .boot.out { animation:boot-out .45s ease forwards; }
  @keyframes boot-out { to { opacity:0; visibility:hidden; } }
  .boot-inner { width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; }
  .boot-line { font-family:var(--mono); opacity:0; animation:boot-in .42s ease forwards; }
  @keyframes boot-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .boot-mark { font-size:26px; font-weight:700; letter-spacing:.16em; color:var(--frost);
    text-shadow:0 0 24px rgba(95,216,245,.55); }
  .boot-rule { height:1px; background:linear-gradient(90deg,var(--frost),transparent);
    opacity:0; animation:boot-rule .5s ease forwards; transform-origin:0 50%; }
  @keyframes boot-rule { from { opacity:0; transform:scaleX(0);} to { opacity:.8; transform:none; } }
  .boot-meta { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); }
  .boot-stat { font-size:15px; color:var(--ink); display:flex; gap:10px; align-items:baseline; }
  .boot-stat b { font-size:22px; font-weight:600; color:var(--moss);
    font-variant-numeric:tabular-nums; text-shadow:0 0 20px rgba(79,230,176,.35); }
  .boot-next { font-size:13.5px; color:var(--frost); }
  .boot-next span { color:var(--muted); }
  .boot-skip { font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--faint); }
  .boot-speak { align-self:flex-start; margin-top:6px; font-family:var(--mono);
    font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    min-height:44px; padding:0 18px; border:1px solid rgba(95,216,245,.5);
    background:var(--frost-soft); color:var(--frost); border-radius:0;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  .boot-speak.on { background:rgba(79,230,176,.16); border-color:rgba(79,230,176,.5);
    color:var(--moss); }
  @media (prefers-reduced-motion: reduce){
    .boot-line, .boot-rule { animation:none; opacity:1; transform:none; }
    .boot.out { animation:none; display:none; }
  }

  /* ---------- systems readout ---------- */
  .sysblock { margin:6px 6px 14px; background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--moss); }
  .sysblock.watch { border-left-color:var(--amber); }
  .sysblock.warn  { border-left-color:var(--rose); }
  .sys-head { display:flex; align-items:center; gap:9px; width:100%; padding:11px 13px;
    background:none; border:0; color:var(--ink); text-align:left; border-radius:0; }
  .sys-title { font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); flex-shrink:0; }
  .sys-headline { font-family:var(--mono); font-size:11.5px; color:var(--ink);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sys-caret { color:var(--faint); font-size:10px; flex-shrink:0; }
  .sys-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--moss);
    box-shadow:0 0 8px currentColor; color:var(--moss); }
  .sys-dot.watch { background:var(--amber); color:var(--amber); }
  .sys-dot.warn  { background:var(--rose);  color:var(--rose); }
  .sys-rows { padding:2px 13px 11px; display:flex; flex-direction:column; gap:1px; }
  .sys-row { display:flex; align-items:center; gap:9px; padding:7px 0;
    border-top:1px solid var(--line); font-size:12.5px; }
  .sys-label { color:var(--ink); flex-shrink:0; }
  .sys-detail { font-family:var(--mono); font-size:11px; color:var(--muted);
    margin-left:auto; text-align:right; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- blood pressure ---------- */
  .bp-card { margin:10px 6px 14px; padding:14px 15px; background:var(--surface);
    border:1px solid var(--line); }
  .bp-inputs { display:flex; align-items:flex-end; gap:8px; margin-top:9px; }
  .bp-f { display:flex; flex-direction:column; gap:5px; min-width:0; flex:1 1 0; }
  .bp-f.wide { margin-top:10px; }
  .bp-f label { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); }
  .bp-f input { width:100%; min-width:0; padding:11px 10px; background:var(--bg);
    border:1px solid var(--line); color:var(--ink); font-family:var(--mono);
    font-size:16px; font-variant-numeric:tabular-nums; border-radius:0; text-align:center; }
  .bp-f.wide input { font-size:13px; text-align:left; }
  .bp-sep { font-family:var(--mono); font-size:18px; color:var(--faint); padding-bottom:11px; }
  .bp-add { flex:0 0 auto; align-self:flex-end; font-family:var(--mono); font-size:11px;
    letter-spacing:.12em; text-transform:uppercase; font-weight:700; min-height:44px;
    padding:0 15px; border:1px solid rgba(95,216,245,.45); background:var(--frost-soft);
    color:var(--frost); border-radius:0;
    clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
  .bp-msg { margin-top:9px; font-size:12.5px; color:var(--amber); }
  .bp-empty { margin-top:12px; font-size:12.5px; color:var(--faint); }

  .bp-last { display:flex; align-items:center; gap:12px; width:100%; margin-top:12px;
    padding:12px 13px; background:var(--bg); border:1px solid var(--line);
    border-left:3px solid var(--moss); color:var(--ink); text-align:left; border-radius:0; }
  .bp-last.elev { border-left-color:var(--amber); }
  .bp-last.high { border-left-color:var(--rose); }
  .bp-last.low  { border-left-color:var(--frost); }
  .bp-last-val { font-family:var(--mono); font-size:23px; font-weight:700;
    font-variant-numeric:tabular-nums; color:var(--ink); flex-shrink:0; }
  .bp-slash { color:var(--faint); margin:0 1px; }
  .bp-last-meta { display:flex; flex-direction:column; gap:3px; min-width:0; flex:1; }
  .bp-last-when { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .bp-chev { font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--frost); flex-shrink:0; }
  .bp-band { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
    text-transform:uppercase; font-weight:700; align-self:flex-start;
    border:1px solid currentColor; padding:2px 6px; }
  .bp-band.ok { color:var(--moss); } .bp-band.elev { color:var(--amber); }
  .bp-band.high { color:var(--rose); } .bp-band.low { color:var(--frost); }
  .bp-legend { display:flex; gap:16px; margin:2px 0 4px; }
  .bp-legend span { display:flex; align-items:center; gap:6px; font-family:var(--mono);
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .bp-legend i { width:9px; height:9px; flex-shrink:0; }

  /* ============ MARK II — geometry & labels (phase 2) ============
     Deliberately one block of overrides rather than edits threaded through
     every rule above: it keeps the restyle reviewable in one place and
     revertible by deleting a single section. It sits BEFORE the desktop
     query on purpose — the (min-width:900px) rules must still win over
     these, or the vertical tab rail would lose its left-bar treatment. */

  /* Corners get cut, not rounded. clip-path also clips the border, which
     is what produces the bevelled edge — and it clips box-shadow away
     entirely, so anything here that needs to glow uses filter:drop-shadow
     instead, which follows the clip. */
  .fab, .btn-primary, .btn-ghost, .btn-danger, .import-btn, .gbtn, .link-btn,
  .connect-btn, .earlier-btn, .day-back, .chip, .logo, .seg button, .opt-pill {
    border-radius:0;
    clip-path:polygon(var(--notch) 0, 100% 0, 100% calc(100% - var(--notch)),
                      calc(100% - var(--notch)) 100%, 0 100%, 0 var(--notch));
  }
  /* The round + becomes a bevelled square; drop-shadow survives the clip
     where box-shadow would not. */
  .fab { border-radius:0; box-shadow:none; filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))
    drop-shadow(0 0 12px rgba(95,216,245,.4)); }
  .chip, .opt-pill { --notch:6px; }

  /* Panels get bracket marks at opposite corners. Cheap, and it reads as
     HUD instantly without touching the panel's own box. */
  .gcard, .biocard, .upload-zone, .note { position:relative; }
  .gcard::before, .biocard::before, .upload-zone::before, .note::before,
  .gcard::after,  .biocard::after,  .upload-zone::after,  .note::after {
    content:''; position:absolute; width:12px; height:12px;
    border:2px solid var(--frost); pointer-events:none; opacity:.55;
  }
  .gcard::before, .biocard::before, .upload-zone::before, .note::before {
    top:-1px; left:-1px; border-right:0; border-bottom:0;
  }
  .gcard::after, .biocard::after, .upload-zone::after, .note::after {
    bottom:-1px; right:-1px; border-left:0; border-top:0;
  }

  /* Chrome type goes mono. Georgia is what still read "calm journal"
     rather than "flight computer"; this is the most opinionated change in
     the restyle and the cleanest single thing to revert if it lands wrong. */
  .logo, h1, .block-title, .mhead, .day-title, .wk-label, .gtitle,
  .upload-zone h3, .sheet h2, .md-name, .md-val, .td-title {
    font-family:var(--mono); letter-spacing:-0.01em;
  }
  .logo { color:var(--frost); text-shadow:var(--glow-soft); border-color:rgba(95,216,245,.38); }
  .eyebrow { font-family:var(--mono); }

  /* Tabs: uppercase mono, lit when active. */
  .tab { font-family:var(--mono); font-size:11px; letter-spacing:.10em;
    text-transform:uppercase; padding:13px 12px; }
  .tab.active { text-shadow:var(--glow-soft); background:rgba(95,216,245,.07); }

  /* Tags were already mono uppercase — the thin box is what makes them
     read as HUD chips rather than coloured words. */
  .tag { border:1px solid currentColor; padding:2px 6px; font-size:9.5px; letter-spacing:.12em; }
  .tag-dot { margin-right:4px; }

  /* Checkboxes become targeting diamonds. The glyph counter-rotates so the
     tick and the + stay upright inside the rotated box. */
  .check { border-radius:2px; transform:rotate(45deg); }
  .check.on { box-shadow:var(--glow); }
  .check.on::after, .check.plus::after { display:block; transform:rotate(-45deg); }

  /* Edge glow on the lit elements only — never on rows (a blurred shadow
     per row is the usual cause of scroll jank) and never on body text. */
  .progress-bar, .eat-fill { box-shadow:var(--glow-soft); }
  .pct { text-shadow:0 0 18px rgba(79,230,176,.45); }
  .now-line-day, .now-line .ln { box-shadow:0 0 8px rgba(255,95,109,.6); }

  /* Bars and inputs square off to match the bevelled buttons. */
  .progress-track, .eat-track, .field input, .field select, .gid-input,
  .compare-sel, .sheet, .desc-panel, .md-point, .wait-note, .note,
  .upload-zone, .gcard, .biocard, .dose, .block-time,
  .streak-pill, .undo-toast { border-radius:0; }

  /* ============ Desktop (>=900px): three-column shell ============
     Everything below is scoped to this query. Nothing above changes, so
     narrowing back under 900px returns exactly to the phone layout. */
  @media (min-width:900px){
    /* Container: same centred idea as the phone's max-width:640px body,
       just wider — clearance on each side for the two fixed rails. */
    body { max-width:1240px; padding-left:220px; padding-right:352px; }
    main, .filters { max-width:680px; margin-left:auto; margin-right:auto; }
    main { padding-bottom:40px; }

    /* Left rail: the fixed top header becomes a fixed full-height sidebar.
       transform:none matters beyond undoing the mobile centring trick — a
       transformed ancestor would otherwise become the containing block for
       .rail-right's position:fixed below, dragging it back inside this
       200px column instead of the viewport's right edge. */
    header {
      left:0; transform:none; width:200px; max-width:none; height:100vh;
      padding:32px 16px 116px; border-bottom:none; border-right:1px solid var(--line);
      display:flex; flex-direction:column; overflow-y:auto;
    }
    .crest { gap:10px; margin-bottom:18px; }
    .crest .sponsor { height:17px; }
    .crest .logo { font-size:18px; padding:6px 8px 5px; }
    .headerctrls { flex-wrap:wrap; row-gap:8px; }
    .daynav { flex-wrap:wrap; row-gap:8px; flex:1 1 100%; }
    .daynav .dlabel { flex:1 1 100%; order:-1; }

    /* Tabs: a vertical list instead of a scroller, active mark moves from
       an underline to a left bar since there's no edge to fade at this width. */
    .tabs-wrap::after { display:none; }
    .tabs { flex-direction:column; width:100%; overflow:visible; scroll-snap-type:none; gap:2px; }
    .tab { width:100%; text-align:left; padding:11px 12px; border-bottom:none;
      border-left:2.5px solid transparent; border-radius:0 8px 8px 0; }
    .tab.active { border-bottom-color:transparent; border-left-color:var(--frost); background:var(--frost-soft); }
    .tab:not(.active):hover { color:var(--muted); background:var(--surface); }

    /* Right rail: status block + condensed agenda + tasks due today, fixed
       to the viewport edge and unaffected by which tab is active. It's a
       DOM child of <header> only so .progress-wrap's markup and IDs stay
       untouched from the phone layout — position:fixed here escapes
       header's box entirely, so this still docks to the true right edge. */
    .rail-right {
      display:flex; flex-direction:column; gap:22px;
      position:fixed; top:0; right:0; width:332px; height:100vh;
      padding:32px 20px; border-left:1px solid var(--line); background:var(--bg);
      overflow-y:auto; z-index:10;
    }
    .progress-wrap { margin-top:0; }
    #railBio, #railTasks { display:block; }
    .rail-h { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
      text-transform:uppercase; color:var(--faint); margin-bottom:10px; }
    .rail-row { display:flex; align-items:baseline; gap:10px; padding:7px 0;
      border-bottom:1px solid var(--line); font-size:12.5px; }
    .rail-row:last-child { border-bottom:none; }
    .rail-time { flex-shrink:0; width:44px; font-family:var(--mono);
      font-variant-numeric:tabular-nums; color:var(--frost); font-weight:600; }
    .rail-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
    .rail-empty { font-size:12.5px; color:var(--faint); }
    .rail-sub { font-family:var(--mono); font-size:10px; color:var(--faint);
      padding:0 0 7px; margin-top:-3px; }
    .rail-row.sub { padding-left:10px; border-left:2px solid var(--amber); cursor:pointer; }
    .rail-row.sub:hover { background:var(--surface); }
    #railBio { cursor:pointer; }
    #railBio:hover .rail-go { color:var(--frost); }
    .rail-go { float:right; letter-spacing:.08em; color:var(--faint); }
    .rail-val { font-family:var(--mono); font-size:11px; color:var(--amber);
      font-variant-numeric:tabular-nums; margin-left:auto; flex-shrink:0; }
    /* The band pill is sized for the Bio tab; tighten it for the rail. */
    .rail-row .bp-band { font-size:8.5px; padding:1px 4px; margin-left:auto; flex-shrink:0; }

    /* Nexus: always on screen here instead of behind a tap, sized to the
       rail's own width. No perspective — the tilt is in the geometry now, so
       this box needs no 3D context and the view does not distort with size. */
    #arcRailWrap { display:block; margin-bottom:2px; cursor:pointer; }
    #arcRailWrap .arc-stage { width:100%; max-width:292px; aspect-ratio:1; margin:0 auto; }
    #arcRailWrap .arc-hud { top:50%; width:min(42%, 110px); }
    #arcRailWrap .arc-pct { font-size:22px; }
    /* The rail readout is the percentage and nothing else. Everything else
       these lines carried — the eating countdown, what is next — is spelled
       out in the status block immediately below, and at 292px the core ring
       is only ~120px across, so a line of mono text runs straight over it.
       They all stay in the full-screen overlay, where there is room. */

    /* At 240px the rail arc is a summary, not a workspace — its nodes are
       too small to inspect. Clicking anywhere on it opens the full-screen
       overlay, which is where detail lives on desktop too. */
    #arcRailWrap .arc-expand {
      display:block; width:100%; margin-top:6px; background:none; border:0;
      font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--faint); padding:4px 0; }
    #arcRailWrap:hover .arc-expand { color:var(--frost); }
    /* No longer a tappable trigger — the arc is already on screen. */
    .rail-right .progress-wrap { cursor:default; }
    .rail-right .progress-wrap:active { background:none; }

    /* Full-screen overlay, desktop shape: the disc sizes against HEIGHT
       here (a desktop window is wider than it is tall — the opposite of the
       phone), and the detail card moves alongside instead of underneath,
       so neither has to shrink to share the screen. */
    .arc-ov-body { flex-direction:row; align-items:center; justify-content:center;
      gap:36px; max-width:1180px; margin:0 auto; padding-bottom:0; }
    #arcOvStageHost { width:auto; flex:0 1 auto; }
    /* Bigger than the old disc got: the wider viewBox reserves margin for
       the labels, so the drawing itself occupies less of the box and the
       stage has to grow to compensate. */
    .arc-overlay .arc-stage { width:min(62vw, 96vh); max-width:none; }
    /* Back into the row here: side by side with align-items:center the row's
       height is the stage's, so the card growing or shrinking cannot move
       the disc — the phone's pinning is unnecessary and would misplace it. */
    .arc-detail { position:static; left:auto; right:auto; bottom:auto;
      width:320px; max-width:320px; flex-shrink:0; }
    .arc-tasklist { max-width:1180px; }

    /* The floating + becomes a labelled button docked to the left rail —
       still position:fixed (robust regardless of the rail's content height,
       same reasoning as the phone version), just bottom-left of that
       column instead of bottom-right of the page. */
    .fab { left:16px; right:auto; bottom:calc(24px + env(safe-area-inset-bottom));
      width:168px; height:44px; border-radius:10px; display:flex; align-items:center;
      justify-content:center; gap:6px; font-size:14px; font-weight:700; }
    .fab-label { display:inline; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }

    /* Sheets open centred instead of sliding up from the bottom. */
    .overlay { align-items:center; }
    .sheet { width:520px; max-width:520px; border-radius:20px; max-height:85vh; }

    /* Month grid: bigger cells with event titles instead of dots-only. */
    .mgrid { gap:6px; }
    .cell { aspect-ratio:auto; min-height:110px; align-items:flex-start;
      padding:8px; border:1px solid var(--line); border-radius:10px; }
    .cell .num { align-self:flex-start; }
    .cell-events { display:flex; flex-direction:column; gap:2px; width:100%; margin-top:2px; }
    .mev { font-size:10.5px; line-height:1.3; padding:2px 5px; border-radius:4px;
      border-left:2px solid; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
    .mev-more { font-size:9.5px; color:var(--faint); }

    /* Day view: wider hour gutter, taller rows (hourPx() in the script
       drives the vertical positions to match). */
    .day-hour { width:64px; }
    .day-hourline { left:68px; }
    .day-events { left:72px; }

    /* Hover states — available now that the pointer isn't a thumb. */
    .row { transition:background-color .15s ease; }
    .row:hover { background:var(--surface); }
    .row .acts { opacity:0; transition:opacity .15s ease; }
    .row:hover .acts, .row:focus-within .acts { opacity:1; }
  }
  @media (min-width:900px) and (prefers-reduced-motion: reduce){
    .row, .row .acts { transition:none; }
  }
</style>
</head>

    <div class="brandtext">
      <div class="eyebrow" id="eyebrow">ZEUS Protocol</div>
      <h1 id="pageTitle">Agenda</h1>
    </div>
  </div>
  <div class="headerctrls">
    <div class="daynav">
      <button onclick="shiftDay(-1)">‹</button>
      <span class="dlabel" id="date"></span>
      <button class="today-btn" onclick="goToday()">Today</button>
      <button onclick="shiftDay(1)">›</button>
    </div>
    <!-- Always present, on every tab, regardless of SECTIONS — the one
         place sign-in, personalisation, backup/erase and device
         connections live now, so they can never again be sealed behind
         a tab the user has hidden. See openSettingsSheet(). -->
    <button class="ico" id="settingsBtn" onclick="openSettingsSheet()" aria-label="Settings" title="Settings">⚙</button>
  </div>
  <aside class="rail-right" id="railRight">
  <!-- Desktop-only: the nexus, always on screen here. Filled by
       arcStageHTML('rail') at boot; unhidden by the (min-width:900px)
       query the same way #railBio/#railTasks are. -->
  <div id="arcRailWrap" hidden></div>
  <div class="progress-wrap" id="progWrap" role="button" tabindex="0" aria-label="Open nexus"
    onclick="arcBlockTap()" onkeydown="arcBlockKey(event)">
    <div class="status-head">
      <div class="status-left"><span class="pct" id="pct">0%</span><span class="pct-sub">done</span></div>
    </div>
    <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
    <div class="eat-track" id="eatTrack"><div class="eat-fill" id="eatFill"></div></div>
    <!-- No onclick here anymore — the whole block (#progWrap) now opens the
         arc on tap; editing the window moved to the ✎ inside, rendered by
         renderEatWindow() with its own stopPropagation. -->
    <div class="eat-line" id="eatHead"></div>
  </div>
  <!-- Desktop-only: populated by renderRail(). Stays hidden on mobile via
       the [hidden] attribute — the (min-width:900px) query is the only place
       that turns it back on, so narrowing the window removes it again. -->
  <div class="rail-section" id="railBio" hidden role="button" tabindex="0"
       aria-label="Open Bio" onclick="railOpenBio()" onkeydown="railBioKey(event)"></div>
  <div class="rail-section" id="railTasks" hidden></div>
  </aside>
  <div class="tabs-wrap" id="tabsWrap">
    <div class="tabs" id="tabs">
      <button class="tab active" id="tab-agenda" onclick="setTab('agenda')">Agenda</button>
      <button class="tab" id="tab-routine" onclick="setTab('routine')">Routine</button>
      <button class="tab" id="tab-supps" onclick="setTab('supps')">Supps</button>
      <button class="tab" id="tab-tasks" onclick="setTab('tasks')">Tasks</button>
      <button class="tab" id="tab-cal" onclick="setTab('cal')">Calendar</button>
      <button class="tab" id="tab-bio" onclick="setTab('bio')">Bio</button>
      <button class="tab" id="tab-integrations" onclick="setTab('integrations')">Integrations</button>
    </div>
  </div>

<div class="filters" id="filters"></div>
<main id="content"></main>
<input type="file" id="fileInput" accept=".ics,text/calendar">
<input type="file" id="pdfInput" accept="application/pdf,.pdf" style="display:none">
<input type="file" id="backupInput" accept=".json" style="display:none">

<button class="fab" onclick="openSheet('add')" aria-label="Add">+<span class="fab-label" hidden>Add</span></button>
<div class="undo-toast" id="undoToast"></div>

<!-- The nexus, full screen. Opened by tapping the status block on the
     phone or the rail arc on desktop; the two differ only in how the body
     below lays out (stacked vs. side-by-side), which is CSS, not markup.
     Fixed view (no drag), so nothing here captures the pointer — this
     element scrolls normally and taps reach the pins uninterrupted. -->
<!-- Cold-open briefing. Shown once a day, dismissable by tapping anywhere,
     and never blocking: the app underneath is already rendered behind it. -->
<div class="boot" id="boot" hidden onclick="bootDismiss()">
  <div class="boot-inner" id="bootInner"></div>
  <div class="boot-skip" id="bootSkip">Tap to dismiss</div>
</div>

<div class="arc-overlay" id="arcOverlay" onclick="arcOverlayTap(event)">
  <button class="arc-close" onclick="arcCloseOverlay()" aria-label="Close nexus">✕</button>
  <!-- Populated by arcRenderTaskList(); hidden via the DOM property (not
       an attribute) when there's nothing scheduled, so it never leaves an
       empty header behind. -->
  <div class="arc-tasklist" id="arcTaskList" hidden></div>
  <div class="arc-ov-body">
    <div id="arcOvStageHost"></div>
    <!-- Node detail. Deliberately out here rather than inside the ring:
         the centre of a tilted disc is the least readable place on screen,
         and it had to stay tiny to fit. Out here it gets real type sizes
         and full-width buttons. -->
    <div class="arc-detail" id="arcDetail"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Add routine</h2>
    <p class="hint" id="sheetHint">Create a new item.</p>
    <div class="field" id="f-name-field"><label id="f-name-label">Name</label><input id="f-name" placeholder="e.g. Meditation"></div>

    <div id="routineFields">
      <div class="row2">
        <div class="field"><label>Time</label><input id="f-time" type="time" value="08:00"></div>
        <div class="field"><label>Duration · min</label><input id="f-dur" type="number" value="15" min="1"></div>
      </div>
      <div class="field"><label>Category</label>
        <select id="f-cat">
          <option value="health">Health</option><option value="sport">Sport</option>
          <option value="mental">Mental</option><option value="planning">Others</option>
        </select></div>
      <label style="display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;">Kind</label>
      <div class="seg">
        <button id="seg-std" onclick="setKind(false)">Standard</button>
        <button id="seg-opt" onclick="setKind(true)">Optional</button>
      </div>
      <label style="display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;">Schedule</label>
      <div class="seg">
        <button id="seg-rep" onclick="setMode('repeat')">Repeats</button>
        <button id="seg-once" onclick="setMode('once')">Single date</button>
      </div>
      <div id="repeatBox"><div class="dows" id="dows"></div></div>
      <div id="onceBox" style="display:none"><div class="field"><input id="f-date" type="date"></div></div>
      <button class="link-btn" id="calFromSheet" onclick="calFromSheet()">Add this to Apple Calendar</button>
    </div>

    <div id="eventFields" style="display:none">
      <div class="row2">
        <div class="field"><label>Start</label><input id="e-time" type="time" value="09:00"></div>
        <div class="field"><label>Duration · min</label><input id="e-dur" type="number" value="60" min="1"></div>
      </div>
      <label class="seclabel">Schedule</label>
      <div class="seg">
        <button id="eseg-once" onclick="setEMode('once')">Single date</button>
        <button id="eseg-rep" onclick="setEMode('repeat')">Repeats</button>
      </div>
      <div id="eOnceBox"><div class="field"><input id="e-date" type="date"></div></div>
      <div id="eRepeatBox" style="display:none"><div class="dows" id="edows"></div></div>

    </div>

    <div id="suppFields" style="display:none">
      <div class="row2">
        <div class="field"><label>Brand / purpose</label><input id="f-sub" placeholder="e.g. Essentials"></div>
        <div class="field"><label>Dose</label><input id="f-dose" placeholder="e.g. 2"></div>
      </div>
      <div class="field"><label>Time block</label><select id="f-block"></select></div>
    </div>

    <div id="panelFields" style="display:none">
      <div class="field"><label>Date</label><input id="p-date" type="date"></div>
    </div>

    <div id="taskDetail" style="display:none">
      <div class="td-top">
        <button class="md-back" onclick="closeSheet()">‹ Back</button>
        <button class="td-del" onclick="deleteCurrentTask()">Delete task</button>
      </div>
      <input id="td-title" class="td-title" placeholder="Task name">
      <button id="td-sched" class="td-sched" onclick="toggleSchedEditor()"></button>

      <div id="taskFields" style="display:none">
        <div class="seg">
          <button id="tseg-none" onclick="setTMode('none')">No date</button>
          <button id="tseg-date" onclick="setTMode('date')">Date</button>
        </div>
        <div id="tDateBox" style="display:none">

const DEFAULT_SUPPS=[
 {id:'fasted',title:'Morning, fasted',time:'07:00',wait:'Wait 20–30 min before breakfast',items:[
   {id:'gut',name:'Gut',sub:'Sunday',dose:'1'},

const cloneR=r=>({...r, days:r.days?[...r.days]:undefined});

let seenDefaults=[];   // ids already reconciled against saved data

/* ======================================================================
   PERSONALISATION (ROADMAP.md 5.4) — display_name and SECTIONS live in
   the profiles table when signed in, but are ordinary local-first state
   otherwise: both persist through the normal collectState()/DB_KEY path
   like everything above, so a signed-out, single-device user still gets
   to personalise. cloudSyncProfile()/cloudPushProfile() mirror them to
   profiles on top of that — see the CLOUD SYNC section below.
   ====================================================================== */
let DISPLAY_NAME='';
const SECTION_KEYS=['agenda','routine','supps','tasks','cal','bio','integrations'];
// Merges onto the all-on default rather than trusting a saved/remote value
// outright. Missing, null, an array, a non-object, or an object with none
// of SECTION_KEYS present all count as malformed and fall back to every
// section enabled — not just one — since there is no user intent to
// preserve in that case. A header Settings button now always reaches
// these toggles regardless of SECTIONS, but a corrupt value should never
// have to depend on that to recover.
function normalizeSections(raw){
  const allTrue={agenda:true,routine:true,supps:true,tasks:true,cal:true,bio:true,integrations:true};
  const isPlainObject=raw&&typeof raw==='object'&&!Array.isArray(raw);
  if(!isPlainObject||!SECTION_KEYS.some(k=>k in raw)) return {...allTrue};
  const merged={...allTrue, ...raw};
  SECTION_KEYS.forEach(k=>{ if(typeof merged[k]!=='boolean') merged[k]=true; });
  // A valid object that deliberately disables every section is different —
  // that is real user intent, not corruption — but an empty tab bar is
  // still not a state the app can leave itself in, so one tab survives.
  if(!SECTION_KEYS.some(k=>merged[k])) merged.agenda=true;
  return merged;
}
let SECTIONS=normalizeSections();
// "Mike" -> "Mike's Protocol"; a name already ending in s gets a bare
// apostrophe ("Lukas' Protocol"), not "Lukas's" — .eyebrow's own
// text-transform:uppercase does the rest, so this stays natural-case.
function possessiveProtocolName(name){
  const n=(name||'').trim();
  if(!n) return 'ZEUS Protocol';
  return n+(/s$/i.test(n)?"'":"'s")+' Protocol';
}
function applyHeaderBrand(){

}


/* ======================================================================
   CALENDAR SUBSCRIPTION  —  read-only iCal feed.
   Browsers cannot fetch Google/iCloud .ics directly (no CORS headers),
   so the URL is routed through a proxy you control.
   ====================================================================== */
let SUBS=[], SUB_PROXY='', SUB_MINUTES=15, subTimer=null;
let colorPickerFor=null;
let calSubOpen=false;   // manual override; the card is always shown when SUBS is empty
let calDataOpen=false;  // backup/export/import section, collapsed by default
const CAL_COLORS=['#5fd8f5','#88a4dd','#9688dd','#c188dd','#dd88cf','#dd88a4',
                  '#dd9688','#ddc188','#cfdd88','#a4dd88','#88dd96','#88ddc1'];
const TASK_COLOR='#ffc247';   // mirrors --amber, for inline styles hexA() has to compute on
function eventColor(e){
  if(e.src==='sub'){ const s=SUBS.find(x=>x.id===e.subId); return s?s.color:'#5fd8f5'; }
  return '#5fd8f5';
}

function proxied(url){
  let u=url.trim().replace(/^webcal:\/\//i,'https://');
  if(!SUB_PROXY) return u;
  const p=SUB_PROXY.trim();
  return p.includes('{url}') ? p.replace('{url}',encodeURIComponent(u))
       : p.replace(/\/$/,'')+'/'+u;
}
function hostnameOf(url){
  try{ return new URL(url.trim().replace(/^webcal:\/\//i,'https://')).hostname.replace(/^www\./,''); }
  catch{ return 'Calendar'; }
}

async function subFetchOne(sub,quiet){
  if(!quiet){ sub.status='loading'; sub.msg='Fetching calendar…'; render(); }
  try{
    const r=await fetch(proxied(sub.url),{headers:{'Accept':'text/calendar'}});
    if(!r.ok) throw new Error('Server replied '+r.status+'. Check the URL and your proxy.');
    const txt=await r.text();
    if(!/BEGIN:VCALENDAR/i.test(txt)) throw new Error('That URL did not return an iCal feed.');
    const cn=extractCalName(txt);
    if(cn) sub.name=cn;
    sub.events=parseICS(txt).map(e=>({...e,src:'sub',subId:sub.id}));
    sub.status='live'; sub.msg=''; sub.last=new Date();
  }catch(e){
    sub.status='error';
    sub.msg=/Failed to fetch|NetworkError|CORS/i.test(e.message)
      ? 'Blocked by the browser (CORS). Add a proxy URL above — see setup notes.'
      : e.message;
  }
}
function subFetchAll(quiet){
  if(!SUBS.length) return Promise.resolve();
  return Promise.allSettled(SUBS.map(s=>subFetchOne(s,quiet))).then(()=>{
    saveAll();
    (quiet&&activeTab==='cal')?refreshDots():render();
  });
}
function startSubTimer(){
  if(subTimer) clearInterval(subTimer);
  if(!SUBS.length) return;
  subTimer=setInterval(()=>subFetchAll(true),Math.max(5,SUB_MINUTES)*60000);
}
function subSetProxy(v){ SUB_PROXY=v.trim(); saveAll(); }
function subSetMinutes(v){ SUB_MINUTES=parseInt(v)||15; startSubTimer(); saveAll(); }

function subAddCalendar(){

  const url=inp.value.trim(); if(!url) return;
  const sub={id:'s'+Date.now()+Math.floor(Math.random()*1000), url,
    name:hostnameOf(url), color:CAL_COLORS[SUBS.length%CAL_COLORS.length],
    status:'loading', msg:'Fetching calendar…', last:null, events:[]};
  SUBS.push(sub);
  calSubOpen=true;   // keep the card open through this add — it only defaults to collapsed on a fresh visit
  render();
  subFetchOne(sub,false).then(()=>{ startSubTimer(); saveAll(); render(); });
}
function subRefreshOne(id){
  const s=SUBS.find(x=>x.id===id); if(!s) return;
  subFetchOne(s,false).then(()=>{ saveAll(); render(); });
}
function subRemoveCalendar(id){
  const i=SUBS.findIndex(s=>s.id===id); if(i<0) return;
  if(!confirm('Remove "'+(SUBS[i].name||'this calendar')+'"?')) return;
  SUBS.splice(i,1);
  startSubTimer();
  saveAll(); render();
}

let IMPORTED=[];           // {id,title,start:Date,dur,allDay,rrule,src:'ics'|'manual'}
// {id,title,done,doneAt,date:'YYYY-MM-DD'|null,time:'HH:MM'|null,createdAt}
// No defaults — the list starts empty and is entirely the user's.
let TASKS=[];
// Blood-pressure log: {id, sys, dia, pulse|null, ts} with ts an ISO string.
// Kept sorted oldest-first, which the chart and "latest" lookup both rely on.
let BP=[];
let importInfo='';
/* ---------- LOCAL PERSISTENCE ----------
   Saves to this device's browser storage. Sandboxed previews block it,
   so every call degrades quietly to in-memory instead of throwing. */
const DB_KEY='zeus.protocol.v2';
const APP_VERSION='1.0';
let canPersist=true, lastSaveOk=null;

// Keys this build knows about. Anything else found in a saved payload is a
// key from a newer version: kept in UNKNOWN_STATE and written back out, so
// downgrading and re-upgrading does not silently drop data.
const STATE_KEYS=['v','schema','exportedAt','appVersion','ROUTINES','SUPP_BLOCKS','state',
  'suppState','optOn','PANELS','seenDefaults','IMPORTED','SUBS','SUB_URL','SUB_PROXY',
  'SUB_MINUTES','EAT_START','EAT_END','TASKS','BP','DISPLAY_NAME','SECTIONS'];
let UNKNOWN_STATE={};

/* The single source of truth for what gets persisted. saveAll() writes this,
   and the backup export writes this plus its own metadata, so a new key added
   here reaches both without touching the export.

   Deliberately excluded, all reconstructed at runtime:
     - SUBS[].events   re-fetched from the feed on every load
     - status/msg/busy flags   in-flight UI state, meaningless once reloaded
     - undoPending     a 5-second buffer; restoring it would be nonsense
     - view state (activeTab, viewDate, calMode, scroll positions, sheet
       state, cmpA/cmpB)   where the user was, not what they own */
function collectState(){
  return {
    ...UNKNOWN_STATE,
    v:2, ROUTINES, SUPP_BLOCKS, state, suppState, optOn, PANELS, seenDefaults, TASKS, BP,
    DISPLAY_NAME, SECTIONS,
    IMPORTED: IMPORTED.map(e=>({...e,start:e.start.toISOString()})),
    SUBS: SUBS.map(s=>({id:s.id,url:s.url,name:s.name,color:s.color,status:s.status,msg:s.msg,
      last:s.last?new Date(s.last).toISOString():null})),
    SUB_PROXY, SUB_MINUTES, EAT_START, EAT_END
  };
}
let lastSavedJSON=null;
function saveAll(){
  if(!canPersist) return;
  try{
    const json=JSON.stringify(collectState());
    localStorage.setItem(DB_KEY, json);
    lastSaveOk=true;
    // render() calls saveAll() on every single render, including ones
    // that changed nothing (a re-render from a completed cloud push,
    // say). Only mark dirty when the payload actually differs — otherwise
    // that push's own render() re-arms cloudSchedulePush(), which fires
    // again in 3s and calls render() again: a self-sustaining loop that
    // silently rebuilt the whole tab (wiping any in-progress typing,
    // e.g. a Connections token label) every few seconds forever.
    if(json!==lastSavedJSON){ lastSavedJSON=json; cloudMarkDirty(); }
  }catch(e){ canPersist=false; lastSaveOk=false; }
}
// Old saved panels kept values as {markerKey:{v,unit}}; convert to the
// new array-of-parsed-values shape so nothing gets discarded on load.
function migratePanel(p){
  if(Array.isArray(p.values)) return p;
  const values=Object.entries(p.values||{}).map(([k,val])=>{
    const mk=MARKERS.find(m=>m.k===k);
    return {key:k, section:'', label:mk?mk.n:k, displayName:mk?mk.n:k,
      v:val.v, text:null, qual:'', unit:val.unit||(mk?mk.u:''),
      refLo:mk?mk.lo:null, refHi:mk?mk.hi:null};
  });
  return {id:p.id, date:p.date, name:p.name, label:'', values, createdAt:p.createdAt||''};
}

// PANELS is always ordered by the panel's own collection date, never by
// upload order, so importing an older report later does not change which
// panel counts as newest. createdAt breaks ties within one date.
function sortPanels(){
  PANELS.sort((a,b)=>a.date.localeCompare(b.date)
    || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
}

function applyBackup(d){
  UNKNOWN_STATE={};
  Object.keys(d||{}).forEach(k=>{ if(!STATE_KEYS.includes(k)) UNKNOWN_STATE[k]=d[k]; });
  // Descriptions are optional everywhere, so default them on load instead of
  // migrating; an older backup then still imports cleanly.
  const withDesc=o=>({...o, notes: typeof o.notes==='string'?o.notes:'',
    checklist: Array.isArray(o.checklist)?o.checklist:[]});
  if(Array.isArray(d.ROUTINES)&&d.ROUTINES.length) ROUTINES=d.ROUTINES.map(withDesc);
  if(Array.isArray(d.SUPP_BLOCKS)&&d.SUPP_BLOCKS.length)
    SUPP_BLOCKS=d.SUPP_BLOCKS.map(b=>({...b, items:(b.items||[]).map(withDesc)}));
  seenDefaults=Array.isArray(d.seenDefaults)?d.seenDefaults:[];
  mergeNewDefaults();
  state=d.state||{}; suppState=d.suppState||{}; optOn=d.optOn||{};
  IMPORTED=(d.IMPORTED||[]).map(e=>({...e,start:new Date(e.start)}));
  PANELS=(d.PANELS||[]).map(migratePanel);
  // Blood-pressure log. Sorted on load so a reading typed in with an
  // edited timestamp still lands in chronological order.
  BP=(Array.isArray(d.BP)?d.BP:[]).filter(r=>r&&r.ts).sort((a,b)=>a.ts.localeCompare(b.ts));
  // Tasks saved before notes/subtasks/order existed get the fields defaulted
  // here rather than rewritten, so an older backup still loads cleanly.
  TASKS=(Array.isArray(d.TASKS)?d.TASKS:[]).map((t,i)=>({
    ...t,
    notes: typeof t.notes==='string'?t.notes:'',
    subtasks: Array.isArray(t.subtasks)?t.subtasks:[],
    order: typeof t.order==='number'?t.order:i
  }));
  sortPanels();
  if(Array.isArray(d.SUBS)){
    SUBS=d.SUBS.map(s=>({...s,last:s.last?new Date(s.last):null,events:[]}));
  }else if(d.SUB_URL){
    SUBS=[{id:'s'+Date.now(),url:d.SUB_URL,name:hostnameOf(d.SUB_URL),color:CAL_COLORS[0],
      status:'idle',msg:'',last:null,events:[]}];
  }else{
    SUBS=[];
  }
  SUB_PROXY=d.SUB_PROXY||''; SUB_MINUTES=d.SUB_MINUTES||15;
  if(typeof d.EAT_START==='number') EAT_START=d.EAT_START;
  if(typeof d.EAT_END==='number') EAT_END=d.EAT_END;
  DISPLAY_NAME=typeof d.DISPLAY_NAME==='string'?d.DISPLAY_NAME:'';
  SECTIONS=normalizeSections(d.SECTIONS);
}

function loadAll(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw){ mergeNewDefaults(); lastSaveOk=true; return; }
    applyBackup(JSON.parse(raw));
    lastSaveOk=true;
  }catch(e){ canPersist=false; lastSaveOk=false; }
}
/* Adds defaults that shipped in a newer version, without touching the
   user's own edits. Anything already reconciled once stays deleted if
   the user removed it on purpose. */
function mergeNewDefaults(){
  let added=0;
  DEFAULT_ROUTINES.forEach(def=>{
    if(seenDefaults.includes('r:'+def.id)) return;
    if(!ROUTINES.some(r=>r.id===def.id)){ ROUTINES.push(cloneR(def)); added++; }
  });
  DEFAULT_SUPPS.forEach(defB=>{
    const key='b:'+defB.id;
    let blk=SUPP_BLOCKS.find(b=>b.id===defB.id);
    if(!blk){
      if(!seenDefaults.includes(key)){ SUPP_BLOCKS.push(JSON.parse(JSON.stringify(defB))); added++; }
      return;
    }
    defB.items.forEach(it=>{
      const ik='s:'+defB.id+':'+it.id;
      if(seenDefaults.includes(ik)) return;
      if(!blk.items.some(x=>x.id===it.id)){ blk.items.push({...it}); added++; }
    });
  });
  seenDefaults=[
    ...DEFAULT_ROUTINES.map(r=>'r:'+r.id),
    ...DEFAULT_SUPPS.map(b=>'b:'+b.id),
    ...DEFAULT_SUPPS.flatMap(b=>b.items.map(i=>'s:'+b.id+':'+i.id))
  ];
  if(added) console.log('Merged '+added+' new default item(s).');
  return added;
}
